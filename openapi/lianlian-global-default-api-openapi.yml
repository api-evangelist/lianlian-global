                    maxLength: 64
                  uboPersIdNo:
                    type: string
                    description: 受益人身份证号
                    maxLength: 32
                  uboPersIdIsLt:
                    type: string
                    description: '受益人证件有效期是否为长期，填写方式如下


                      |传输值|解释|

                      |-----|-----|

                      |0|长期|

                      |1|非长期|'
                    enum:
                    - 0
                    - 1
