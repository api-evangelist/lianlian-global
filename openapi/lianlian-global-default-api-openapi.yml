            |400230|收款人风控拦截|

            |400231|收款人反洗钱拦截|

            '
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: 修改收款人信息
      parameters:
      - in: body
        name: body
        schema:
          type: object
          description: Payee info record object in Lianlian Pay's system
          title: payee
          properties:
            payeeNameCn:
              type: string
              description: 收款人中文名称
              maxLength: 64
            payeeNameEn:
              type: string
