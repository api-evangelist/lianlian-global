                |传输值|解释|

                |-----|-----|

                |0|长期|

                |1|非长期|'
              enum:
              - 0
              - 1
            payeeIdIssue:
              type: string
              description: 收款人证件签发日,格式：yyyyMMdd
              minLength: 8
