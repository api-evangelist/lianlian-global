openapi: 3.2.0
info:
  title: Lianlian Global 接口 API
  version: '1.0'
  description: 'Operations tagged 接口 across 44 of this provider''s published API definitions: lianlian-global-b2b-cross-border-distribution-import-openapi.yml, lianlian-global-b2b-cross-border-distribution-openapi.yml, lianlian-global-b2b-cross-border-document-openapi.yml, lianlian-global-b2b-cross-border-event-import-openapi.yml, lianlian-global-b2b-cross-border-event-openapi.yml, lianlian-global-b2b-cross-border-funding-import-openapi.yml, lianlian-global-b2b-cross-border-funding-openapi.yml, lianlian-global-b2b-cross-border-fxrate-openapi.yml, lianlian-global-b2b-cross-border-payee-openapi.yml, lianlian-global-b2b-cross-border-payer-openapi.yml, lianlian-global-b2b-cross-border-payout-import-openapi.yml, lianlian-global-b2b-cross-border-payout-openapi.yml, lianlian-global-b2b-cross-border-shop-openapi.yml, lianlian-global-b2b-cross-border-tradefile-import-openapi.yml, lianlian-global-b2b-cross-border-tradefile-openapi.yml, lianlian-global-b2b-cross-border-virtualaccount-import-openapi.yml, lianlian-global-b2b-cross-border-virtualaccount-openapi.yml, lianlian-global-b2b-cross-border-webhook-import-openapi.yml, lianlian-global-b2b-cross-border-webhook-openapi.yml, lianlian-global-b2b-inflow-payout-distribution-openapi.yml, lianlian-global-b2b-inflow-payout-document-openapi.yml, lianlian-global-b2b-inflow-payout-event-openapi.yml, lianlian-global-b2b-inflow-payout-funding-openapi.yml, lianlian-global-b2b-inflow-payout-fxrate-openapi.yml, lianlian-global-b2b-inflow-payout-hk-payee-openapi.yml, lianlian-global-b2b-inflow-payout-payee-openapi.yml, lianlian-global-b2b-inflow-payout-payout-openapi.yml, lianlian-global-b2b-inflow-payout-shop-openapi.yml, lianlian-global-b2b-inflow-payout-tradefile-openapi.yml, lianlian-global-b2b-inflow-payout-virtualaccount-openapi.yml, lianlian-global-b2b-inflow-payout-webhook-openapi.yml, lianlian-global-connect-ota-account-openapi.yml, lianlian-global-connect-ota-document-openapi.yml, lianlian-global-connect-ota-event-openapi.yml, lianlian-global-connect-ota-funding-openapi.yml, lianlian-global-connect-ota-fxrate-openapi.yml, lianlian-global-connect-ota-member-openapi.yml, lianlian-global-connect-ota-payout-openapi.yml, lianlian-global-connect-ota-tradefile-openapi.yml, lianlian-global-connect-ota-webhook-openapi.yml, lianlian-global-llp-api-common-openapi.yml, lianlian-global-llp-api-userapi-regular-openapi.yml, lianlian-global-llp-api-userapi-supplier-openapi.yml, lianlian-global-llp-api-userapi-wallet-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://global-api-sandbox.lianlianpay-inc.com/b2b-import/v1
- url: https://global-api-sandbox.lianlianpay-inc.com/b2b-export/v1
- url: https://global-api-sandbox.lianlianpay-inc.com/common/v1
- url: http://global-api-sandbox.lianlianpay-inc.com/disbursement/v1
- url: https://global-api-sandbox.lianlianpay-inc.com/b2b-import
- url: https://global-api-sandbox.lianlianpay-inc.com/b2b-export
- url: https://global-api-sandbox.lianlianpay-inc.com/connect/v1
- url: http://global-api-sandbox.lianlianpay-inc.com/connect/v1
- url: https://gtest-open-api.lianlianpay-inc.com/api/
- url: https://global-api-sandbox.lianlianpay-inc.com/supplier/v1
- url: https://global-api-sandbox.lianlianpay-inc.com/
tags:
- name: 接口
paths:
  /distribute:
    post:
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/new-model'
      summary: 提交分账指令
      tags:
      - 接口
      requestBody:
        content:
          application/json:
            schema:
              type: object
              title: 分账
              description: 连连侧分账指令对象
              properties:
                distributeId:
                  type: string
                  description: '商户侧分账指令唯一编号

                    '
                  maxLength: 64
                tradeFileId:
                  type: string
                  description: 平台侧订单唯一编号
                  maxLength: 64
                distributeCurrency:
                  type: string
                  description: 分账币种，参考附录币种代码
                  minLength: 3
                  maxLength: 3
                distributeAmount:
                  type: string
                  description: 分账金额
                  maxLength: 10
    servers:
    - url: https://global-api-sandbox.lianlianpay-inc.com/b2b-import/v1
  /distribute/{distributeId}:
    parameters:
    - name: distributeId
      in: path
      required: true
      description: 商户侧分账指令唯一编号
      schema:
        type: string
        maxLength: 64
    get:
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/new-model'
      summary: 查询分账指令信息
      tags:
      - 接口
    servers:
    - url: https://global-api-sandbox.lianlianpay-inc.com/b2b-import/v1
  /documents:
    post:
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/document'
        '400':
          description: 'Possible error codes:


            | Code | Description |

            |------|-------------|

            | 510002 | Unsupported document type. |

            | 999995 | \[PARAMETER\] ERROR_MESSAGE |'
          content:
            application/json:
              schema:
                type: object
        '500':
          description: ''
      summary: 上传文件
      description: '上传文件至连连，连连会返回`Document.id`用以标识对接方上传的文件

        '
      operationId: upload-document
      tags:
      - 接口
      parameters:
      - in: header
        name: Idempotency-Key
        description: '**Optional**


          A unique value generated by the client which the server uses to recognize subsequent retries of the same request.'
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                file:
                  description: 文件
                  type: object
              required:
              - file
      security:
      - authorization: []
    servers:
    - url: https://global-api-sandbox.lianlianpay-inc.com/common/v1
  /documents/{documentId}:
    parameters:
    - name: documentId
      in: path
      required: true
      schema:
        type: string
    get:
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: string
                format: byte
                description: Document data streaming
        '404':
          description: ''
        '500':
          description: ''
      summary: 下载文件
      description: '使用`dcoumentId` 下载文件


        '
      operationId: download-document
      tags:
      - 接口
      security:
      - authorization: []
    servers:
    - url: https://global-api-sandbox.lianlianpay-inc.com/common/v1
  /events:
    get:
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: 总数
                  list:
                    type: array
                    description: 事件对象列表
                    items:
                      $ref: '#/components/schemas/Event'
                required:
                - total
                - list
        '400':
          description: 'Possible error codes:


            | Code | Description |

            |------|-------------|

            | 999995 | \[PARAMETER\] ERROR_MESSAGE |'
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '500':
          description: ''
      summary: 查询事件列表
      description: 查询事件列表
      operationId: get-event-list
      tags:
      - 接口
      parameters:
      - in: query
        name: topic
        description: 连连定义的Event topic
        schema:
          type: string
      - in: query
        name: pageNum
        allowEmptyValue: true
        description: 页码
        schema:
          type: integer
          default: 1
          minimum: 1
      - in: query
        name: pageSize
        allowEmptyValue: true
        description: 分页大小
        schema:
          type: integer
          default: 20
      security:
      - authorization: []
      - llpay-signature: []
    servers:
    - url: https://global-api-sandbox.lianlianpay-inc.com/common/v1
  /events/{eventId}:
    parameters:
    - name: eventId
      in: path
      required: true
      schema:
        type: string
    get:
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          description: ''
        '500':
          description: ''
      summary: 查询事件
      description: 根据eventId查询事件对象
      tags:
      - 接口
      operationId: get-event
      security:
      - authorization: []
      - llpay-signature: []
    servers:
    - url: https://global-api-sandbox.lianlianpay-inc.com/common/v1
  /funding/{fundingId}:
    parameters:
    - name: fundingId
      in: path
      required: true
      schema:
        type: string
    get:
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/new-model_3'
      summary: 查询加款信息
      tags:
      - 接口
    patch:
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/new-model_4'
        '400':
          description: 'Bad Request


            Possible error codes:


            | 错误码 | 解释 |

            |------|-------------|

            | 999995 |参数错误 |

            |170102|加款类型不允许红冲|

            |170103|加款单已红冲|

            |170104|加款单状态不可红冲|

            |170105|红冲异常|

            |170106|已分账，不可红冲|

            |170107|已分发，不可红冲|'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: 发起红冲
      description: 将已加款成功的资金退回
      tags:
      - 接口
    servers:
    - url: https://global-api-sandbox.lianlianpay-inc.com/b2b-import/v1
  /fundings:
    get:
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/new-model_3'
      summary: 批量查询加款信息
      tags:
      - 接口
      parameters:
      - in: query
        name: receivingAcctNo
        description: 收款虚拟卡号
        schema:
          type: string
          maxLength: 32
      - in: query
        name: pageNum
        description: '查询页码


          若返回数据为多条，可以将数据进行分页，将该字段与`pageSize` 配合使用

          '
        schema:
          type: integer
          default: 1
          minimum: 1
      - in: query
        name: pagSize
        description: '单页展示数据条数


          若返回数据为多条，需要将该字段与`pageNum`联合使用，单页做多数据展示条数为20条

          '
        schema:
          type: integer
          default: 20
          maximum: 20
    servers:
    - url: https://global-api-sandbox.lianlianpay-inc.com/b2b-import/v1
  /rate/{rateType}/{sourceCurrency}/{targetCurrency}:
    parameters:
    - name: sourceCurrency
      in: path
      required: true
      description: 源币种
      schema:
        type: string
        maxLength: 3
    - name: targetCurrency
      in: path
      required: true
      description: 目的币种
      schema:
        type: string
        maxLength: 3
    - name: rateType
      in: path
      required: true
      description: "汇率类型, 传输方式如下 \n|传输值|解释|\n|----|-----|\n|reference|参考汇率|"
      schema:
        type: string
        maxLength: 10
    get:
      summary: 查询汇率
      tags:
      - 接口
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rate'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
        ? ''
        : description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rate'
      operationId: get-rate
      description: ''
      security:
      - authorization: []
      - llpay-signature: []
    servers:
    - url: http://global-api-sandbox.lianlianpay-inc.com/disbursement/v1
  /payee:
    post:
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/payee'
        '400':
          description: 'Bad Request


            Possible error codes:


            | 错误码 | 描述 |

            |------|-------------|

            | 999995 |参数错误|

            |300001|PayeeId 重复|

            |400213|收款人证件号错误|

            |300004|收款人UBO证件号错误|

            |400230|收款人风控拦截|

            |400231|收款人反洗钱拦截|

            '
        '500':
          description: Internal Server Error
      description: 创建收款人
      summary: 创建收款人
      tags:
      - 接口
      requestBody:
        content:
          application/json:
            schema:
              type: object
              title: 收款人
              description: 连连侧收款人对象
              properties:
                payeeId:
                  type: string
                  description: 商户侧收款人唯一编号
                  maxLength: 64
                payeeType:
                  type: string
                  description: '收款人类型，填写方式如下


                    |传输值|解释|

                    |----|-----|

                    |Individual|个人收款人|

                    |Corporate|企业收款人|'
                  enum:
                  - Individual
                  - Corporate
                payeeNameCn:
                  type: string
                  description: 收款人中文名称
                  maxLength: 64
                payeeNameEn:
                  type: string
                  description: 收款人英文名称
                  maxLength: 64
                payeeDate:
                  type: string
                  description: '收款人出生或成立日，


                    若收款人为个人，则为个人出生日期

                    若收款人为企业，则为企业注册日期


                    格式：yyyyMMdd'
                  minLength: 8
                  maxLength: 8
                payeeIdType:
                  type: string
                  description: '收款人证件类型，填写方式如下

                    |传输值|收款人类型|解释|

                    |----|-----|----|

                    |0|Individual|个人身份证|

                    |1|Corporate|统一社会信用代码|'
                  enum:
                  - 0
                  - 1
                payeeIdScanFront:
                  type: string
                  description: 收款人证件照片（正面）
                  maxLength: 64
                payeeIdScanBack:
                  type: string
                  description: '收款人证件照片（反面）


                    若payeeType=''Individual''则这个字段为必填'
                  maxLength: 64
                payeeIdNo:
                  type: string
                  description: 收款人证件号
                  maxLength: 32
                payeeAddress:
                  type: string
                  description: '收款人地址，

                    若收款人为企业，则传输企业注册地址

                    若收款人为个人，则传输个人居住地址'
                  maxLength: 128
                payeeOperateAddress:
                  type: string
                  description: 企业经营地址，若收款人为企业，则该字段传企业经营地址
                  maxLength: 128
                payeeIdIsLt:
                  type: string
                  description: '收款人证件是否为长期，填写方式如下


                    |传输值|解释|

                    |-----|-----|

                    |0|长期|

                    |1|非长期|'
                  enum:
                  - 0
                  - 1
                payeeIdIssue:
                  type: string
                  description: 收款人证件签发日,格式：yyyyMMdd
                  minLength: 8
                  maxLength: 8
                payeeIdExpiry:
                  type: string
                  description: 收款人证件有效期，若收款人证件为非长期，则该字段必填，格式：yyyyMMdd
                  minLength: 8
                  maxLength: 8
                payeeContactNo:
                  type: string
                  description: '收款人联系方式（个人手机号、企业联系人手机号）

                    '
                  minLength: 11
                  maxLength: 11
                corporateNature:
                  type: string
                  description: '公司性质，若payeeType=''Corporate''则这个字段为必填，填写方式如下


                    |传输值|解释|

                    |---|----|

                    |0|股份公司|

                    |1|个人经营|

                    |2|国有企业|

                    |3|合伙经营|

                    |4|上市企业|'
                  enum:
                  - 0
                  - 1
                  - 2
                  - 3
                  - 4
                legalPersIdScanFront:
                  type: string
                  description: 法人身份证正面（国徽面），若payeeType='Corporate'则这个字段为必填
                  maxLength: 64
                legalPersIdScanBack:
                  type: string
                  description: 法人身份证反面（人像面），若payeeType='Corporate'则这个字段为必填
                  maxLength: 64
                legalPersNameCn:
                  type: string
                  description: 法人名称，若payeeType='Corporate'则这个字段为必填
                  maxLength: 64
                legalPersNameEn:
                  type: string
                  description: 法人名称（拼音），若payeeType='Corporate'则这个字段为必填
                  maxLength: 64
                legalPersIdNo:
                  type: string
                  description: 法人身份证号，若payeeType='Corporate'则这个字段为必填
                  maxLength: 32
                legalPersIdIsLt:
                  type: string
                  description: '法人证件有效期是否为长期，填写方式如下


                    |传输值|解释|

                    |-----|-----|

                    |0|长期|

                    |1|非长期|'
                  enum:
                  - 0
                  - 1
                legalPersIdIssue:
                  type: string
                  description: 法人证件签发日，若payeeType='Corporate'且证件非长期则这个字段为必填，格式：yyyyMMdd
                  minLength: 8
                  maxLength: 8
                legalPersIdExpiry:
                  type: string
                  description: 法人证件有效期，若payeeType='Corporate'且证件非长期则这个字段为必填
                  minLength: 8
                  maxLength: 8
                legalPersIdAddress:
                  type: string
                  description: 法人地址，若payeeType='Corporate'则这个字段为必填
                  maxLength: 128
                uboInfo:
                  type: array
                  description: 受益人信息，若payeeType='Corporate'则这个字段为必填
                  items:
                    type: object
                    properties:
                      uboId:
                        type: string
                        description: 商户侧收益人唯一编号
                        maxLength: 64
                      uboPersIdScanFront:
                        type: string
                        description: 受益人身份证正面（国徽面）
                        maxLength: 64
                      uboPersIdScanBack:
                        type: string
                        description: 受益人身份证反面（人像面）
                        maxLength: 64
                      uboNameCn:
                        type: string
                        description: 受益人名称
                        maxLength: 64
                      uboNameEn:
                        type: string
                        description: 受益人名称（拼音）
                        maxLength: 64
                      uboPersIdNo:
                        type: string
                        description: 受益人身份证号
                        maxLength: 32
                      uboPersIdIsLt:
                        type: string
                        description: '受益人证件有效期是否为长期，填写方式如下


                          |传输值|解释|

                          |-----|-----|

                          |0|长期|

                          |1|非长期|'
                        enum:
                        - 0
                        - 1
                      uboPersIdIssue:
                        type: string
                        description: 受益人身份证签发日期，若证件非长期则必填，格式：yyyyMMdd
                        minLength: 8
                        maxLength: 8
                      uboPersIdExpiry:
                        type: string
                        description: 受益人身份证有效期，若证件非长期则必填，格式：yyyyMMdd
                        minLength: 8
                        maxLength: 8
                      uboAddress:
                        type: string
                        description: 受益人地址
                        maxLength: 128
                      uboEvidence:
                        type: string
                        description: 受益人证明文件
                        maxLength: 64
              required:
              - payeeId
              - payeeType
              - payeeNameCn
              - payeeNameEn
              - payeeDate
              - payeeIdType
              - payeeIdScanFront
              - payeeIdNo
              - payeeAddress
              - payeeIdIsLt
              - payeeIdExpiry
              - payeeContactNo
    servers:
    - url: https://global-api-sandbox.lianlianpay-inc.com/b2b-export/v1
  /payee/{payeeId}:
    parameters:
    - name: payeeId
      in: path
      required: true
      description: 商户侧收款人唯一编号
      schema:
        type: string
        maxLength: 64
    get:
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/payee'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: 查询收款人
      description: 查询收款人信息
      tags:
      - 接口
    put:
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/payee'
        '400':
          description: 'Bad Request


            Possible error codes:


            | 错误码 | 解释 |

            |------|-------------|

            | 999995 |参数错误 |

            |300005|收款人信息不允许修改|

            |400213|收款人证件号错误|

            |300004|UBO证件号错误|

            |400230|收款人风控拦截|

            |400231|收款人反洗钱拦截|

            '
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
      summary: 修改收款人信息
      tags:
      - 接口
      requestBody:
        content:
          application/json:
            schema:
              type: object
