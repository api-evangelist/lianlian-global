              description: 法人名称，若payeeType='Corporate'则这个字段为必填
              maxLength: 64
            legalPersNameEn:
              type: string
              description: 法人名称（拼音），若payeeType='Corporate'则这个字段为必填
              maxLength: 64
            legalPersIdNo:
