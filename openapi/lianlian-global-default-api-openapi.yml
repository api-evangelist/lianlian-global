                  minLength: 8
                  maxLength: 32
                withdrawCurrency:
                  type: string
                  description: 提现币种
                  enum:
                  - USD
                  - CAD
                  - EUR
                  - GBP
                  - JPY
                  - HKD
                  - AUD
                  - IDR
                  - SGD
                  - AED
                arrivalCurrency:
                  type: string
                  description: 到账币种
                  enum:
                  - USD
                  - CAD
                  - EUR
                  - GBP
                  - JPY
                  - HKD
                  - AUD
                  - CNY
                  - SGD
                  - CNH
                cardId:
                  type: string
                  description: 提现收款银行卡编号
                captcha:
                  type: string
                  description: 短信验证码
                withdrawDetailList:
                  type: array
                  items:
                    type: object
                    properties:
                      accountId:
                        type: string
                        description: 连连账户编号
                      amount:
                        type: number
                        description: 金额
                    required:
                    - accountId
                    - amount
              required:
              - externalTransId
              - withdrawCurrency
              - arrivalCurrency
              - cardId
              - captcha
              - withdrawDetailList
