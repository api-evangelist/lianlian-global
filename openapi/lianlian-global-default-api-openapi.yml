      description: '用户资金提现只支持单平台单站点多账户提现，不支持跨平台同币种提现。


        目前API接口支持</br>提现币种：USD,CAD,EUR,GBP,JPY,HKD,AUD,IDR,SGD,AED</br>到账币种：USD,CAD,EUR,GBP,JPY,HKD,AUD,CNY,SGD,CNH


        联调地址 - **https://gtest-open-api.lianlianpay-inc.com/api/withdraw/combine/submit** </br>

        生产域名 - **https://global-open-api.lianlianpay.com/withdraw/combine/submit**'
      operationId: withdraw-combine-submit
      parameters:
      - in: header
        name: Authorization
        required: true
        schema:
          type: string
      - in: header
        name: LLPAY-Signature
        required: true
        schema:
          type: string
      - in: header
        name: Content-Type
        required: true
        schema:
          type: string
          default: application/json
