      requestBody:
        content:
          application/json:
            schema:
              type: object
              x-examples:
                Example 1:
                  subAccountName: zwytest_subaccount_1
              required:
              - subAccountName
              properties:
                subAccountName:
                  type: string
                  description: 子账户名称</br>幂等返回
            examples:
              Example 1:
                value:
                  subAccountName: test
