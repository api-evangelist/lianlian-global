  /gateway/vcc-api/card POST:
    parameters: []
    post:
      summary: 申请卡
      operationId: post-vcc-apply-card
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  Example 1:
                    code: 100001
                    data:
                      cardId: '2024110661353586'
                    success: true
                    message: SUCCESS
                required:
                - code
                - success
                - message
                properties:
                  code:
                    type: integer
                    description: 响应码
                  data:
                    type: object
                    properties:
                      cardId:
                        type: string
                        description: 卡唯一识别号
                  success:
                    type: boolean
                    description: 成功标识
                  message:
                    type: string
                    description: 响应描述
              examples:
                Example 1:
                  value:
                    code: 100001
                    data:
                      cardId: '2023092284439339'
                    success: true
                    message: SUCCESS
        '400':
          description: Missing Required Information
        '409':
          description: Email Already Taken
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - currency
              - cardName
              - email
              - settleCurrencyCode
              - cardBinName
              properties:
                currency:
                  type: string
                  description: 基础币种（充值币种），支持USD/CNY等，具体结合业务场景和连连侧线下沟通确认开通
                cardName:
                  type: string
                  description: 自定义卡片名称，可使用交易对手名称或订单编号等
                email:
                  type: string
                  description: 联系邮箱，用于接收该卡的额度变动通知
                expiryDate:
                  type: string
                  description: 卡有效期，格式：MMYY，建议不超过4年11个月，例如 0426指的是  26年4月份过期
                settleCurrencyCode:
                  type: string
                  x-stoplight:
                    id: dneqj6v6pypdu
                  description: 结算币种，只有使用特殊卡bin，才会用到该字段
                cardBinName:
                  type: string
                  x-stoplight:
                    id: gcm11tqsi3iyg
                  description: 卡BIN，6位纯数字</br>可登陆越达卡后台点击申卡查看可选卡BIN
                tradeSceneCode:
                  type: string
