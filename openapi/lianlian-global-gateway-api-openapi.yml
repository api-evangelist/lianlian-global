openapi: 3.2.0
info:
  title: Lianlian Global Gateway API
  version: '1.0'
  description: 'Operations tagged Gateway across 5 of this provider''s published API definitions: lianlian-global-cards-open-api-balance-apis-openapi.yml, lianlian-global-cards-open-api-card-apis-openapi.yml, lianlian-global-cards-open-api-controls-apis-openapi.yml, lianlian-global-cards-open-api-transactions-apis-openapi.yml, lianlian-global-connect-file-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://test-global-api.lianlianpay-inc.com
- url: https://global-api.lianlian.com
  description: ''
- url: http://localhost:3000
tags:
- name: Gateway
paths:
  /gateway/vcc-api/account:
    parameters: []
    get:
      summary: 查询账户余额
      tags:
      - Gateway
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  Example 1:
                    code: 100001
                    data:
                      merchantId: vcc_merchant_001
                      accountList:
                      - amount: '1082.00'
                        currency: USD
                        frozenAmount: '0.00'
                      userId: '2023012966287896'
                    success: true
                    message: SUCCESS
                properties:
                  code:
                    type: integer
                    description: 响应码
                  data:
                    type: object
                    properties:
                      merchantId:
                        type: string
                      accountList:
                        type: array
                        description: 账单币种账户列表
                        items:
                          type: object
                          properties:
                            amount:
                              type: string
                              description: 可用金额
                            currency:
                              type: string
                              description: 账单币种，参考ISO currency code
                            frozenAmount:
                              type: string
                              description: 待出账金额：已发生授权但尚未出账的金额
                      userId:
                        type: string
                        description: VCC用户号
                  success:
                    type: boolean
                    description: 成功标识
                  message:
                    type: string
                    description: 响应描述
              examples:
                Example 1:
                  value:
                    code: 100001
                    data:
                      accountList:
                      - amount: '99800.00'
                        currency: GBP
                        frozenAmount: '4414.52'
                      - amount: '0.00'
                        currency: SGD
                        frozenAmount: '0.00'
                      - amount: '999980.00'
                        currency: EUR
                        frozenAmount: '20.00'
                      userId: '2023020766827854'
                    success: true
                    message: SUCCESS
        '404':
          description: User Not Found
      operationId: get-vcc-account-balance
      description: 'Sandbox : https://test-global-api.lianlianpay-inc.com


        Prod    : https://global-api.lianlian.com


        账户余额指的是单用户的各币种余额情况，包含以下几种类型：

        - Pending：授权但尚未被结算的交易总金额，余额处于冻结状态

        - Available：实际可用金额

        '
      x-stoplight:
        id: ixww4yiwjv4m4
      parameters:
      - schema:
          type: string
        in: header
        name: 'Authorization:'
        description: Basic {token}
      - schema:
          type: string
        in: header
        name: 'LLPAY-Signature:'
        description: t={REQUEST_EPOCH},v={payload}
    servers:
    - url: https://test-global-api.lianlianpay-inc.com
    - url: https://global-api.lianlian.com
      description: ''
