      - Gateway
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  Example 1:
                    value:
                      code: 100001
                      data:
                        subAccountName: zwytest_subaccount_1
                        subAccountId: '2025111833865777'
                        status: VALID
                      success: true
                      message: SUCCESS
                properties:
                  value:
                    type: object
                    properties:
                      code:
                        type: integer
                      data:
                        type: object
                        properties:
                          subAccountName:
                            type: string
