openapi: 3.1.0
x-stoplight:
  id: ahystadh3c2yx
info:
  title: Conversion
  version: '1.0'
  description: ''
servers:
  - url: 'https://global-api.lianlian.com/api/v1'
paths:
  /quotes/get_reference_rate:
    parameters: []
    post:
      summary: Get a reference rate
      operationId: post_get_reference_rate
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  currency_pair:
                    type: string
                    x-stoplight:
                      id: i5kvekw9c778c
                    description: 货币对
                    minLength: 6
                    maxLength: 6
                  base_currency:
                    type: string
                    x-stoplight:
                      id: 5qza2y4fqxmv8
                    description: 基准币种，ISO 4217三位字母货币代码
                    minLength: 3
                    maxLength: 3
                  client_rate:
                    type: string
                    x-stoplight:
                      id: h7hv13d0gj7cv
                    description: 参考汇率
                    maxLength: 16
                  sell_currency:
                    type: string
                    x-stoplight:
                      id: xwlhrm4nccask
                    description: 客户卖出币种，ISO 4217三位字母货币代码
                    minLength: 3
                    maxLength: 3
                  buy_currency:
                    type: string
                    x-stoplight:
                      id: xyrqfg8upqk9u
                    description: 客户买入币种，ISO 4217三位字母货币代码
                    minLength: 3
                    maxLength: 3
                  quote_time:
                    type: number
                    x-stoplight:
                      id: v4c5m09eleeg9
                    description: 报价时间
                  settle_date:
                    type: string
                    x-stoplight:
                      id: lo0nplszz2o2n
                    description: 交割日yyyyMMdd
                    minLength: 8
                    maxLength: 8
                required:
                  - currency_pair
                  - base_currency
                  - client_rate
                  - sell_currency
                  - buy_currency
                  - quote_time
                  - settle_date
        '400':
          description: "code | message \r\n---------|----------\r\n INVALID_PARAM | 无效的参数\r\n RATE_NOT_FOUND| 找不到汇率，请联系运营人员\r\n RATE_INVAILD|当前汇率不可用，请稍后再试\r\n SERVICE_UNAVAILABLE | 请求的服务当前不可用"
          content:
            application/json:
              schema:
                $ref: ../models/ErrorNoParamandTraceId.yaml
        '403':
          description: "code | message\r\n---------|----------\r\n FORBIDDEN_ERROR | Authorization failed due to insufficient permissions."
          content:
            application/json:
              schema:
                $ref: ../models/ErrorNoParamandTraceId.yaml
        '429':
          description: "code | message\r\n---------|----------\r\n LIMIT_ERROR | Too many requests. Blocked due to rate limiting."
          content:
            application/json:
              schema:
                $ref: ../models/ErrorNoParamandTraceId.yaml
        '500':
          description: "code | message\r\n---------|----------\r\n INTERNAL_SERVER_ERROR | An internal server error has occurred."
          content:
            application/json:
              schema:
                $ref: ../models/ErrorNoParamandTraceId.yaml
      x-stoplight:
        id: at8axglh35o82
      description: 获取参考汇率。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                business_type:
                  type: string
                  x-stoplight:
                    id: 6gqofcxx3m787
                  description: 业务类型
                  maxLength: 16
                sell_currency:
                  type: string
                  x-stoplight:
                    id: a3pumt703i7kx
                  description: 客户卖出币种，ISO 4217三位字母货币代码
                  minLength: 3
                  maxLength: 3
                buy_currency:
                  type: string
                  x-stoplight:
                    id: 1v84qv5gkghw1
                  description: 客户买入币种，ISO 4217三位字母货币代码
                  minLength: 3
                  maxLength: 3
                settle_type:
                  type: string
                  x-stoplight:
                    id: 3owwqj3gyzf85
                  description: 交割期限，支持T0/T1/T2，默认`T0`
                  maxLength: 8
              required:
                - business_type
                - sell_currency
                - buy_currency
      security:
        - 客户端凭据授权: []
      parameters:
        - $ref: ../Base/Webhooks.yaml#/components/parameters/header-Content-Type
        - $ref: ../Base/Webhooks.yaml#/components/parameters/header-Authorization
  /quotes/get_conversion_rate:
    post:
      summary: Get a conversion rate
      operationId: post-quotes-get_conversion_rate
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  rate_id:
                    type: string
                    x-stoplight:
                      id: acghfb2swzkvh
                    description: 报价唯一识别码
                    maxLength: 32
                    minLength: 16
                  currency_pair:
                    type: string
                    x-stoplight:
                      id: 5h98xq6uu95nk
                    description: 货币对
                    minLength: 6
                    maxLength: 6
                  base_currency:
                    type: string
                    x-stoplight:
                      id: z9qcog311slnj
                    description: 基准币种，ISO 4217三位字母货币代码
