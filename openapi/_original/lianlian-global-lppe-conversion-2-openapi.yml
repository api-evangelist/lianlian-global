                  buy_currency:
                    type: string
                    x-stoplight:
                      id: gi06zd6r5jcum
                    description: 客户买入币种，ISO 4217三位字母货币代码
                    minLength: 3
                    maxLength: 3
                  buy_amount:
                    type: string
                    x-stoplight:
                      id: tqquwqrv6d9ex
                    description: 客户买入币种金额，单位元，支持2位小数
                  base_currency:
                    type: string
                    x-stoplight:
                      id: 8bk94x6wk21f0
                    description: 基准币种，ISO 4217三位字母货币代码
                    minLength: 3
                    maxLength: 3
                  rate_id:
                    type: string
                    x-stoplight:
                      id: kyvpq9m6m5un8
                    description: 报价唯一识别码
                    maxLength: 32
                  client_rate:
                    type: string
                    x-stoplight:
                      id: lwrl7r6xpx8q6
                    description: 客户交易汇率
                    maxLength: 16
                  settle_type:
                    type: string
                    x-stoplight:
                      id: 9p25k4qtrtmg7
                    description: 交割期限，支持T0/T1/T2
                    maxLength: 8
                  settle_date:
                    type: string
                    x-stoplight:
                      id: odoygcgbxkml2
                    description: 交割日期，yyyyMMdd
                    minLength: 8
                    maxLength: 8
                required:
