swagger: '2.0'
info:
  title: 常规用户功能API
  version: '1.0'
  termsOfService: ''
  description: |-
    联调域名 - **https://gtest-open-api.lianlianpay-inc.com** </br>
    生产域名 - **https://global-open-api.lianlianpay.com**
  contact:
    email: dev_support@lianlianpay.com
host: gtest-open-api.lianlianpay-inc.com
paths:
  /vcard/apply:
    post:
      responses:
        '200':
          description: ''
          schema:
            type: object
            properties:
              code:
                type: string
              data:
                type: object
                properties:
                  region:
                    type: string
                    description: 地区
                    enum:
                      - US
                      - CA
                      - EU
                      - UK
                      - JP
                      - AU
                      - SG
                      - AE
                      - ID
                      - IN
                    minLength: 2
                    maxLength: 2
                  currency:
                    type: string
                    description: 参照`MODELS-币种`
                    enum:
                      - USD
                      - AUD
                      - JPY
                      - EUR
                      - GBP
                      - CAD
                      - CNY
                      - HKD
                      - AED
                      - IDR
                      - SGD
                    minLength: 3
                    maxLength: 3
                  virtualCardNo:
                    type: string
                    description: 境外收款账户
                    maxLength: 50
                  accountName:
                    type: string
                    description: 持有人名称
                    maxLength: 200
                  appendInfo:
                    type: string
                    description: 银行卡附加信息
                    maxLength: 1024
                  platform:
                    type: string
                    description: 平台
                    enum:
                      - Amazon
                      - CDiscount
                      - Rakuten
                    maxLength: 50
                required:
                  - region
                  - currency
                  - virtualCardNo
                  - accountName
                  - appendInfo
                  - platform
          examples:
            application/json:
              code: '000000'
              data:
                region: EU
                currency: EUR
                virtualCardNo: FR7611689007000700000000001
                accountName: ceshigongsi
                appendInfo: '{"银行所在地区(Bank Location Country)":"France 法国","银行识别码(BIC)":"CITIFRPP","国际银行账户号码(IBAN)":"FR7611689007000700000000001","账号持有人姓名(Bank Account Holder Name)":"测试公司"}'
                platform: Amazon
        '400':
          description: |-
            | Code | Message | 说明 |
            |------|-------------|-------------|
            | 400001 | signature header is missing |请求头缺失 |
            | 400003 | invalid signature time | 请求头时间戳不合法（请求消息包的签名时间和本地服务器的时间的最大允许阈值10min） |
            | 400004 | invalid signature header scheme | 请求头LLPAY-Signature有误，请参照授权流程中身份认证格式检查 |
            | 400005 | invalid signature header | 请求头LLPAY-Signature有误，请参照授权流程中身份认证格式检查 |
            | 400006 | signature validate fail |验签异常，请参照授权流程中签名规则检查 |
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
              message:
                type: string
          examples:
            application/json:
              error: signature_error
              code: '400006'
              message: signature validate fail
        '402':
          description: |-
            |code|message|说明|
            |-|-|-|
            |999999|System is busy, please retry later.|系统未知异常|
            |999995|参数校验不通过|请求参数不合法|
            |142001|用户kyc信息查询异常|用户kyc信息查询异常|
            |142002|用户kyc信息查询参数校验失败|用户kyc信息查询参数校验失败|
            |142003|用户kyc信息不存在|用户kyc信息不存在|
            |142004|持有人kyc信息不存在|持有人kyc信息不存在|
            |142005|用户kyc风控拒绝|用户kyc风控拒绝|
            |143001|没有找到相应币种的电商平台||
            |144001|该平台可申请虚拟卡上限||
            |144002|虚拟卡申请失败，没有提现银行卡||
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
              message:
                type: string
          examples:
            application/json:
              error: request_failed
              code: '999995'
              message: '[platform=AAA] 输入不支持，比版本支持的平台为''Amazon、CDiscount、Rakuten'''
        '500':
          description: |-
            | Code | Message |
            |------|-------------|
            | 500000 |inner service error |
      summary: 申请境外收款账户
      operationId: vcard-apply
      tags:
        - 接口
      description: |-
        申请境外收款账户

        目前API接口仅支持以下平台地区申卡
        |平台|地区|对应币种
        |-|-|-|
        |Amazon|AE|AED|
        |Amazon|AU|AUD|
        |Amazon|CA|CAD|
        |Amazon|EU|EUR|
        |Amazon|IN|USD|
        |Amazon|JP|JPY|
        |Amazon|SG|SGD|
        |Amazon|UK|GBP|
        |Amazon|US|USD|
        |CDiscount|EU|EUR|
        |Rakuten|EU|EUR|

        联调地址 - **https://gtest-open-api.lianlianpay-inc.com/api/vcard/apply** </br>
        生产域名 - **https://global-open-api.lianlianpay.com/vcard/apply**
      parameters:
        - in: body
          name: body
          schema:
            type: object
            properties:
              region:
                type: string
                description: 地区
                enum:
                  - US
                  - CA
                  - EU
                  - UK
                  - JP
                  - AU
                  - SG
                  - AE
                  - ID
                  - IN
                minLength: 2
                maxLength: 2
              currency:
                type: string
                description: 币种
                enum:
                  - USD
                  - AUD
                  - JPY
                  - EUR
                  - GBP
                  - CAD
                  - CNY
                  - HKD
                  - AED
                  - IDR
                  - SGD
                minLength: 3
                maxLength: 3
              platform:
                type: string
                description: 平台
                enum:
                  - Amazon
                  - CDiscount
                  - Rakuten
                maxLength: 50
              shopName:
                type: string
                maxLength: 32
                description: 店铺名称
              holderId:
                type: string
                description: 持有人编号，可在持有人查询中获取
                maxLength: 20
            required:
              - region
              - currency
              - platform
              - holderId
          x-examples:
            application/json:
              region: EU
              currency: EUR
              platform: Amazon
              shopName: testshopName
              holderId: '2021052800000000'
        - in: header
          name: Authorization
          type: string
          required: true
        - in: header
          name: LLPAY-Signature
          type: string
          required: true
        - in: header
          name: Content-Type
          type: string
          default: application/json
          required: true
      security:
        - Authorization: []
        - LLPAY-Signature: []
  /holder/query/list:
    post:
      responses:
        '200':
          description: |+

          schema:
            type: object
            properties:
              code:
                type: string
              data:
                type: object
                required:
                  - totalSize
                properties:
                  totalSize:
                    type: integer
                  resultList:
                    type: array
                    items:
                      type: object
                      properties:
                        holderId:
                          type: string
                          description: 持有人编号
                          maxLength: 20
                        holdType:
                          type: integer
                          description: |-
                            持有人类型
                            0-个人，1-企业
                          enum:
                            - 0
                            - 1
                        holderName:
                          type: string
                          description: 持有人名称
                          maxLength: 100
                        holderNameEn:
                          type: string
                          description: 持有人英文名称
                          maxLength: 200
                      required:
                        - holderId
                        - holdType
                        - holderName
                        - holderNameEn
            required:
              - code
              - data
          examples:
            application/json:
              code: '000000'
              data:
                totalSize: 2
                resultList:
                  - holderId: '2020051404160959'
                    holdType: 1
                    holderName: 香港企业测试用
                    holderNameEn: oijog
                  - holderId: '2021050682238034'
                    holdType: 1
                    holderName: 企业测试
                    holderNameEn: TEST CORP
        '400':
          description: |-
            | Code | Message | 说明 |
            |------|-------------|-------------|
            | 400001 | signature header is missing |请求头缺失 |
            | 400003 | invalid signature time | 请求头时间戳不合法（请求消息包的签名时间和本地服务器的时间的最大允许阈值10min） |
            | 400004 | invalid signature header scheme | 请求头LLPAY-Signature有误，请参照授权流程中身份认证格式检查 |
            | 400005 | invalid signature header | 请求头LLPAY-Signature有误，请参照授权流程中身份认证格式检查 |
            | 400006 | signature validate fail |验签异常，请参照授权流程中签名规则检查 |
          examples:
            application/json:
              error: signature_error
              code: '400006'
              message: signature validate fail
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
              message:
                type: string
        '402':
          description: "|code\t  |message\t    |说明|\n|-------|-------------|-------|\n|999995\t|参数校验不通过  |请求参数不合法|\n|999999\t|System is busy, please retry later.\t      |系统未知异常|"
          examples:
            application/json:
              error: request_failed
              code: '999995'
              message: '[holderType=2] 输入不合法，范围为0-1'
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
              message:
                type: string
        '500':
          description: |-
            | Code | Message |
            |------|-------------|
            | 500000 |inner service error |
      summary: 持有人查询
      tags:
        - 接口
      description: |-
        返回有效持有人列表

        联调地址 - **https://gtest-open-api.lianlianpay-inc.com/api/holder/query/list** </br>
        生产域名 - **https://global-open-api.lianlianpay.com/holder/query/list**
      operationId: holder-query-list
      parameters:
        - in: body
          name: body
          schema:
            type: object
            properties:
              holderType:
                type: integer
                description: |-
                  持有人类型
                  0-个人，1-企业
                enum:
                  - 0
                  - 1
          x-examples:
            application/json:
              holderType: 1
        - in: header
          name: Authorization
          type: string
          required: true
        - in: header
          name: LLPAY-Signature
          type: string
          required: true
        - in: header
          name: Content-Type
          type: string
          required: true
          default: application/json
      x-internal: false
  /collection/v1/shop/accounts:
    get:
      responses:
        '200':
          description: ''
          schema:
            type: object
            properties:
              code:
                type: string
              data:
                type: object
                properties:
                  total:
                    type: integer
                  list:
                    type: array
                    items:
                      type: object
                      properties:
                        currency:
                          type: string
                          description: 参照`MODELS-币种`
                          enum:
                            - AED
                            - AUD
                            - CAD
                            - CNH
                            - EUR
                            - GBP
                            - HKD
                            - IDR
                            - JPY
                            - PLN
                            - SGD
                            - USD
                          minLength: 3
                          maxLength: 3
                        platform:
                          type: string
                          description: 参照`MODELS-平台`
                          maxLength: 50
                        region:
                          type: string
                          description: 参照`MODELS-地区`
                          maxLength: 10
                        accountId:
                          type: string
                          description: 连连账户编号
                          maxLength: 20
                        holderName:
                          type: string
                          description: 持有人名称
                          maxLength: 100
                        createTime:
                          type: string
                          description: 账户创建时间
                          pattern: 'yyyy-MM-dd HH:mm:ss'
                        balance:
                          type: string
                          description: 账户余额(单位：元)
                        balanceUpdateTime:
                          type: string
                          description: 余额更新时间
                          pattern: 'yyyy-MM-dd HH:mm:ss'
                        shopName:
                          type: string
                          description: 店铺名称
                          maxLength: 256
                        shopStatus:
                          $ref: '#/definitions/shopStatus'
                        virtualCardNo:
                          type: string
                          description: 境外银行卡号
                          maxLength: 50
                        appendInfo:
                          type: string
                          description: 银行卡附加信息
                          maxLength: 512
                        feeRate:
                          description: 提现手续费率
                          type: number
                        sellerId:
                          type: string
                          description: 卖家编号
                          maxLength: 3500
                        authStatus:
                          $ref: '#/definitions/authStatus'
                      required:
                        - currency
                        - platform
                        - accountId
                        - holderName
                        - createTime
                        - balance
                        - balanceUpdateTime
                        - shopName
                        - shopStatus
                        - virtualCardNo
                        - appendInfo
                        - feeRate
          examples:
            application/json:
              data:
                list:
                  - currency: EUR
                    platform: Amazon
                    accountId: '202207071035415'
                    holderName: 张国太勿动
                    createTime: '2022-07-07T05:53:06.000Z'
                    balance: '1918018.10'
                    balanceUpdateTime: '2022-07-06T16:00:00.000Z'
                    shopName: 亚马逊欧洲测试
                    shopStatus: 0
                    virtualCardNo: '748329930687'
                    appendInfo: '{"银行所在地区(Bank Location Country)":"France 法国","银行识别码(BIC)":"CITIFRPP","国际银行账户号码(IBAN)":"748329930687","账号持有人姓名(Bank Account Holder Name)":"张国太勿动"}'
                    feeRate: 0.001
                    region: EU
                  - currency: USD
                    platform: Amazon
                    accountId: '202202100788026'
                    holderName: 张国太勿动
                    createTime: '2022-02-10T03:45:30.000Z'
                    balance: '0.00'
                    balanceUpdateTime: '2022-02-09T16:00:00.000Z'
                    shopName: ceshi
                    shopStatus: 1
                    virtualCardNo: '0037447570416'
                    appendInfo: '{"9位收款路线号码(9-Digit Routing Number)":"021001033","银行账号(Bank Account Number)":"0037447570416","账户持有人姓名(Account Holder Name)":"张国太"}'
                    feeRate: 0.007
                    sellerId: FSDF202202101309207
                    region: US
                total: 23
              code: '000000'
        '400':
          description: |-
            | Code | Message | Description |
            |------|------------| ------------ |
            | 400001 | Missing LLPAY-Signature header. |请求头缺失 |
            | 400003 | Invalid signature time. | 请求头时间戳不合法（请求消息包的签名时间和本地服务器的时间的最大允许阈值10min） |
            | 400006 | Signature validation failed. Contact Lianlian Pay for technical support. |验签异常，请参照授权流程中签名规则检查 |
            | 999995| 例：{"code":"999995","message":"platform is error"} | 传入参数有误 |
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
              message:
                type: string
          examples:
            application/json:
              code: '999995'
              message: '[pageSize] pageSize can''t be null.'
        '500':
          description: |-
            | Code | Message |
            |------|-------------|
            | 500000 |Internal Server Error, Contact Lianlian Pay for technical support|
      tags:
        - 接口
      description: |-
        查询收款账户详情

        联调地址 - **https://global-api-sandbox.lianlianpay-inc.com/collection/v1/shop/accounts**  </br>
        生产域名 - **https://global-api.lianlianpay.com/collection/v1/shop/accounts**
      operationId: get-shop-accounts
      parameters:
        - in: query
          name: platform
          type: string
          description: 平台类型</br>参照`MODELS-店铺平台`
        - in: query
          name: region
          type: string
          description: 站点</br>参照`MODELS-店铺地区（站点）`
        - in: query
          name: pageNum
          type: string
          required: true
          description: 页码
        - in: query
          name: pageSize
          type: string
          required: true
          description: 分页大小
          minLength: 1
          maxLength: 100
        - in: header
          name: Authorization
          type: string
          required: true
        - in: header
          name: LLPAY-Signature
          type: string
          required: true
        - type: string
          in: query
          name: currency
          description: '`Allower value`USD,CAD,EUR,GBP,JPY,AUD,IDR,SGD,AED,CNY,CNH,HKD,PLN,MXN,THB,PHP'
        - type: string
          in: query
          name: shopStatus
          description: 店铺状态</br>参照`MODEL-店铺状态`
        - type: string
          in: query
          name: holderId
          description: 持有人ID
      summary: 查询店铺列表
    parameters: []
  /account/balance/query:
    post:
      responses:
        '200':
          description: ''
          schema:
            type: object
            properties:
              code:
                type: string
              data:
                type: array
                items:
                  type: object
                  properties:
                    currency:
                      type: string
                      description: 参照`MODELS-币种`
                      minLength: 3
                      maxLength: 3
                    balance:
                      type: string
                      description: 用户账户余额
                    accountNum:
                      type: integer
                      description: 账户数量
                  required:
                    - currency
                    - balance
                    - accountNum
            required:
              - code
              - data
          examples:
            application/json:
              code: '000000'
              data:
                - currency: JPY
                  balance: '0'
                  accountNum: 24
                - currency: EUR
                  balance: '4999980.00'
                  accountNum: 6
                - currency: GBP
                  balance: '900000000.00'
                  accountNum: 5
                - currency: USD
                  balance: '900000000.00'
                  accountNum: 21
        '400':
          description: |-
            | Code | Message | 说明 |
            |------|-------------|-------------|
            | 400001 | signature header is missing |请求头缺失 |
            | 400003 | invalid signature time | 请求头时间戳不合法（请求消息包的签名时间和本地服务器的时间的最大允许阈值10min） |
            | 400004 | invalid signature header scheme | 请求头LLPAY-Signature有误，请参照授权流程中身份认证格式检查 |
            | 400005 | invalid signature header | 请求头LLPAY-Signature有误，请参照授权流程中身份认证格式检查 |
            | 400006 | signature validate fail |验签异常，请参照授权流程中签名规则检查 |
          examples:
            application/json:
              error: signature_error
              code: '400006'
              message: signature validate fail
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
              message:
                type: string
        '402':
          description: "|code\t  |message\t    |说明|\n|-------|-------------|-------|\n|999999\t|System is busy, please retry later.\t      |系统未知异常|"
        '500':
          description: |-
            | Code | Message |
            |------|-------------|
            | 500000 |inner service error |
      summary: 用户收款账户余额查询
      tags:
        - 接口
      description: |-
        查询用户收款账户余额

        联调地址 - **https://gtest-open-api.lianlianpay-inc.com/api/account/balance/query** </br>
        生产域名 - **https://global-open-api.lianlianpay.com/account/balance/query**
      operationId: account-balance-query
      parameters:
        - in: header
          name: Authorization
          type: string
          required: true
        - in: header
          name: LLPAY-Signature
          type: string
          required: true
        - in: header
          name: Content-Type
          type: string
          required: true
          default: application/json
        - in: body
          name: body
          schema:
            type: object
            properties:
              currency:
                type: string
                description: 参照`MODELS-币种`
                enum:
                  - AED
                  - AUD
                  - CAD
                  - CNH
                  - EUR
                  - GBP
                  - HKD
                  - IDR
                  - JPY
                  - PLN
                  - SGD
                  - USD
                minLength: 3
                maxLength: 3
          x-examples:
            application/json:
              currency: USD
  /account/query:
    post:
      responses:
        '200':
          description: ''
          schema:
            type: object
            properties:
              code:
                type: string
              data:
                type: object
                properties:
                  totalSize:
                    type: integer
                  resultList:
                    type: array
                    items:
                      type: object
                      properties:
                        currency:
                          type: string
                          description: 参照`MODELS-币种`
                          enum:
                            - AED
                            - AUD
                            - CAD
                            - CNH
                            - EUR
                            - GBP
                            - HKD
                            - IDR
                            - JPY
                            - PLN
                            - SGD
                            - USD
                          minLength: 3
                          maxLength: 3
                        platform:
                          type: string
                          description: 参照`MODELS-平台`
                          maxLength: 50
                        region:
                          type: string
                          description: 参照`MODELS-地区`
                          maxLength: 10
                        accountId:
                          type: string
                          description: 连连账户编号
                          maxLength: 20
                        holderName:
                          type: string
                          description: 持有人名称
                          maxLength: 100
                        createTime:
                          type: string
                          description: 账户创建时间
                          example: '2021-06-21 17:38:00'
                        balance:
                          type: string
                          description: 账户余额
                        balanceUpdateTime:
                          type: string
                          description: 余额更新时间
                          example: '2021-06-22 00:00:00'
                        shopName:
                          type: string
                          description: 店铺名称
                          maxLength: 256
                        shopStatus:
                          $ref: '#/definitions/shopStatus'
                        virtualCardNo:
                          type: string
                          description: 境外银行卡号
                          maxLength: 50
                        appendInfo:
                          type: string
                          description: 银行卡附加信息
                          maxLength: 512
                        feeRate:
                          description: 提现手续费率
                          type: number
                        sellerId:
                          type: string
                          description: 卖家编号
                          maxLength: 3500
                        authStatus:
                          $ref: '#/definitions/authStatus'
                      required:
                        - currency
                        - platform
                        - accountId
                        - holderName
                        - createTime
                        - balance
                        - balanceUpdateTime
                        - shopName
                        - shopStatus
                        - virtualCardNo
                        - appendInfo
                        - feeRate
                        - authStatus
          examples:
            application/json:
