            | 500000 |inner service error |
      summary: 用户资金提现
      tags:
        - 接口
      description: |-
        用户资金提现只支持单平台单站点多账户提现，不支持跨平台同币种提现。

        目前API接口支持</br>提现币种：USD,CAD,EUR,GBP,JPY,HKD,AUD,IDR,SGD,AED</br>到账币种：USD,CAD,EUR,GBP,JPY,HKD,AUD,CNY,SGD,CNH

        联调地址 - **https://gtest-open-api.lianlianpay-inc.com/api/withdraw/combine/submit** </br>
        生产域名 - **https://global-open-api.lianlianpay.com/withdraw/combine/submit**
      operationId: withdraw-combine-submit
      parameters:
        - in: header
          name: Authorization
          type: string
          required: true
        - in: header
          name: LLPAY-Signature
          type: string
          required: true
        - in: header
          name: Content-Type
          type: string
          required: true
          default: application/json
        - in: body
          name: body
          schema:
            type: object
            properties:
              externalTransId:
                type: string
                description: 第三方提现订单号
                minLength: 8
                maxLength: 32
              withdrawCurrency:
                type: string
                description: 提现币种
                enum:
                  - USD
                  - CAD
                  - EUR
                  - GBP
                  - JPY
                  - HKD
                  - AUD
                  - IDR
                  - SGD
                  - AED
              arrivalCurrency:
                type: string
                description: 到账币种
                enum:
                  - USD
                  - CAD
                  - EUR
                  - GBP
                  - JPY
                  - HKD
                  - AUD
                  - CNY
                  - SGD
                  - CNH
              cardId:
                type: string
                description: 提现收款银行卡编号
              captcha:
                type: string
                description: 短信验证码
              withdrawDetailList:
                type: array
                items:
                  type: object
                  properties:
                    accountId:
                      type: string
                      description: 连连账户编号
                    amount:
                      type: number
                      description: 金额
                  required:
                    - accountId
                    - amount
            required:
              - externalTransId
              - withdrawCurrency
              - arrivalCurrency
              - cardId
              - captcha
              - withdrawDetailList
          x-examples:
            application/json:
              withdrawDetailList:
                - accountId: '202006048505160'
                  amount: '0.01'
              captcha: '684321'
              externalTransId: f34a4424-2549-47ae-44b3-ac3bf83ewe21b3233p23pp44
              withdrawCurrency: USD
              cardId: 10126e472a667b7fbe4f2e3faaeb0ecb
              arrivalCurrency: CNY
  /collection/v1/kyc/status:
    get:
      responses:
        '200':
          description: ''
          schema:
            type: object
            properties:
              status:
                type: string
                enum:
                  - ACTIVE
                  - INACTIVE
            required:
              - status
          examples:
            application/json:
              status: ACTIVE
      summary: 查询用户KYC状态
      operationId: kyc-status
      tags:
        - 接口
      parameters:
        - in: header
          name: Authorization
