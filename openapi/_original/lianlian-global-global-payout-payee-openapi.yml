              payeeContactName:
                type: string
                description: Payee Contact Name
                maxLength: 64
              payeeContactNumber:
                type: string
                maxLength: 32
                description: 'Payee Contact Number, Mandatory if `payeeType` = `CORPORATE` and `payeeCountryCode` = `CHN` and `targetCurrency` = `CNY`'
              payeeEmailAddress:
                type: string
                maxLength: 48
