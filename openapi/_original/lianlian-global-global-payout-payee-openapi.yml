                    type: string
                    description: 'Payee''s street address, mandatory if `payeeCountryCode` ≠ `CHN` and `targetCurrency` ≠`CNY`'
                    maxLength: 256
              payeeName:
                type: string
                description: Payee Name
                maxLength: 64
              payeeIdType:
                type: string
                description: |-
                  Payee ID Type, mandatory if `countryCode` = `CHN` and `targetCurrency` = `CNY`, one of

                  |Code|Description|
