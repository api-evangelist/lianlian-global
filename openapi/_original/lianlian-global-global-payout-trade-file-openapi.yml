                description: Underlying Trade File ID
              tradeFileId:
                type: string
                description: Unique Trade File ID in Merchant's System
                maxLength: 64
              payeeId:
                type: string
                description: Unique Payee ID in Merchant's System
                maxLength: 64
              payerId:
                type: string
                description: Payer ID in Merchant's System
                maxLength: 64
              payerName:
                type: string
                maxLength: 64
                description: 'Name of the Payer, corporate name or name of an individual'
              payerCountryCode:
                type: string
                description: 'Residence country/region code of payer, referring to column “code” in Appendix Country Code'
                minLength: 3
                maxLength: 3
              tradeType:
                type: string
                description: |-
                  Trade Type, one of 

                  |Code|Description|
                  |---|---|
                  |0|Goods|
                  |1|Services|
                enum:
                  - 0
                  - 1
              tradeTime:
                type: string
                description: Trade Time
                maxLength: 25
              tradeCurrency:
                type: string
                description: Trade Currency
                minLength: 3
                maxLength: 3
              tradeAmount:
                type: string
                description: Trade Amount
                maxLength: 10
              tradeName:
                type: string
                description: |
                  Trade Name

                  |TradeType|Description|
                  |---|---|
                  |0|Name of goods|
                  |1|Type of service, referring to column “Type of Service” of Appendix Requirement for Service Details of Service Trade|
                maxLength: 512
              tradeCount:
                type: string
                description: |
                  Trade Count

                  |TradeType|Description|
                  |---|---|
                  |0|Quantity of goods|
                  |1|Quantiry of service|
                maxLength: 64
              goodsCarrier:
                type: string
                description: Carrier for goods trade
                maxLength: 512
              serviceDetail:
                type: string
                description: Details of service provided
                maxLength: 512
              serviceTime:
                type: string
                description: Time of service provided
                maxLength: 25
              attachment:
                type: string
                description: |-
                  Document id, supported file extensions are PDF, JPG, GIF. 5 documents at most.
                  Sample：2018072227039320,2018072227039320
                maxLength: 256
            required:
              - underlyTradeFileId
              - tradeFileId
              - payeeId
              - payerId
              - payerName
              - payerCountryCode
              - tradeType
              - tradeTime
              - tradeCurrency
              - tradeAmount
              - tradeName
              - tradeCount
  '/underlytradefile/{underlyTradeFileId}':
    get:
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/new-model'
        '404':
          description: ''
        '500':
          description: ''
      summary: Get Underlying Trade File
      tags:
        - Operations
      produces:
        - application/json
      consumes:
        - application/json
    parameters:
      - name: underlyTradeFileId
        in: path
        type: string
        required: true
