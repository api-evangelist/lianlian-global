                    {
                        "schema": {
                            "type": "string",
                            "enum": [
                                "ECOMMERCE-SEND-PAYMENT",
                                "BILL-DIRECT-DEBIT"
                            ]
                        },
                        "in": "query",
                        "name": "agreement_type",
                        "description": "Signing agreement type.",
                        "required": true
                    }
                ],
                "description": "Get `Agreement` by merchant_client_id"
            },
            "parameters": []
        }
    },
