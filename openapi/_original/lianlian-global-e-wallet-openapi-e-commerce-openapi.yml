                            "multipart/form-data": {
                                "schema": {
                                    "type": "object",
                                    "properties": {
                                        "": {
                                            "$ref": "#/components/schemas/SigningInfo"
                                        },
                                        "app_auth_info": {
                                            "$ref": "#/components/schemas/AppAuthInfo"
                                        }
                                    }
                                }
                            }
                        }
                    }
                },
                "operationId": "get-ew-contracts-merchant_client_id",
                "parameters": [
                    {
                        "schema": {
                            "type": "string"
