    "info": {
        "title": "Receiving",
        "version": "1.0",
        "description": "Receiving Accounts are accounts that function as local bank accounts. \nThey can be used to collect funds from around the world. You get account details that enable you to collect funds from various platforms such as Amazon, Etsy, etc. \n\nYou can apply Receiving Accounts on LianLian Global's website, and by using Receiving API you could query your Receiving accounts and Receiving transactions detail information.\n\n![Wallet.png](https://stoplight.io/api/v1/projects/cHJqOjEyMDg0Ng/images/ooe1JpNsV1Q)"
    },
    "servers": [
        {
            "url": "https://test-global-api.lianlianpay-inc.com/gateway/v1/",
            "description": "SANDBOX"
        },
        {
            "url": "https://uk-api.lianlianglobal.com/gateway/v1/",
            "description": "UK PRD"
        },
        {
            "url": "https://us-api.lianlianglobal.com/gateway/v1/",
            "description": "US PRD"
        }
    ],
    "paths": {
        "/ew-receivings/{id}": {
            "parameters": [
                {
                    "schema": {
                        "type": "string"
                    },
                    "name": "id",
                    "in": "path",
                    "required": true
                }
            ],
            "get": {
                "summary": "Get Receiving Info by ID",
                "tags": [],
                "responses": {
                    "200": {
                        "description": "OK",
                        "content": {
                            "application/json": {
                                "schema": {
                                    "$ref": "#/components/schemas/Receiving"
                                },
                                "examples": {}
                            }
                        }
                    },
                    "404": {
                        "description": "Not Found"
                    }
                },
                "operationId": "get-receivings-ID",
                "description": "Retrieve the information of the Receiving with the matching transaction ID."
            }
        },
        "/ew-receiving/accounts": {
            "get": {
                "summary": "Get Receiving Account list",
                "tags": [],
                "responses": {
                    "200": {
                        "description": "OK",
                        "content": {
                            "application/json": {
                                "schema": {
                                    "type": "array",
                                    "items": {
                                        "$ref": "#/components/schemas/ReceivingAccount"
                                    }
                                }
                            }
                        }
                    }
                },
                "operationId": "get-receivings-accounts",
                "description": "Get list of receiving accounts created by your LianLian Global account.\n",
                "requestBody": {
                    "content": {
                        "application/json": {
                            "schema": {
                                "type": "string"
                            }
                        }
                    }
                }
            },
            "parameters": []
        },
        "/ew-receiving/accounts/{id}": {
            "parameters": [
                {
                    "schema": {
                        "type": "string"
                    },
                    "name": "id",
                    "in": "path",
                    "required": true
                }
            ],
            "get": {
                "summary": "Get Receiving Account Info by ID",
                "tags": [],
                "responses": {
                    "200": {
                        "description": "OK",
                        "content": {
                            "application/json": {
                                "schema": {
                                    "$ref": "#/components/schemas/ReceivingAccount"
                                }
                            }
                        }
                    }
                },
                "operationId": "get-receivings-accounts-id",
                "description": "Retrieve the information of the Receiving Account with the matching ID."
            }
        }
    },
