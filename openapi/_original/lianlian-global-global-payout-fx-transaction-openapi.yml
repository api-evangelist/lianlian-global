        description: Unique Transaction ID From Merchant's System
        maxLength: 32
      pricingCurrency:
        type: string
        description: Pricing Currency
        minLength: 3
        maxLength: 3
      sourceCurrency:
        type: string
        description: Orginal Currency
        minLength: 3
        maxLength: 3
      sourceAmount:
        type: string
        description: 'Original Currency Amount, mandatory if `pricingCurrency` = `sourceCurrency`'
        maxLength: 10
      targetCurrency:
        type: string
        description: Distribute Currency
        minLength: 3
        maxLength: 3
      targetAmount:
        type: string
        description: 'Distribute Currency Amount, mandatory if `pricingCurrency` = `targetCurrency`'
        maxLength: 10
      quoteCode:
        type: string
        description: Quote code assigned by Lianlianpay
      tenor:
        type: string
        enum:
          - REAL_TIME
          - REAL_TIME_HOLD
          - T0
          - T1
          - T2
        description: tenor on which currency conversion will be settled
      fxMode:
        type: string
        description: |-
          FX Mode
          |Code|Description|
          |----|-----|
          |SPECIFY_RATE|Complete the fx using a guaranteed rate for an agreed period of time|
          |EXCHANGE_RATE|conversion executing at current market rate|
        enum:
          - SPECIFY_RATE
          - EXCHANGE_RATE
      rateId:
        type: string
        description: 'Rate ID, if you want to use a guaranteed rate to do currency exchange, you must supply a rate ID via `Create LockFX Rate` API.'
      rate:
        type: string
        description: FX rate
        maxLength: 16
      refundCurrency:
        type: string
        description: Refund Currency
        minLength: 3
        maxLength: 3
      refundAmount:
        type: string
        description: Refund Amount
        maxLength: 10
      payeeId:
        type: string
        description: Unique Payee ID in Merchant's Syetem
        maxLength: 32
      bankAccountNumber:
        type: string
        maxLength: 64
        description: Payee Bank Account Number
      bankCountryCode:
        type: string
        description: 'Bank Country Code, referring to column “code” in Appendix Country Code'
        enum:
          - CHN
          - HKG
          - NZL
          - JPN
          - USA
          - FRA
          - GBR
          - AUS
          - KOR
          - THA
          - DEU
          - ESP
        minLength: 3
      paymentMethod:
        type: string
        description: |-
          Payment methods, mandatory if `targetCurrency` ≠ `CNY` , one of 

          |Code|Description|
          |----|----|
          |SWIFT|payment through swift|
          |LOCAL|payment through local method|
        enum:
          - SWIFT
          - LOCAL
      accountRoutingType:
        type: string
        description: |-
          Routing number type, mandatory if `paymentMethod` = `LOCAL`, one of 
          |Code|Description|
          |---|---|
          |ABA|USA local payment routing number|
        enum:
          - ABA
        maxLength: 16
      routingNumber:
        type: string
        description: 'Routing number, mandatory if `paymentMethod` = `LOCAL`'
        maxLength: 32
      swiftCode:
        type: string
        description: 'Bank swift code, mandatory if `targetCurrency` ≠ `CNY`'
        maxLength: 11
      bankCode:
        type: string
        maxLength: 8
        description: 'Bank Code, mandatory if ` targetCurrency`  = ` CNY` , Referring to Appendix Bank List'
      bankCnapsCode:
        type: string
        maxLength: 16
        description: 'Payee Bank Cnaps Code, mandatory if ` payeeType`  = ` CORPORATE` and` targetCurrency`  = ` CNY`and Payee Bank are not on the Appendix Bank List'
      bankName:
        type: string
        description: Bank name of payee's bank account
        maxLength: 64
      tradeCode:
        type: string
        description: 'Trade Code, mandatory if ` tragetCurrency`  = ` CNY` ,referring to Appendix Trade Code'
        maxLength: 8
      rfb:
        type: string
        description: Reference for Beneficiary
        maxLength: 40
      status:
        type: string
        description: |
          Transaction Status, one of
          |Code|Description|
          |---|---|
          |Processing|Transaction Under Processing|
          |Failed|Transaction Failed|
          |Successed|Transaction Success|
          |Hedged|Transaction failed after Success|
        enum:
          - Processing
          - Failed
          - Successed
          - Hedged
        maxLength: 64
      failedReason:
        type: string
        maxLength: 256
        description: Failed Reason
    required:
      - transactionId
      - pricingCurrency
      - sourceCurrency
      - targetCurrency
      - payeeId
      - bankAccountNumber
      - bankCountryCode
      - bankName
      - status
basePath: /global/payout/v1
