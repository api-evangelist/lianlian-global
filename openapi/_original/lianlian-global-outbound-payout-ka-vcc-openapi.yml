basePath: /outbound/card/v1/
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
definitions:
  VCC-Authorization-Trans:
    title: VCC-Authorization-Trans
    type: object
    x-tags:
      - Models
    required:
      - transactionId
      - billingCurrency
      - billingAmount
      - transactionTime
      - transactionType
      - cardId
      - status
    properties:
      transactionId:
        type: string
        description: Unique authorization transaction id defined by LianLian Global
      billingCurrency:
        type: string
        description: Authorization currency
      billingAmount:
        type: string
        description: Authorization Amount
      transactionTime:
        type: string
        description: |
          Transaction Time
        format: date-time
      transactionType:
        type: string
        description: |-
          Transaction Type, one of
          |Code|Description|
          |----|----|
          |0|Authorization|
          |1|Authorization cancelled|
      cardId:
        type: string
        description: Unique Card ID defined by LianLian Global
      status:
        type: string
        description: |-
          Authorization status, one of
          |Code|Description|
          |-----|------|
          |FAILED|Authorization Failed|
          |SUCCEED|Authorization Succeed|
      merchantName:
        type: string
        description: Merchant Name
      mcc:
        type: string
        description: MCC
        x-stoplight:
          id: wlrwkmxmdm0tm
  VCC-Settlement-Trans:
    title: VCC-Settlement-Trans
    type: object
    x-tags:
      - Models
    required:
      - transactionId
      - transationCurrency
      - transationAmount
      - billingCurrency
      - billingAmount
      - transactionTime
      - transactionType
      - cardId
    properties:
      transactionId:
        type: string
        description: Unique settlement transaction id defined by LianLian Global
      transationCurrency:
        type: string
        description: 'Transaction currency, currency deducted by the merchant'
      transationAmount:
        type: string
        description: 'Transaction amount, amount deducted by the merchant'
      billingCurrency:
        type: string
        description: billing currency
      billingAmount:
        type: string
        description: Settlement Amount
      transactionTime:
        type: string
        description: |
          Transaction Time
        format: date-time
      transactionType:
        type: string
        description: |-
          Transaction Type, one of
          |Code|Description|
          |----|----|
          |0|Settlement|
          |1|Settlement reverse|
          |2|Card recharge|
          |3|Card recharge reverse|
          |4|Dispute Refund|
      cardId:
        type: string
        description: Unique Card ID defined by LianLian Global
      merchantName:
        type: string
        description: Merchant Name
      mcc:
        type: string
        description: MCC
        x-stoplight:
          id: yzvr9xxy68ct2
  3DS-OTP:
    title: 3DS-OTP
    type: object
    description: ''
    x-tags:
      - Models
    properties:
      otpId:
        type: string
        description: Unique ID for this 3DS OTP
      otp:
        type: string
        description: Otp
      cardId:
        type: string
        description: Unique Card ID defined by LianLian Global
      cardNo:
        type: string
        description: VCC Number
      transactionCurrency:
        type: string
        description: Transaction currency
      transactionAmount:
        type: string
        description: Transaction amount
  VCC-Info:
    title: VCC-Info
    type: object
    description: VCC information defined in LianLian Global's system
    x-tags:
      - Models
    required:
      - tradeFileId
      - cardId
      - limit
      - bin
      - createTime
      - status
    properties:
      tradeFileId:
        type: array
        description: Unique Trade file Id from client
        maxItems: 10
        items:
          type: string
          maxLength: 32
      cardId:
        type: string
        description: Unique Card ID defined by LianLian Global
      cardNo:
        type: string
        description: VCC Number
      limit:
        type: string
        description: Limit of this VCC
      expiryDate:
        type: string
        description: VCC expiry date
      cvv2:
        type: string
        description: cvv2
      bin:
        type: string
        description: bin of VCC
      createTime:
        type: string
        description: 'VCC create time,UTC+0'
        format: date-time
      modifyTime:
        type: string
        description: 'Modify time, UTC+0'
        format: date-time
      status:
        type: string
        description: |-
          VCC status, one of 
          |Code|Description|
          |----|----|
          |CREATING|VCC Creating|
          |ACTIVE|VCC Active|
          |FROZEN|VCC Frozen|
          |EXPIRED|VCC Expired|
          |BLOCKING|VCC Blocking|
          |BLOCKED|VCC Blocked|
tags:
  - name: OPERATIONS
