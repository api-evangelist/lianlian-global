        content:
          application/json:
            schema:
              type: object
              x-examples:
                Example 1:
                  singleLimit: '100'
                  singleDayLimit: '10000'
                  transactionCurrencyLimitList:
                    - currency: USD
                      singleLimit: '400.0'
                      singleDayLimit: '4000.0'
                      singleMonthLimit: ''
                      lifeTimeLimit: '10000000'
                    - currency: GBP
                      singleLimit: '400.0'
                      singleDayLimit: '4000.0'
                      singleMonthLimit: ''
                      lifeTimeLimit: '10000000'
              required:
