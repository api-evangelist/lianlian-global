                type: object
                x-examples:
                  Example 1:
                    code: 100001
                    data: true
                    success: true
                    message: SUCCESS
                required:
                  - code
                  - success
                  - message
                properties:
                  code:
                    type: integer
                    description: 响应码
                  success:
                    type: boolean
                    description: 成功标识
                  message:
                    type: string
                    description: 响应描述
