                                },
                                "examples": {
                                    "example": {
                                        "value": {
                                            "rate_id": "string",
                                            "rate": "string",
                                            "base_currency": "string",
                                            "sell_currency": "string",
                                            "buy_currency": "string",
                                            "validity": "T_0",
                                            "valid_strarting_after": "string",
                                            "valid_ending_before": "string"
                                        }
                                    }
                                }
                            }
                        }
                    }
                },
                "tags": [
                    "Operations"
                ],
                "requestBody": {
                    "content": {
                        "application/json": {
                            "schema": {
                                "$ref": "./CommonModel.json#/components/schemas/LockFXRequest"
                            },
                            "examples": {}
                        },
                        "application/xml": {
                            "schema": {
                                "type": "object",
                                "properties": {}
                            }
                        },
                        "multipart/form-data": {
                            "schema": {
                                "type": "object",
                                "properties": {}
                            }
                        },
                        "text/html": {
                            "schema": {
                                "type": "object",
                                "properties": {}
                            }
                        },
                        "text/plain": {
                            "schema": {
                                "type": "object",
                                "properties": {}
                            }
                        }
