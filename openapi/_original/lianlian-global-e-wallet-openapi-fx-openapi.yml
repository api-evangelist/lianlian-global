                    "description": ""
                },
                "parameters": [],
                "description": "Lock quote."
            },
            "parameters": []
        }
    },
    "components": {
        "schemas": {
            "ExchangeRate": {
                "title": "ExchangeRate",
                "type": "object",
                "x-tags": [
                    "Models"
                ],
                "examples": [
                    {
                        "rate_id": "string",
                        "rate": "string",
                        "base_currency": "string",
                        "sell_currency": "string",
                        "buy_currency": "string",
                        "validity": "T_0",
                        "valid_strarting_after": "string",
                        "valid_ending_before": "string"
                    }
                ],
                "properties": {
                    "id": {
                        "type": "string",
                        "description": "Unique ID for this quote wich will be used by `Conversion`."
                    },
                    "rate": {
                        "type": "string",
                        "description": "The FX Quote represents how much of the quote currency is needed for you to get one unit of the base currency."
                    },
                    "base_currency": {
                        "type": "string",
                        "description": "It will be either `sell_currency` or `buy_currency`."
                    },
                    "sell_currency": {
                        "type": "string",
                        "description": "Sell currency, the currency that the client sells (in three-letter [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) format)."
                    },
                    "buy_currency": {
                        "type": "string",
                        "description": "Buy currency, the currency that the client buys (in three-letter [ISO 4217](https://en.wikipedia.org/wiki/ISO_4217) format)."
                    },
                    "validity": {
                        "type": "string",
                        "description": "Quote validity period.",
                        "enum": [
                            "T_0"
                        ]
                    },
                    "valid_strarting_after": {
                        "description": "The valid time of the exchange rate.",
                        "type": "integer"
                    },
                    "valid_ending_before": {
                        "description": "The valid end time of the exchange rate.",
                        "type": "integer"
                    }
                }
            }
        },
        "requestBodies": {}
    }
