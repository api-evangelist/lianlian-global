swagger: '2.0'
info:
  title: 币种账户服务 API
  version: '1.0'
  description: '联调域名 - **https://global-api-sandbox.lianlianpay-inc.com**   </br>  生产域名 - **https://global-api.lianlianpay.com**'
  contact:
    name: ''
    email: dev_support@lianlianpay.com
paths:
  /collection/v1/wallets:
    get:
      summary: 查询币种账户余额
      responses:
        '200':
          description: OK
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    currency:
                      description: 币种
                      type: string
                    balance:
                      type: string
                      description: 可用余额
                      format: 'number(15,2)'
                    status:
                      description: '状态</br>1 : 正常'
                      type: integer
                      default: 1
                    avaExchangeBalance:
                      type: string
                      description: 该字段无意义，请忽略
                    createTime:
                      type: string
                      description: 创建时间
              code:
                type: string
          examples:
            application/json:
              data:
                - currency: USD
                  balance: '1088535.54'
                  status: 1
                  avaExchangeBalance: '0.00'
                  createTime: '2021-01-27T02:55:23.000Z'
                - currency: EUR
                  balance: '0.00'
                  status: 1
                  avaExchangeBalance: '0.00'
                  createTime: '2021-01-27T02:55:23.000Z'
                - currency: GBP
                  balance: '0.00'
                  status: 1
                  avaExchangeBalance: '0.00'
                  createTime: '2021-01-27T02:55:23.000Z'
                - currency: JPY
                  balance: '0'
                  status: 1
                  avaExchangeBalance: '0'
                  createTime: '2021-01-27T02:55:24.000Z'
                - currency: AUD
                  balance: '0.00'
                  status: 1
                  avaExchangeBalance: '0.00'
                  createTime: '2021-01-27T02:55:24.000Z'
                - currency: CAD
                  balance: '0.00'
                  status: 1
                  avaExchangeBalance: '0.00'
                  createTime: '2021-01-27T02:55:24.000Z'
                - currency: SGD
                  balance: '0.00'
                  status: 1
                  avaExchangeBalance: '0.00'
                  createTime: '2021-01-27T02:55:24.000Z'
                - currency: AED
                  balance: '0.00'
                  status: 1
                  avaExchangeBalance: '0.00'
                  createTime: '2021-01-27T02:55:25.000Z'
                - currency: IDR
                  balance: '0'
                  status: 1
                  avaExchangeBalance: '0'
                  createTime: '2021-01-27T02:55:25.000Z'
                - currency: HKD
                  balance: '0.00'
                  status: 1
                  avaExchangeBalance: '0.00'
                  createTime: '2021-01-27T02:55:25.000Z'
                - currency: CNH
                  balance: '0.00'
                  status: 1
                  avaExchangeBalance: '0.00'
                  createTime: '2021-01-27T02:55:23.000Z'
                - currency: PLN
                  balance: '0.00'
                  status: 1
                  avaExchangeBalance: '0.00'
                  createTime: '2021-01-27T02:55:25.000Z'
              code: '000000'
        '400':
          description: |-
            | Code | Message | Description |
            |------|------------| ------------ |
            | 009001| 多比查询失败或未开通 | 传入币种有误或币种账户白名单暂未开通。如币种账户白名单暂未开通，请联系客户经理协助开通，并在连连页面端确认弹窗协议 |
            | 400001 | Missing LLPAY-Signature header. |请求头缺失 |
            | 400003 | Invalid signature time. | 请求头时间戳不合法（请求消息包的签名时间和本地服务器的时间的最大允许阈值10min） |
            | 400006 | Signature validation failed. Contact Lianlian Pay for technical support. |验签异常，请参照授权流程中签名规则检查 |
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
              message:
                type: string
          examples:
            application/json:
              code: '009001'
              message: 多比查询失败或未开通
        '500':
          description: |-
            | Code | Message |
            |------|-------------|
            | 500000 |Internal Server Error, Contact Lianlian Pay for technical support|
      operationId: wallets-balance
      description: |-
        获取币种账户信息以及余额

        联调地址 - **https://global-api-sandbox.lianlianpay-inc.com/collection/v1/wallets**  </br>
        生产域名 - **https://global-api.lianlianpay.com/collection/v1/wallets**
      tags:
        - 接口
      parameters:
        - in: header
          name: Authorization
          type: string
          required: true
        - in: header
          name: LLPAY-Signature
          type: string
          required: true
        - type: string
          in: query
          name: currency
          description: 币种账户币种
          enum:
            - AED
            - AUD
            - CAD
            - CNH
            - EUR
            - GBP
            - HKD
            - IDR
            - JPY
            - MXN
            - PLN
            - SGD
            - THB
            - USD
            - PHP
            - MYR
            - KRW
  /collection/v1/wallets/transaction:
    get:
      summary: 查询币种账户资金流水
      operationId: get-wallet-transaction
      responses:
        '200':
          description: OK
          schema:
            type: object
            x-examples:
              Example 1:
                data:
                  total: 1
                  list:
                    - amount: '1000.00'
                      currency: CNY
                      feeAmount: '1.23'
                      feeCurrencyCode: CNY
                      transId: test_8347a6e03ceb
                      transTime: '2017-12-03 00:47:11'
                      transType: 6
                      payeeName: lianlian global
                      balance: '123456.78'
                      busiType: '12'
                code: '000000'
                message: test_3c62e7b5025b
                error: test_6045943f88b9
            properties:
              data:
                type: object
                properties:
                  total:
                    type: integer
                  list:
                    type: array
                    items:
                      type: object
                      properties:
                        amount:
                          type: string
                          description: 资金流水金额（单位元）
                          example: '146.76'
                        currency:
                          type: string
                          description: 币种
                        feeAmount:
                          type: string
                          description: 手续费金额（单位元）
                          example: '146.76'
                        feeCurrencyCode:
                          type: string
                          description: 手续费币种
                        transId:
                          type: string
                          description: 资金流水id
                        transTime:
                          type: string
                          description: 交易时间
                          example: '2022-06-27T11:56:22.000Z'
                        transType:
                          type: string
                          description: 交易类型
                          enum:
                            - 入账
                            - 出账
                        payeeName:
                          type: string
                          description: 交易对手名称
                        balance:
                          type: string
                          description: 交易后余额（单位元）
                        busiType:
                          $ref: '#/definitions/busiType'
                        billType:
                          type: string
                          description: 出入账类型 0入账 - 1出账
              code:
                type: string
              message:
                type: string
              error:
                type: string
          examples:
            application/json:
              data:
                total: 1
                list:
                  - amount: '1000.00'
                    currency: CNY
                    feeAmount: '1.23'
                    feeCurrencyCode: CNY
                    transId: test_8347a6e03ceb
                    transTime: '2017-12-03 00:47:11'
                    transType: 6
                    payeeName: lianlian global
                    balance: '123456.78'
                    busiType: '12'
                    billType: '1'
              code: '000000'
              message: test_3c62e7b5025b
              error: test_6045943f88b9
        '400':
          description: |-
            | Code | Message | Description |
            |------|------------| ------------ |
            | 400001 | Missing LLPAY-Signature header. |请求头缺失 |
            | 400003 | Invalid signature time. | 请求头时间戳不合法（请求消息包的签名时间和本地服务器的时间的最大允许阈值10min） |
            | 400006 | Signature validation failed. Contact Lianlian Pay for technical support. |验签异常，请参照授权流程中签名规则检查 |
            | 999995|  | 传入参数有误，例如{"code":"999995","message":"[currency]字符串不能为空"}|
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
              message:
                type: string
          examples:
            application/json:
              code: '999995'
              message: '[endTime]字符串不能为空'
        '401':
          description: Unauthorized
          schema:
            type: object
            properties: {}
        '500':
          description: |-
            | Code | Message |
            |------|-------------|
            | 500000 |Internal Server Error, Contact Lianlian Pay for technical support|
      description: |-
        币种账户资金明细列表查询，按币种进行查询，结果按创建时间倒序排序。

        联调地址 - **https://global-api-sandbox.lianlianpay-inc.com/collection/v1/wallets/transaction**  </br>
        生产域名 - **https://global-api.lianlianpay.com/collection/v1/wallets/transaction**
      tags:
        - 接口
      parameters:
        - in: query
          name: pageNum
          type: string
          description: 页码
          required: true
        - in: query
          name: pageSize
          type: string
          description: 分页大小
          required: true
        - in: query
          name: startTime
          type: string
          pattern: yyyy-MM-dd
          description: 查询资金流水开始时间
          required: true
        - in: query
          name: endTime
          type: string
          pattern: yyyy-MM-dd
          description: 查询资金流水结束时间
          required: true
        - in: query
          name: currency
          type: string
          description: 币种
          minLength: 3
          maxLength: 3
          required: true
        - in: header
          name: Authorization
          type: string
          required: true
        - in: header
          name: LLPAY-Signature
          type: string
          required: true
    parameters: []
  /collection/v1/wallet-recharges:
    post:
      summary: 币种账户充值
      operationId: post-wallet-recharges
      responses:
        '200':
          description: OK
        '400':
          description: |-
            | Code | Message | Description |
            |------|------------| ------------ |
            | 009001| 多比查询失败或未开通 |传入币种有误或币种账户白名单暂未开通。如币种账户白名单暂未开通，请联系客户经理协助，并在连连页面端确认弹窗协议 |
            | 009002| 您有正在受理的充值申请，请稍后再试 | |
            | 009003| 充值币种不统一 | 传入参数currency与shopAccountId对应店铺币种不一致|
            | 009004| 充值原始金额为0 | |
            | 009008| 充值平台不统一 | |
            | 009019| 外部单号重复 | |
            | 010001| 用户校验失败 |用户kyc不存在 |
            | 010002| kyc状态未通过 | |
            | 150001| 店铺查询失败 | shopAccountId不存在|
            | 150002| 店铺状态异常 | shopAccountId对应店铺状态不为审核通过|
            | 150003| 账户余额查询失败 | |
            | 150004| 账户余额不足 | 店铺账户余额不足|
            | 400001 | Missing LLPAY-Signature header. |请求头缺失 |
            | 400003 | Invalid signature time. | 请求头时间戳不合法（请求消息包的签名时间和本地服务器的时间的最大允许阈值10min） |
            | 400006 | Signature validation failed. Contact Lianlian Pay for technical support. |验签异常，请参照授权流程中签名规则检查 |
            | 999995| | 参数校验不通过，例如{"code":"999995","message":"[amount] is invalid"}|
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
              message:
                type: string
          examples:
            application/json:
              code: '150001'
              message: 店铺查询失败
        '500':
          description: |-
            | Code | Message |
            |------|-------------|
            | 500000 |Internal Server Error, Contact Lianlian Pay for technical support|
      description: |-
        将一个或多个同平台店铺收款账号的钱转入币种账户用于汇兑或付款，转入前需要确认店铺收款账号余额大于转入金额。
        ### 币种账户充值流程图
        ![](https://cbva-cms2.oss-cn-hangzhou.aliyuncs.com/cb_file/erp/20220630-154041.jpg)

        联调地址 - **https://global-api-sandbox.lianlianpay-inc.com/collection/v1/wallet-recharges** </br>
        生产域名 - **https://global-api.lianlianpay.com/collection/v1/wallet-recharges**
      tags:
        - 接口
      parameters:
        - in: body
          name: body
          schema:
            type: object
            properties:
              externalTransId:
                type: string
                description: 第三方单号
                minLength: 8
                maxLength: 32
              currency:
                type: string
                description: 充值币种
                enum:
                  - CNH
                  - AED
                  - AUD
                  - CAD
                  - EUR
                  - GBP
                  - HKD
                  - IDR
                  - JPY
                  - PLN
                  - SGD
                  - USD
                  - THB
              rechargeDetailList:
                type: array
                description: 明细列表
                items:
                  title: 币种账户充值明细
                  type: object
                  description: ''
                  x-tags:
                    - 对象
                  properties:
                    shopAccountId:
                      type: string
                      description: 店铺账号ID</br>查询店铺列表接口返回accountId
                    amount:
                      type: string
                      description: 金额
                      format: 'number(15,2)'
                  required:
                    - shopAccountId
                    - amount
            required:
              - externalTransId
              - currency
              - rechargeDetailList
          x-examples:
            application/json:
              currency: USD
              externalTransId: '202104201111111'
              rechargeDetailList:
                - shopAccountId: '201912102074891'
                  amount: '30000'
                - shopAccountId: '202011113847107'
                  amount: '30000'
          description: ''
        - in: header
          name: Authorization
          type: string
          required: true
        - in: header
          name: LLPAY-Signature
          type: string
          required: true
        - in: header
          name: Content-Type
          type: string
          required: true
          default: application/json
    get:
      summary: 查询币种账户充值记录
      operationId: get-wallet-recharges
      responses:
        '200':
          description: OK
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  list:
                    type: array
                    items:
                      type: object
                      properties:
                        createTime:
                          type: string
                          description: 创建时间
                          pattern: 'yyyy-MM-ddTHH:mm:ss.SSSZ'
                        rechargeAmount:
                          type: string
                          description: 充值金额
                        currency:
                          type: string
                          description: 充值币种
                        feeAmount:
                          type: string
                          description: 手续费
                        rechargeDetailList:
                          type: array
                          description: 币种账户充值明细
                          items:
                            type: object
                            properties:
                              shopAccountId:
                                type: string
                                description: 店铺账号ID
                              amount:
                                type: string
                                description: 金额
                            required:
                              - shopAccountId
                              - amount
                        externalTransId:
                          type: string
                          description: 第三方单号
                        status:
                          type: integer
                          description: |-
                            状态 

                            id|message
                            -|-
                            1|转入中
                            2|转入成功
                      required:
                        - createTime
                        - rechargeAmount
                        - currency
                        - feeAmount
                        - rechargeDetailList
                        - externalTransId
                        - status
                  total:
                    type: integer
                    description: 总数
                required:
                  - total
              code:
                type: string
          examples:
            application/json:
              data:
                list:
                  - createTime: '2020-09-18T08:04:39.000Z'
                    rechargeAmount: '30000.00'
                    currency: GBP
                    feeAmount: '480.00'
                    rechargeDetailList:
                      - shopAccountId: '201912102075707'
                        amount: '30000.00'
                    externalTransId: '202009181111111'
                    status: 2
                total: 1
              code: '000000'
        '400':
          description: |-
            | Code | Message | Description |
            |------|------------| ------------ |
            | 400001 | Missing LLPAY-Signature header. |请求头缺失 |
            | 400003 | Invalid signature time. | 请求头时间戳不合法（请求消息包的签名时间和本地服务器的时间的最大允许阈值10min） |
            | 400006 | Signature validation failed. Contact Lianlian Pay for technical support. |验签异常，请参照授权流程中签名规则检查 |
            | 999995|  | 传入参数有误，例如{"code":"999995","message":"[endTime]字符串不能为空"}|
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
              message:
                type: string
          examples:
            application/json:
              code: '999995'
              message: '[endTime]字符串不能为空'
        '500':
          description: |-
            | Code | Message |
            |------|-------------|
            | 500000 |Internal Server Error, Contact Lianlian Pay for technical support|
      description: |-
        币种账户充值列表查询，可以按币种进行查询，结果按创建时间倒序排序。

        联调地址 - **https://global-api-sandbox.lianlianpay-inc.com/collection/v1/wallet-recharges**  </br>
        生产域名 - **https://global-api.lianlianpay.com/collection/v1/wallet-recharges**
      tags:
        - 接口
      parameters:
        - in: query
          name: pageNum
          type: string
          required: true
          description: 页码
        - in: query
          name: pageSize
          type: string
          required: true
          description: 分页大小
        - in: query
          name: startTime
          type: string
          required: true
          pattern: yyyy-MM-dd
          description: 转入记录创建起始时间
        - in: query
          name: endTime
          type: string
          required: true
          pattern: yyyy-MM-dd
          description: 转入记录创建结束时间
        - in: query
          name: currency
          type: string
          description: 币种
          minLength: 3
          maxLength: 3
        - in: query
          name: externalTransId
          type: string
          description: 第三方单号
        - in: header
          name: Authorization
          type: string
          required: true
        - in: header
          name: LLPAY-Signature
          type: string
          required: true
  /supplier/v1/cards:
    get:
      summary: 查询币种账户充值银行账号
      tags:
        - 接口
      responses:
        '200':
          description: OK
          schema:
            title: 币种账户充值银行账号
            type: object
            description: ''
            x-tags:
              - 对象
            properties:
              currency:
                type: string
                description: 币种
              address:
                type: string
                description: 银行卡地址
              accountName:
                type: string
                description: 账户名
              accountNo:
                type: string
                description: 卡号
              routingNumber:
                type: string
                description: 9位路线号
              swiftCode:
                type: string
                description: SWIFT code
            required:
              - currency
              - address
              - accountName
              - accountNo
              - swiftCode
          examples:
            application/json:
              currency: USD
              address: 'Citibank Tower, Citibank Plaza,3 Garden Road,Central, Hong Kong'
              accountName: GuoJiShouKuanxianggangqiye(ziDongHua)
              accountNo: '330178113'
              swift: CITIHKHX
        '400':
          description: |-
            | Code | Message | Description |
            |------|------------| ------------ |
            | 400001 | Missing LLPAY-Signature header. |请求头缺失 |
            | 400003 | Invalid signature time. | 请求头时间戳不合法（请求消息包的签名时间和本地服务器的时间的最大允许阈值10min） |
            | 400006 | Signature validation failed. Contact Lianlian Pay for technical support. |验签异常，请参照授权流程中签名规则检查 |
            | 999995|  | 传入参数有误，例如{"code":"999995","message":"[Currency]may not be empty"}|
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
              message:
                type: string
          examples:
            application/json:
              code: '999995'
              message: '[Currency]may not be empty'
        '500':
          description: |-
            | Code | Message |
            |------|-------------|
            | 500000 |Internal Server Error, Contact Lianlian Pay for technical support|
      operationId: cards
      description: |-
        根据币种查询币种账户充值银行账号

        联调地址 - **https://global-api-sandbox.lianlianpay-inc.com/supplier/v1/cards**  </br>
        生产域名 - **https://global-api.lianlianpay.com/supplier/v1/cards**
      parameters:
        - in: header
          name: Authorization
          type: string
          required: true
        - in: header
          name: LLPAY-Signature
          type: string
          required: true
        - in: query
          name: currency
          type: string
          description: 币种
          enum:
            - AUD
            - CAD
            - CNH
            - EUR
            - GBP
            - HKD
            - JPY
            - USD
          required: true
  /supplier/v1/card-recharges:
    get:
      summary: 查询币种账户充值银行转账记录
      tags:
        - 接口
      responses:
        '200':
          description: ''
          schema:
            type: object
            properties:
              total:
                type: integer
              list:
                type: array
                items:
                  title: 币种账户银行充值记录
                  type: object
                  x-tags:
                    - 对象
                  properties:
                    bankTransferId:
                      type: string
                      description: 充值流水号
                    payerAccountName:
                      type: string
                      description: 打款人账户名称
                    payerAccountNo:
                      type: string
                      description: 打款人账号
                    amount:
                      type: string
                      description: 金额
                      format: 'number(15,2)'
                    currency:
                      type: string
                      description: 币种
                    createTime:
                      type: string
                      description: 创建时间
                      example: '2020-09-18T09:40:23.000Z'
                    accountNo:
                      type: string
                      description: 收款人账号
                    transId:
                      type: string
                      x-stoplight:
