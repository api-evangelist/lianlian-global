definitions:
  VA-Debit-Record:
    title: VA- Debit-Record
    type: object
    x-tags:
      - Models
    x-stoplight:
      id: 6eyhz91fdd265
    required:
      - transactionId
      - currency
      - amount
      - transactionTime
      - accountId
      - status
    properties:
      transactionId:
        type: string
        description: Unique authorization transaction id defined by LianLian Global
      currency:
        type: string
        description: Transaction currency
      amount:
        type: string
        description: Transaction Amount
      transactionTime:
        type: string
        description: |
          Transaction Time
        format: date-time
      accountId:
        type: string
        description: Unique Card ID defined by LianLian Global
      status:
        type: string
        description: |-
          Transaction status, one of
          |Code|Description|
          |-----|------|
          |PENDING|Pre-debit Succeed|
          |SUCCEED|Debit Succeed|
          |REJECTED|Debit rejected|
          |RECALLING|Debit Recalling|
      overLimitStatus:
        type: string
        description: |-
          Transaction overLimitStatus, one of
          |Code|Description|
          |-----|------|
          |UN_OVER|Un OverLimit|
          |OVER_UN_TREATED|Limit Un-Treated|
          |OVER_TREATED|Limit Already-Treated|    
      merchantName:
        type: string
        description: Transaction Beneficiary Name
      institutionName:
        type: string
        description: Transaction Institution Name
  VA-EntryOrder:
    title: VA- Debit-Record
    x-stoplight:
      id: lmculeh8br5j9
    type: object
    x-tags:
      - Models
    required:
      - transactionId
      - currency
      - amount
      - transactionTime
      - accountId
    properties:
      transactionId:
        type: string
        description: Va entry order transaction id defined by LianLian Global
      currency:
        type: string
        description: Transaction currency
      amount:
        type: string
        description: Transaction Amount
      transactionTime:
        type: string
        description: |
          Transaction Time
        format: date-time
      accountId:
        type: string
        description: Unique Card ID defined by LianLian Global
      verifyCode:
        type: string
        description: Verify code
        x-stoplight:
          id: xmr1jeyg83vf7
  VA-Info:
    title: VA-Info
    type: object
    description: VA information defined in LianLian Global's system
    x-tags:
      - Models
    x-stoplight:
      id: nx3f8g1c39b0l
    required:
      - currency
      - status
    properties:
      tradeFileId:
        type: array
        description: Unique Trade file Id from client
        maxItems: 10
        items:
          type: string
          maxLength: 32
      accountId:
        type: string
        description: Virtual Account unique ID defined by LianLian Global
      accountNo:
        type: string
        description: Virtural Account Number
      bizVirtualAccountNo:
        type: string
        x-stoplight:
          id: ku0e1nc0a8tzc
        description: Virtual account number  for transactions
      localAccountNo:
        type: string
        description: 'The local bank account number, such as the IBAN in the SPAE'
        x-stoplight:
          id: brtpti0ggxjpu
      currency:
        type: string
        description: Currency of virtual account
      bankName:
        type: string
        description: Bank name of virtual account
      bankAddress:
        type: string
        description: Bank address of virtual account
      swiftCode:
        type: string
        description: Bank SWIFT code
        minLength: 8
        maxLength: 11
      routingNo:
        type: string
        description: 'The corresponding code for the clearing network, e.g., the ABA number, or SORT code'
      status:
        type: string
        description: |-
          VA status, one of 
          |Code|Description|
          |----|----|
          |CREATING|VA Creating|
          |ACTIVE|VA Active|
          |FROZEN|VA Frozen|
          |BLOCKING|VA Blocking|
          |BLOCKED|VA Blocked|
        enum:
          - CREATING
          - ACTIVE
          - FROZEN
          - BLOCKING
          - BLOCKED
      createTime:
        type: string
        description: 'Create time, UTC+0'
        format: date-time
      modifyTime:
        type: string
        description: 'Modify time, UTC+0'
        format: date-time
      availableBalance:
        type: string
        x-stoplight:
          id: 6dnt0qwds7g1o
        description: Available balance of virtual account
  VA-Info_copy:
    title: VA-Balance
    x-stoplight:
      id: 34wllpb7co15f
    type: object
    description: VA Balance in LianLian Global's system
    x-tags:
      - Models
    properties:
      currency:
        type: string
        x-stoplight:
          id: tfxsoi2hcigmn
      availableBalance:
        type: string
        x-stoplight:
          id: oi9n77k3y6zth
