                    description: "Payer and beneficiary relationship, one of:\r\n\r\nIf payer type is \"INDIVIDUAL\"\r\n\r\n| VALUE | DESCRIPTION |\r\n|-------|-------------|\r\n| SELF | payer is beneficiary |\r\n| FAMILY | Payer is the family member of beneficiary |\r\n| IMMEDIATE_FAMILY | Parents, children, spouse |\r\n| OTHER_RELATIVES | Any relative other than \"Parents, children, spouse\" |\r\n| FRIEND | Friends |\r\n| OTHER | other relationship |\r\n\r\nIf payer type is \"CORPORATE\"\r\n\r\n| VALUE | DESCRIPTION |\r\n|-------|-------------|\r\n| ORGANIZATION | The company/school to which the student belongs |\r\n| INTERMEDIARY | Student commissioned agency |\r\n| OTHER | other relationship |"
