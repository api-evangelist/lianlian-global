                                        },
                                        "page_list": {
                                            "type": "array",
                                            "items": {
                                                "$ref": "#/components/schemas/File"
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }
                },
                "parameters": [],
                "tags": [
                    "Operations"
                ],
                "description": "Get list of Files.",
                "requestBody": {
                    "content": {
                        "application/json": {
                            "schema": {
                                "type": "object",
                                "properties": {
                                    "id": {
                                        "type": "string",
                                        "description": "File ID."
                                    },
                                    "name": {
                                        "type": "string",
                                        "description": "A file name in the server, require exact match."
                                    },
                                    "title": {
                                        "type": "string",
                                        "description": "User naming the file when uploading, require exact match"
                                    },
                                    "page_number": {
                                        "type": "integer",
                                        "description": "The query page number."
                                    },
                                    "page_size": {
                                        "description": "The default value is 20. A maximum of 100 data items can be displayed on a page.",
                                        "type": "integer"
                                    },
                                    "start_time": {
                                        "description": "File object creation period start time.",
                                        "type": "integer"
                                    },
                                    "end_time": {
                                        "description": "File object creation period end time.",
                                        "type": "integer"
                                    }
                                }
                            }
                        }
                    },
                    "description": ""
                }
            }
        },
        "/file/upload": {
            "post": {
                "summary": "Upload File",
                "operationId": "upload-file",
                "responses": {
                    "200": {
                        "description": "OK",
                        "content": {
                            "application/json": {
                                "schema": {
                                    "$ref": "#/components/schemas/File"
                                }
                            }
                        }
                    },
                    "400": {
                        "description": "Bad Request"
                    },
                    "401": {
                        "description": "Unauthorized"
                    },
                    "403": {
                        "description": "Forbidden"
                    },
                    "404": {
                        "description": "Not Found"
                    },
                    "500": {
                        "description": "Internal Server Error"
                    }
                },
                "description": "Upload a file to LianLian Global's server. The max size of an upload file is up to 10MB.\nWhen you upload a file, the API responds with a `id`.\nThis `id` will be referenced as required as part of the `File Folder` object.\n\nAllowed file types:\n`application/x-rar-compressed` `application/zip` `application/pdf` `image/jpeg` `image/png`\n\n",
                "requestBody": {
                    "content": {
                        "multipart/form-data": {
                            "schema": {
                                "type": "object"
                            }
                        },
                        "application/json": {
                            "schema": {
                                "$ref": "#/components/schemas/File"
                            }
                        },
                        "application/xml": {
                            "schema": {
                                "type": "object",
                                "properties": {}
                            }
                        },
                        "text/html": {
                            "schema": {
                                "type": "object",
                                "properties": {
                                    "file": {
                                        "type": "object"
                                    },
                                    "size": {
                                        "type": "string"
                                    }
                                }
                            }
                        },
                        "text/plain": {
                            "schema": {
                                "type": "object",
                                "properties": {}
                            }
                        },
                        "application/EDI-X12": {
                            "schema": {
                                "type": "object",
                                "properties": {}
                            }
                        },
                        "application/EDIFACT": {
                            "schema": {
                                "type": "object",
                                "properties": {}
                            }
                        },
                        "application/atom+xml": {
                            "schema": {
                                "type": "object",
                                "properties": {}
                            }
                        }
                    },
                    "description": "file : File stream, A maximum of 10 MB files are supported. Empty files are not allowed.<br>\nextension_info : json object structure is {\"notes\":\"notes descn\",\"title\":\"1fzip\"}.\n<br><br>\nnotes : The notes of the file, max length is 128 characters. <br>\ntitle : User naming the file when uploading."
                },
                "x-internal": false,
                "tags": [
                    "Operations"
                ],
                "parameters": [
                    {
                        "schema": {
                            "type": "string"
                        },
                        "in": "query",
                        "name": "file",
                        "description": "File stream, A maximum of 10 MB files are supported. Empty files are not allowed.",
                        "required": true
                    },
                    {
                        "schema": {
                            "type": "string"
                        },
                        "in": "query",
                        "name": "notes",
                        "description": "The notes of the file, max length is 128 characters."
                    },
                    {
                        "schema": {
                            "type": "string"
                        },
                        "in": "query",
                        "name": "title",
                        "description": "User naming the file when uploading."
                    }
                ]
            },
            "parameters": []
        }
