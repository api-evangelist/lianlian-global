    "paths": {
        "/file/{id}": {
            "get": {
                "summary": "Download File",
                "tags": [
                    "Operations"
                ],
                "responses": {
                    "200": {
                        "description": "OK",
                        "content": {
                            "application/octet-stream": {
                                "schema": {
                                    "type": "string",
                                    "description": "File data streaming."
                                },
                                "examples": {}
                            }
                        }
                    },
                    "400": {
                        "description": "Bad Request"
                    },
                    "401": {
                        "description": "Unauthorized"
                    },
                    "403": {
                        "description": "Forbidden"
                    },
                    "404": {
                        "description": "Not Found"
                    },
                    "500": {
                        "description": "Internal Server Error"
                    },
                    "": {
                        "description": "",
                        "headers": {},
                        "content": {
                            "application/octet-stream": {
                                "schema": {
                                    "type": "string",
                                    "description": "File data streaming."
                                }
                            }
                        }
                    }
                },
                "operationId": "download-File",
                "description": "Download File by `id`."
            },
            "parameters": [
                {
                    "schema": {
                        "type": "string"
                    },
                    "name": "id",
                    "in": "path",
                    "required": true,
                    "description": "File ID"
                }
            ]
        },
        "/ew-files": {
            "parameters": [],
            "get": {
                "summary": "Get list of Files",
                "operationId": "get-files",
                "responses": {
                    "200": {
                        "description": "OK",
                        "content": {
                            "application/json": {
                                "schema": {
                                    "type": "object",
                                    "properties": {
                                        "total_count": {
                                            "type": "string",
