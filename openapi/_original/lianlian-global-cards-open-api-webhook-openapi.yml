        - data:
            cardName: testcardname
            merchantCountryCode: IRL
            last4CardNum: '2428'
            transactionTime: '2025-06-11 00:00:03'
            mcc: '4444'
            type: AUTH
            merchantName: TESTMERCHANT
            originalTransactionId: '2025061600005551'
            billingCurrency: USD
            merchantId: '3300005769'
            transactionAmount: '124.50'
            afterBalance: '315386.84'
            transactionCurrency: USD
            billingAmount: '124.50'
            transactionId: '2025061100008115'
            cardId: '2025061000003261'
            status: SUCCESS
          topic: AUTH_EVENT
        - data:
            cardName: test
            last4CardNum: '5863'
            transactionTime: '2025-07-03 14:21:56'
            mcc: '5734'
            type: AUTH_REVERSAL
            merchantName: AMAZON PAY INDIA PRIVA BA
            originalTransactionId: '2025070352541041'
            billingCurrency: USD
            merchantId: '784959000762203'
            transactionAmount: '10.00'
            afterBalance: '49996.94'
            transactionCurrency: HKD
            billingAmount: '1.27'
            transactionId: '2025070352546459'
            cardId: '2025070252241911'
            status: SUCCESS
          topic: AUTH_EVENT
      properties:
        topic:
          type: string
          description: AUTH_EVENT
        data:
          type: object
          properties:
            transactionCurrency:
              type: string
              description: 交易币种，参考ISO currency code
            cardName:
              type: string
              description: 卡片名称
            last4CardNum:
              type: string
              description: 卡片尾号
            transactionTime:
              type: string
              description: '授权交易时间，格式yyyy-MM-dd HH:mm:ss'
            mcc:
              type: string
              description: '商户类别编码（Merchant Category Code），参考：https://www.citibank.com/tts/solutions/commercial-cards/assets/docs/govt/Merchant-Category-Codes.pdf'
            type:
              type: string
              description: "类型枚举：\r\n- 授权（AUTH）\r\n- 授权撤销（AUTH_REVERSAL）"
            transactionId:
              type: string
              description: 授权交易单号
            merchantName:
              type: string
              description: 商户名称
            errorMsg:
              type: string
              description: 见授权交易错误码列表
            merchantId:
              type: string
              description: 卡网络商户唯一识别号
            transactionAmount:
              type: string
              description: 交易金额，单位：元
            cardId:
              type: string
              description: 卡唯一识别号
            errorMsgCode:
              type: string
              description: 见授权交易错误码列表
            status:
              type: string
              description: "状态枚举：\r\n- 成功 (SUCCESS)\r\n- 失败 (FAIL)"
            originalTransactionId:
              type: string
              x-stoplight:
                id: 147bzp30dn00v
              description: "原预授权交易单单号。代表同一笔交易\r\n如果是预授权，则为空"
            billingCurrency:
              type: string
              x-stoplight:
                id: nhdsaii5v1a94
              description: 账单币种，参考ISO currency code
            billingAmount:
              type: string
              x-stoplight:
                id: 5yx4955xmmruw
              description: 账单金额，单位：元
            afterBalance:
              type: string
              x-stoplight:
                id: t24cw1r0sgpxw
              description: 变动后余额（账单币种），单位：元
            merchantCountryCode:
              type: string
              x-stoplight:
                id: 3ku1jxjbcuvmx
              description: 商户国家
            accountType:
              type: string
              x-stoplight:
                id: 2b92welm0cuj3
              description: "账户类型枚举(仅开启子账户模式用户有此字段)\r\n- 主资金账户(VCC_ACCOUNT)\r\n- 子资金账户(SUB_ACCOUNT)"
            subAccountId:
              type: string
              x-stoplight:
                id: 2t0nhlks9zk91
              description: 子账户id，开通了子账户模式的用户传
    CARD_VERIFY_EVENT:
