            cardName:
              type: string
              description: 卡片名称
            merchantCountryCode:
              type: string
              description: 商户国家编码
            last4CardNum:
              type: string
              description: 卡片尾号
            transactionTime:
              type: string
              description: '交易时间，格式yyyy-MM-dd HH:mm:ss'
            mcc:
              type: string
