openapi: 3.1.0
x-stoplight:
  id: y8nkwa7v19jow
info:
  title: Webhook
  version: '1.0'
  description: 加签方式请参考 **Getting Started - 请求结果签名验证** 部分
servers:
  - url: 'http://localhost:3000'
paths: {}
components:
  schemas:
    CARD_LIMIT_CHANGED:
      type: object
      x-examples:
        Example 1:
          data:
            cardId: string
          topic: string
      title: 交易限额更新通知
      properties:
        topic:
          type: string
          description: CARD_LIMIT_CHANGED
        data:
          type: object
          properties:
            cardId:
              type: string
              description: 卡唯一识别号
      examples:
        - data:
            cardId: '2025060533923532'
          topic: CARD_LIMIT_CHANGED
    CARD_STATUS_CHANGED:
      type: object
      x-examples:
        Example 1:
          data:
            thirdUserId: 202108061000001-2022072600525014
            transactionCurrency: USD
            vccUserId: '2022072620335185'
            merchantId: '202202140029013'
            cardId: '2023022343939506'
            transactionAmount: '10.0'
            otp: '656332'
            cardNo: 4383-66xx-xxxx-7383
            cardNumber: 4383-66xx-xxxx-7383
            merchantName: TIKTOK ADS
          topic: CARD_3DS_OTP
      title: 卡状态变更通知
      examples:
        - data:
            cardId: '2025060835000677'
          topic: CARD_STATUS_CHANGED
      properties:
        topic:
          type: string
          description: CARD_STATUS_CHANGED
        data:
          type: object
          properties:
            cardId:
              type: string
              x-stoplight:
                id: etm6d6grv60uc
              description: 卡唯一识别号
            rechargeApplyId:
              type: string
              x-stoplight:
                id: x0rulwqxaxwto
              description: "卡充值外部申请单号</br>\r\n仅涉及卡BIN:000000"
    CARD_3DS_OTP:
      title: 3DS OTP通知
      x-stoplight:
        id: s6augqgh5b5dn
      type: object
      examples:
        - data:
            transactionCurrency: USD
            cardId: '2022120830003049'
            transactionAmount: '200.0'
            otp: '600003'
            cardNumber: 4777-77xx-xxxx-7777
            merchantName: TEST MERCHANT
          topic: CARD_3DS_OTP
      properties:
        topic:
          type: string
          x-stoplight:
            id: 98ps2wq36l4h4
          description: CARD_3DS_OTP
        data:
          type: object
          x-stoplight:
            id: k8sttu020oxof
          properties:
            otp:
              type: string
              x-stoplight:
                id: nlv8j1u6zpevh
              description: 3DS验证码
            cardId:
              type: string
              x-stoplight:
                id: 2ke2vxbw9ln3l
              description: 卡唯一识别号
            cardNumber:
              type: string
              x-stoplight:
                id: 87ymr79oigvhl
              description: 脱敏卡号，如4931-93xx-xxxx-1111
            transactionCurrency:
              type: string
              x-stoplight:
                id: pri8bqxvov04m
              description: 交易币种，参考ISO currency code
            transactionAmount:
              type: string
              x-stoplight:
                id: r11l9djcrghbe
              description: 交易金额，单位：元
            'merchantName  ':
              type: string
              x-stoplight:
                id: a1k30evtv2tlw
              description: 商户名称
      description: |-
        如有配置WEBHOOK URL，3DS OTP默认仅通过此API WEBHOOK发送。

        如果仍然希望通过邮箱/短信接收，请联系业务申请配置
    TOPUP_FINISHED:
      title: 充值交易通知
      x-stoplight:
        id: csr10cmpve1yl
      type: object
      properties:
        topic:
          type: string
          x-stoplight:
            id: wujar8qidgfc8
          description: TOPUP_FINISHED
        data:
          type: object
          x-stoplight:
            id: fpeww50a20u6e
          properties:
            transactionId:
              type: string
              x-stoplight:
                id: 3uls3t8exjy17
              description: 充值交易单号
            billId:
              type: string
              x-stoplight:
                id: sbijaje2x0egd
              description: 充值交易单号
      examples:
        - data:
            billId: '2025061130000561'
            transactionId: '2025061130000561'
          topic: TOPUP_FINISHED
    AUTH_EVENT:
      type: object
      x-examples:
        Example 1:
          data:
            thirdUserId: '2022021728838493'
            transactionCurrency: GBP
            bizType: 1
            cardName: ThomasRoland
            last4CardNum: '4467'
            merchantTerminalId: RGK6BLKDGV44ZCS
            transactionTime: '2024-11-01 00:00:01'
            mcc: '7311'
            type: AUTH
            transactionId: '2024110100888015'
            merchantName: TIKTOK ADS
            errorMsg: 其他
            merchantId: RGK6BLKDGV44ZCS
            transactionAmount: '51.97'
            cardId: '2024082470575171'
            transactionCurrencyCode: GBP
            errorMsgCode: '0008'
            status: FAIL
          topic: AUTH_EVENT
      title: 授权交易通知
