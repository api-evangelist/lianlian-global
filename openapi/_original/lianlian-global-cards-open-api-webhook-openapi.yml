              x-stoplight:
                id: y31rvqzfdq8co
              description: 子账户id，开通了子账户模式的用户传
    CARD_RECHARGE_FINISHED:
      type: object
      x-examples:
        Example 1:
          data:
            cardId: '2025090903050629'
            rechargeApplyId: '20250917154324'
            transactionId: '2025091705410978'
            status: SUCCESS
          topic: CARD_RECHARGE_FINISHED
      examples:
        - data:
            cardId: '2025090903050629'
            rechargeApplyId: '20250917154324'
            transactionId: '2025091705410978'
            status: SUCCESS
          topic: CARD_RECHARGE_FINISHED
      title: 卡充值申请变更通知
      properties:
        data:
          type: object
          properties:
            cardId:
              type: string
              description: 卡唯一识别号
            rechargeApplyId:
              type: string
              description: 外部申请单号
            transactionId:
              type: string
              description: 交易单号
            status:
              type: string
              description: "到终态才会通知，状态枚举：\r\n- 充值失败-FAIL\r\n- 充值成功-SUCCESS"
        topic:
          type: string
          description: CARD_RECHARGE_FINISHED
    SUB_USER_TRANSFER_RESULT:
      type: object
      x-examples:
        Example 1:
          data:
            amount: '1000.00'
            bizType: VCC_ACCOUNT_TOPUP
            subAccountId: '2025111833892363'
            createTime: '2025-11-19 13:27:23'
            currency: USD
            updateTime: '2025-11-19 13:27:23'
            rechargeApplyId: '20251119132722'
            transactionId: '20251119343066512'
            status: SUCCESS
          topic: SUB_USER_TRANSFER_RESULT
