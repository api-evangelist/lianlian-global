            transactionId:
              type: string
              description: 验卡交易单号
            merchantName:
              type: string
              description: 商户名称
            merchantId:
              type: string
              description: 卡网络商户唯一识别号
            transactionAmount:
              type: string
              description: 交易金额，单位：元
            cardId:
              type: string
              description: 卡唯一识别号
            status:
              type: string
              description: "状态枚举：\r\n- 成功(SUCCESS)\r\n- 失败）(FAIL)"
            accountType:
              type: string
