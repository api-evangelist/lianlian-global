            transactionId:
              type: string
              description: "交易单号</br>\r\nstatus=SUCCESS 时有值</br>\r\nstatus=FAIL 时为空"
            status:
              type: string
              description: "单据状态\r\n- SUCCESS 成功\r\n- FAIL 失败"
      title: 子用户转账结果通知
    CARD_RECHARGE:
      title: 卡充值交易通知
      x-stoplight:
        id: xtukj63b8ldi2
      type: object
      description: |-
        ### 通知场景说明

        - **用户主动充值**：充值完毕后会收到两个通知
          1. **充值任务完成通知**（`CARD_RECHARGE_FINISHED`）
          2. **资金单流水变动通知**（`CARD_RECHARGE`）

        - **后台补足**（卡余额 < 0 自动补足）：仅收到资金单流水变动通知（`CARD_RECHARGE`）
      properties:
        topic:
          type: string
          x-stoplight:
            id: x0y7uc3i600c5
          description: CARD_RECHARGE
        data:
          type: object
          x-stoplight:
            id: o7rlh7yahszla
          properties:
            merchantId:
              type: string
              x-stoplight:
                id: y92bpk06z3o8y
              description: 外部商户ID
            userId:
              type: string
              x-stoplight:
                id: 5umijspndd5rc
              description: 外部用户ID
            cardId:
              type: string
              x-stoplight:
                id: ikuucxlf26i60
              description: 卡唯一识别号
            vccUserId:
              type: string
              x-stoplight:
                id: jcqqm9vfl6hs8
              description: VCC用户ID
            thirdUserId:
              type: string
              x-stoplight:
                id: xpj2n4ykosmnd
              description: 第三方用户ID
            transactionId:
              type: string
              x-stoplight:
                id: wzjj072lavjks
              description: 资金单号
            currencyCode:
              type: string
              x-stoplight:
                id: n7j1rxgxd0fbe
              description: 币种代码
            amount:
              type: string
              x-stoplight:
                id: ii1aelmjx5r5l
              description: 金额，单位：元
            type:
              type: string
              x-stoplight:
                id: ott18imi0fdk6
              description: "类型枚举：\r\n卡充值扣款（CARD_RECHARGE）\r\n卡充值退款（CARD_RECHARGE_REVERSE）"
