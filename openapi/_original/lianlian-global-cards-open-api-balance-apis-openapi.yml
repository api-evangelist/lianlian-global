                    type: boolean
                    description: 成功标识
                  message:
                    type: string
                    description: 响应描述
              examples:
                Example 1:
                  value:
                    code: 100001
                    data:
                      accountList:
                        - amount: '99800.00'
                          currency: GBP
                          frozenAmount: '4414.52'
