    get:
      summary: 查询账户余额
      tags: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  Example 1:
                    code: 100001
                    data:
                      merchantId: vcc_merchant_001
                      accountList:
                        - amount: '1082.00'
                          currency: USD
                          frozenAmount: '0.00'
                      userId: '2023012966287896'
                    success: true
                    message: SUCCESS
                properties:
                  code:
                    type: integer
                    description: 响应码
                  data:
                    type: object
                    properties:
                      merchantId:
                        type: string
                      accountList:
                        type: array
                        description: 账单币种账户列表
                        items:
                          type: object
