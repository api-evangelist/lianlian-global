components:
  schemas:
    transactionType:
      title: transactionType
      x-stoplight:
        id: l7n83wotlyvll
      type: string
      description: |
        交易类型-类型枚举：
        - B2C收款账户转入（B2C_BALANCE_TOPUP）
        - B2C币种账户转入（B2C_CURRENCY_ ACCOUNT_TOPUP）
        - 银行转入（VIRTUAL_BANK_TOPUP）
        - 活动返现（CASH_BACK）
        - 奖励金（REBATE）
        - 奖励金扣回（REBATE_REFUND）
        - 外贸余额转入（B2B_BALANCE_TOPUP）
        - 服贸余额转入（SERVICE_COMMERCE_TOPUP）
        - 留学缴费转账充值（EDUCATION_MERCHANT_TOPUP）
        - 充值退款（REFUND）
        - 钱包充值（WALLET_MERCHANT_TOPUP）
        - 钱包退款（WALLET_MERCHANT_REFUND）
        - 提现（WITHDRAW）
        - 转出到卡账户（TOPUP_TO_CARD）
        - 注销后卡账户余额转入（CARD_CANCEL_REFUND）
        - 转出到卡账户(结算补扣)（TOPUP_TO_CARD_SETTLE_DEBIT）
        - 结算退款卡账户余额转入（CARD_REFUND_SETTLE_CREDIT）
        - 转出到子账户（TOPUP_TO_SUB_ACCOUNT）
        - 子账户转回（SUB_ACCOUNT_REFUND）
        - 主账户转入（VCC_ACCOUNT_TOPUP）
        - 转回主账户（REFUND_TO_VCC_ACCOUNT）
        - 消费（SETTLE）
        - 退款（SETTLE_REVERSAL）
        - 申卡手续费（CARD_APPLY_FEE）
        - 验卡手续费（CARD_VERIFY_FEE）
        - 授权交易手续费（AUTH_TRANSACTION_FEE）
        - 授权撤销交易手续费（AUTH_REVERSAL_TRANSACTION_FEE）
        - 结算手续费（SETTLE_TRANSACTION_FEE）
        - 结算退款手续费（SETTLE_REVERSAL_TRANSACTION_FEE）
        - 3DS OTP验证手续费（3DS_OTP_FEE）
        - 争议退款（DISPUTE_REFUND）
    accountType:
      title: accountType
      x-stoplight:
        id: q84ii4tzor2yr
      type: string
      description: |-
        账户类型枚举（不传则查询主资金账户）：
        - 主资金账户（VCC_ACCOUNT）
        - 子资金账户（SUB_ACCOUNT）
