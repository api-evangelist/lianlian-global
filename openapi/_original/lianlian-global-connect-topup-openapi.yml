openapi: 3.1.0
x-stoplight:
  id: 9u7rb4f4tsjay
info:
  title: Topup
  version: '1.0'
servers:
  - url: 'http://localhost:3000'
paths:
  /v1/topup:
    get:
      summary: 充值分页查询
      operationId: post-v1-topup-get_topup_list
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Topup'
                  page_size:
                    type: integer
                    description: 每页条数
                  page:
                    description: 当前页码
                    type: integer
                  total_count:
                    type: integer
                    description: 总条数
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ./Account.yaml#/components/schemas/Funding
      description: 充值信息分页查询。
      parameters:
        - schema:
            type: string
            maxLength: 32
          in: query
          name: account_number
          description: 虚拟卡号
        - schema:
            type: string
            maxLength: 128
          in: query
          name: currency_list
          description: '币种列表，币种列表 例如：["USD","JPY"] 参考： https://www.iso.org/iso-4217-currency-codes.html'
        - schema:
            type: string
          in: query
          name: begin_time
          description: 充值开始时间，10位 秒级时间戳
        - schema:
            type: string
          in: query
          name: end_time
          description: 充值结束时间，10位 秒级时间戳
        - schema:
            type: integer
            maximum: 8
          in: query
          name: page
          description: 页码，默认值为1
        - schema:
            type: integer
            maximum: 8
          in: query
          name: page_size
          description: 每页查询数量，默认值20
    parameters: []
  '/v1/topup/{topup_id}':
    get:
      summary: 充值详情查询
      tags: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topup'
        '400':
          description: Bad Request
      operationId: get-v1-topup-get_topup
      parameters: []
      description: ''
    parameters:
      - schema:
          type: string
        name: topup_id
        in: path
        required: true
components:
  schemas:
    Topup:
      title: Topup
      x-stoplight:
        id: ol0ivbum2debu
      type: object
      description: 充值信息
      properties:
        topup_id:
          type: string
          description: 充值单id
          maxLength: 32
        currency:
          type: string
          description: '币种  参考：https://www.iso.org/iso-4217-currency-codes.html'
          maxLength: 3
        amount:
          type: string
          description: 充值金额，单位元
          maxLength: 16
        payer_name:
          type: string
          description: 付款人名称
          maxLength: 256
        payer_bank_account_number:
          type: string
          description: 付款人银行账号
          maxLength: 128
        payer_bank_name:
          type: string
          description: 付款人银行名称
          maxLength: 256
        payer_bank_route_code:
          type: string
          description: 付款人银行路由号
          maxLength: 32
        trade_memo:
          type: string
          description: 附言
          maxLength: 256
        status:
          type: string
          description: 状态
          enum:
            - SUCCEEDED
            - PENDING
            - HEGDED
          maxLength: 16
        create_time:
          type: string
          description: 创建时间 10位 秒级时间戳
        modify_time:
          type: string
          description: 更新时间 10位 秒级时间戳
      required:
        - topup_id
        - currency
        - amount
        - payer_name
        - status
        - create_time
        - modify_time
