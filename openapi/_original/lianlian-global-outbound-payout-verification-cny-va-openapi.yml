              - amount
              - bankAccountType
              - payeeName
              - payeeBankAccount
          description: ''
      description: |-
        Create a single refund request, results will be noticed via webhook event. Client can also use `Query Refunding Trans` API to retrieve coresponding request results.

        Requested total refudning amount shall no larger than total funding amount.
        <br>创建人民币退款交易
      tags:
        - Operations
      consumes:
        - application/json
      produces:
        - application/json
      x-stoplight:
        id: hiyplzs65t02l
