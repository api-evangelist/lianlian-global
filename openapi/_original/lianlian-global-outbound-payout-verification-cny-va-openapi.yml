definitions:
  RecevingAccount:
    title: CNY Virtual Account
    type: object
    description: LianLian Global CNY virtual account information
    x-tags:
      - Models
    properties:
      virtualAcctId:
        type: string
        description: unique Virtual Account ID from client
        maxLength: 64
      accountName:
        type: string
        description: receiving account name
        maxLength: 72
      accountNo:
        type: string
        description: receiving account number
        maxLength: 72
      bankBranchName:
        type: string
        description: receiving account bank branch name
        maxLength: 256
      bankName:
        type: string
        description: 'receiving account bank name, mandatory for corporate payer'
        maxLength: 128
      cnapsBranchId:
        type: string
        description: CNAPS code
        maxLength: 12
      bankDistrict:
        type: string
        description: Receiving account bank branch address
        maxLength: 200
    x-stoplight:
      id: nk1fv9b4shu3s
  FundingTrans:
    title: FundingTrans
    type: object
    description: Funding transication record object in LianLian Global's system
    x-tags:
      - Models
    properties:
      fundingId:
        type: string
        description: Funding transaction id in LianLian Global's system
        maxLength: 32
      fundingType:
        type: string
        maxLength: 32
        x-stoplight:
          id: 3nh9lldklnyh5
        description: Online payment type
        enum:
          - ALIPAY
          - WECHATPAY
      virtualAcctId:
        type: string
        maxLength: 64
        description: Unique Virtual Account ID from client
      accountNo:
        type: string
        description: Receiving account number
        maxLength: 72
      payerName:
        type: string
        description: Payer name
        maxLength: 128
      payerBankAccount:
        type: string
        description: Payer bank account number
        maxLength: 72
      payerBankName:
        type: string
        description: Payer bank name
        maxLength: 72
      amount:
        type: string
        description: Amount in CNY
        maxLength: 24
      createTime:
        type: string
        description: |-
          Funding transication time
          UTC+0
        maxLength: 64
      rfb:
        type: string
        description: Reference for benificiary
        maxLength: 40
    required:
      - fundingId
      - payerName
      - payerBankAccount
      - payerBankName
      - amount
      - createTime
    x-stoplight:
      id: dgzdmjuzssu92
  CNYReFundTrans:
    title: CNYReFundTrans
    type: object
    description: CNY Refunding transication record object in LianLian Global's system
    x-tags:
      - Models
    properties:
      refundingId:
        type: string
        description: Unique refunding request id
        maxLength: 32
      virtualAcctId:
        type: string
        description: unique Virtual Account ID from client
        maxLength: 64
      amount:
        type: string
        description: requested refunding amount
        maxLength: 24
      bankAccountType:
        type: string
        description: |-
          Beneficiary account type, one of:

          |value|description|
          |------|------------|
          |INDIVIDUAL|Individual account|
          |CORPORATE|Corporate account|
        enum:
          - INDIVIDUAL
          - CORPORATE
      bankName:
        type: string
        description: beneficiary bank name
        maxLength: 128
      bankBranchName:
        type: string
        description: Bank branch name
        maxLength: 256
      cnapsBranchId:
        type: string
        description: |-
          CNAPS code
          Mandatory is `bankAccountType = CORPORATE`
        maxLength: 12
      bankCode:
        type: string
        description: 'Bank Code defined by LianLian Global, mandatory if `bankAccountType = CORPORATE`. Please refer to appendix Bank List'
        maxLength: 8
        minLength: 8
      payeeName:
        type: string
        description: beneficiary account name
        maxLength: 72
      payeeBankAccount:
        type: string
        description: beneficiary account number
        maxLength: 72
      rfb:
        type: string
        description: rfb
        maxLength: 40
      createTime:
        type: string
        format: date-time
        description: Refunding create time
      modifyTime:
        type: string
        description: Refund modify time
        format: date-time
      status:
        type: string
        description: |-
          refunding status, one of:

          | value |description|
          |------|------------|
          |INIT| Init |
          |SUCCESS|Success|
          |PROCESSING|Processing |
          |FAILED|failed|
          |HEDGED|refund failed after success|
        enum:
          - PROCESSING
          - SUCCESS
          - FAILED
          - HEDGED
      failReason:
        type: string
        description: Refund failure reason
        maxLength: 128
    required:
      - refundingId
      - amount
      - payeeName
      - payeeBankAccount
      - createTime
      - status
    x-stoplight:
      id: k18bhc73nbudw
  CNYPaymentTrans:
    title: CNYPaymentTrans
    type: object
    description: CNY Payment transication record object in LianLian Global's system
    x-tags:
      - Models
    properties:
      paymentId:
        type: string
        description: Unique refunding request id
        maxLength: 32
      virtualAcctId:
        type: string
        description: unique Virtual Account ID from client
        maxLength: 64
      amount:
        type: string
        description: requested refunding amount
        maxLength: 24
      bankAccountType:
        type: string
        description: |-
          Beneficiary account type, one of:

          |value|description|
          |------|------------|
          |INDIVIDUAL|Individual account|
          |CORPORATE|Corporate account|
        enum:
          - INDIVIDUAL
          - CORPORATE
      bankName:
        type: string
        description: beneficiary bank name
        maxLength: 128
      bankBranchName:
        type: string
        description: Bank branch name
        maxLength: 256
      cnapsBranchId:
        type: string
        description: |-
          CNAPS code
          Mandatory is `bankAccountType = CORPORATE`
        maxLength: 12
      bankCode:
        type: string
        description: 'Bank Code defined by LianLian Global, mandatory if `bankAccountType = CORPORATE`. Please refer to appendix Bank List'
        maxLength: 8
        minLength: 8
      payeeName:
        type: string
        description: beneficiary account name
        maxLength: 72
      payeeBankAccount:
        type: string
        description: beneficiary account number
        maxLength: 72
      rfb:
        type: string
        description: rfb
        maxLength: 40
      createTime:
        type: string
        format: date-time
        description: Refunding create time
      modifyTime:
        type: string
        description: Refund modify time
        format: date-time
      status:
        type: string
        description: |-
          refunding status, one of:

          | value |description|
          |------|------------|
          |INIT| Init |
          |SUCCESS|Success|
          |PROCESSING|Processing |
          |FAILED|failed|
          |HEDGED|refund failed after success|
        enum:
          - PROCESSING
          - SUCCESS
          - FAILED
          - HEDGED
      failReason:
        type: string
        description: Refund failure reason
        maxLength: 128
    required:
      - paymentId
      - amount
      - bankAccountType
      - payeeName
      - payeeBankAccount
      - createTime
      - modifyTime
    x-stoplight:
      id: yatq7bl0s0367
x-stoplight:
  id: 44478b5ca1df5
paths:
  /cnyva:
    post:
      summary: Create a CNY Virtual Account
      operationId: post-cny-va
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/RecevingAccount'
          examples:
            Example 1:
              virtualAcctId: va2023010100001
              accountName: 连连银通电子支付有限公司客户备付金
              accountNo: '30106162007300'
              bankBranchName: 招商银行杭州之江支行
              bankName: 招商银行
              cnapsBranchId: '308331012126'
              bankDistrict: 浙江杭州
        '400':
          description: |-
            Bad Request

            Possible error codes:

            | Code | Description |
            |------|-------------|
            | 100001|虚拟卡申请处理中，请稍后 |
            | 100002|虚拟卡暂不可申请，请稍后再试|
            | 999995 |Parameter is error. |
          schema:
            type: object
            description: Failed object in LianLian Global's system
            properties:
              code:
                type: string
                x-stoplight:
                  id: rnjbonbko8pk9
              message:
                type: string
                x-stoplight:
                  id: aofqjfurq46p2
              httpCode:
                type: string
                x-stoplight:
                  id: 3oz77ffs33y6x
            required:
              - code
              - message
              - httpCode
          examples:
            Example 1:
              code: '100002'
              message: 虚拟卡暂不可申请，请稍后再试
              httpCode: 400
        '500':
          description: Internal Server Error
          schema:
            type: object
            description: Error object in LianLian Global's system
            properties:
              code:
                type: string
                x-stoplight:
                  id: xwhsp7g7vfmel
              message:
                type: string
                x-stoplight:
                  id: dd4s3986ezblq
              httpCode:
                type: string
                x-stoplight:
                  id: xajmdh8wdkviq
            required:
              - code
              - message
              - httpCode
          examples:
            Example 1:
              code: '500000'
              message: 'Internal Server Error, Contact LianLian Global for technical support'
              httpCode: '500'
      description: 创建人民币VA账户
      parameters:
        - in: body
          name: body
          schema:
            type: object
            properties:
              virtualAcctId:
                type: string
                description: Unique Virtual Account ID from client
                maxLength: 64
            required:
              - virtualAcctId
          description: ''
          x-examples:
            Example 1:
              virtualAcctId: va20230101000001
      tags:
        - Operations
      consumes:
        - application/json
      produces:
        - application/json
      x-stoplight:
        id: ks6kdrt4ot574
