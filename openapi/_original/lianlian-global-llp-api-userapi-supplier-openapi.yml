              code: '109052'
              message: 外部批次号重复
        '500':
          description: |-
            | Code | Message |
            |------|-------------|
            | 500000 |Internal Server Error, Contact Lianlian Pay for technical support|
      description: |
        1、该接口的调用需要优先在连连端开通功能白名单方可使用，当连连这边认定的假期期间，供应商付款也是暂时不可用的；</br>
        2、在创建该请求前用户需要先调用短信验证码接口来获取二次校验，每小时获取短信验证码上限10次；短信验证码错误次数达8次账号锁定且在2小时之内不能再进行资金操作；</br>
        3、当用户发送批量付款请求时，API端会根据当前汇率来预估用户余额是否充足，如果余额不足会返回余额不足错误。
        ### 供应商付款流程图
        ![](https://cbva-cms2.oss-cn-hangzhou.aliyuncs.com/cb_file/erp/20220630-154046.jpg)

        联调地址 - **https://global-api-sandbox.lianlianpay-inc.com/supplier/v1/batch-payments** </br>
        生产域名 - **https://global-api.lianlianpay.com/supplier/v1/batch-payments**
      tags:
        - 接口
      parameters:
        - in: body
          name: body
          schema:
            type: object
            properties:
              batchId:
                type: string
                minLength: 16
                maxLength: 32
                description: 付款唯一批次号
              verificationCode:
                type: string
                description: 短信验证码
                minLength: 4
                maxLength: 8
              sourceCurrency:
                type: string
                description: 源币种
                example: USD
                minLength: 3
                maxLength: 3
              targetCurrency:
                type: string
                description: 目标币种
                example: USD
                minLength: 3
                maxLength: 3
              list:
                type: object
                description: 批量付款总笔数，最大1000条
                maxProperties: 1000
                required:
                  - tradeCode
                  - payeeBankAccountId
                  - payeeBankAccountNo
                  - paymentId
                  - tradeDate
                  - targetAmount
                properties:
                  tradeCode:
                    $ref: '#/definitions/tradeCode'
                  payeeBankAccountId:
                    type: string
                    description: 收款人编号，即创建收款人银行账号信息返回的id
                    maxLength: 32
                  payeeBankAccountNo:
                    type: string
                    description: 收款人银行账号，用于校验
                    maxLength: 32
                  paymentId:
                    type: string
                    description: 外部唯一单号
                    maxLength: 32
                  tradeDate:
                    type: string
                    description: 交易时间
                    format: date
                    pattern: yyyyMMdd
                  goodsName:
                    type: string
                    description: 商品名称</br>tradeCode为E_BUSINESS时必填
                    maxLength: 64
                  goodsNumber:
                    type: integer
                    description: 商品数量</br>tradeCode为E_BUSINESS时必填
                    exclusiveMaximum: false
                  goodsPrice:
                    type: number
                    description: 商品单价</br>tradeCode为E_BUSINESS时必填
                    minimum: 0
                  logistics:
                    type: string
                    description: |-
                      tradeCode为E_BUSINESS时必填</br>
                      EXPRESS(快递)</br>
                      OFFLINE(当面采购)</br>
                      LOGISTICS(物流)
                    enum:
                      - EXPRESS
                      - OFFLINE
                      - LOGISTICS
                  procurementType:
                    type: string
                    description: |-
                      tradeCode为E_BUSINESS时必填</br>
                      ONLINE(网络采购)</br>
                      OFFLINE_HAS_TAX(线下有票(增值税发票))</br>
                      OFFLINE_NO_TAX(线下无票(无增值税发票))
                    enum:
                      - ONLINE
                      - OFFLINE_HAS_TAX
                      - OFFLINE_NO_TAX
                  targetAmount:
                    type: string
                    description: 目标金额
                  memo:
                    type: string
                    maxLength: 225
                    description: 附言
                  useObo:
                    type: boolean
                    description: '是否使用obo付款,obo支持的到账币种为USD,JPY,SGD,AUD,HKD,GBP,EUR,CNH,CAD'
                    default: false
                    format: boolean
                  serviceName:
                    type: string
                    description: 服务名称</br>tradeCode 不为 E_BUSINESS时必填
                    maxLength: 128
            required:
              - batchId
              - verificationCode
              - sourceCurrency
              - targetCurrency
              - list
          x-examples:
            application/json:
              batchId: '202106083513522'
              verificationCode: '538145'
              sourceCurrency: CNH
              targetCurrency: CNY
              list:
                - tradeCode: E_BUSINESS
                  payeeBankAccountId: '202101196545256'
                  payeeBankAccountNo: '6212261111121395849'
                  paymentId: '202106083513522000001'
                  tradeDate: '20210608'
                  goodsName: '服装,鞋子等'
                  goodsNumber: 1
                  goodsPrice: 5000
                  logistics: OFFLINE
                  procurementType: ONLINE
                  targetAmount: 5000
                  memo: 测试付款备注1
                - tradeCode: E_BUSINESS
