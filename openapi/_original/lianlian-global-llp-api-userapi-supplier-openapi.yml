swagger: '2.0'
info:
  title: 供应商付款服务 API
  version: '1.0'
  description: '联调域名 - **https://global-api-sandbox.lianlianpay-inc.com** </br> 生产域名 - **https://global-api.lianlianpay.com**'
  contact:
    name: ''
    email: dev_support@lianlianpay.com
host: global-api-sandbox.lianlianpay-inc.com
paths:
  /payee-document:
    put:
      summary: 更新收款人材料信息
      operationId: put-payee-document
      responses:
        '200':
          description: OK
        '400':
          description: |-
            | Code | Message | Description |
            |------|-------------|-------------|
            | 109006 | 收款人信息不存在。 | |
            | 109007 | 存在正在审核的合同。 | 审核成功状态的收款人可调此接口更新材料 |
            | 400001 | Missing LLPAY-Signature header. |请求头缺失 |
            | 400003 | Invalid signature time. | 请求头时间戳不合法（请求消息包的签名时间和本地服务器的时间的最大允许阈值10min） |
            | 400006 | Signature validation failed. Contact Lianlian Pay for technical support. |验签异常，请参照授权流程中签名规则检查 |
            | 510004 | File does not exist. | |
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
              message:
                type: string
          examples:
            application/json:
              code: '109007'
              message: 存在正在审核的合同。
        '500':
          description: |-
            | Code | Message |
            |------|-------------|
            | 500000 |Internal Server Error, Contact Lianlian Pay for technical support|
      description: |-
        更新合同材料信息

        联调地址 - **https://global-api-sandbox.lianlianpay-inc.com/supplier/v1/payee-document**  </br>
        生产域名 - **https://global-api.lianlianpay.com/supplier/v1/payee-document**
      parameters:
        - in: body
          name: body
          schema:
            type: object
            properties:
              payeeBankAccountId:
                type: string
                description: |-
                  收款人银行账户编号
                  即创建收款人银行账号信息接口返回id
              attachmentId:
                type: string
                description: 即上传附件接口返回id
            required:
              - payeeBankAccountId
              - attachmentId
          description: ''
          x-examples:
            application/json:
              payeeBankAccountId: '202106011567401'
              attachmentId: '202106162194017'
        - in: header
          name: Authorization
          type: string
          required: true
        - in: header
          name: LLPAY-Signature
          type: string
          required: true
        - in: header
          name: Content-Type
          type: string
          required: true
          default: application/json
      tags:
        - 接口
  /payee-bank-accounts:
    post:
      summary: 创建收款人银行账号信息
      operationId: post-payees
      responses:
        '200':
          description: OK
          schema:
            title: 收款人银行账号信息
            type: object
            description: 收款人银行账号信息
            x-tags:
              - 对象
            properties:
              id:
                type: string
                description: 收款人银行卡账户编号
                maxLength: 32
              accountType:
                type: string
                enum:
                  - ENTERPRISE
                  - INDIVIDUAL
                description: |-
                  银行卡账户绑定类型：
                    ENTERPRISE: 对公类型
                    INDIVIDUAL: 对私类型
              region:
                type: string
                description: 地区，参考`MODELS-地区`
                enum:
                  - CN
                  - US
                  - FR
                  - DE
                  - IT
                  - ES
                  - GB
                  - HK
                  - AU
                  - TW
                  - KR
                  - JP
                  - SG
                  - CA
                  - NL
                minLength: 2
                maxLength: 2
              status:
                type: string
                description: |2-





























                      WAITING_DOCUMENT("待完善材料"),
                      WAITING_CHECK("待审核"),
                      SUCCESS("成功"),
                      FAILED("失败")
                enum:
                  - WAITING_DOCUMENT
                  - WAITING_CHECK
                  - SUCCESS
                  - FAILED
              createTime:
                type: string
                description: 创建时间
                format: date-time
                pattern: 'yyyy-MM-ddTHH:mm:ss.sssZ'
              cnyBankAccountInfo:
                title: 人民币银行账号信息
                type: object
                description: 人民币银行账号信息，创建国内CNY（人民币）银行账号信息时必传
                x-tags:
                  - 对象
                properties:
