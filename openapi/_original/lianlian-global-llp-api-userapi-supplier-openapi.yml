  tradeCode:
    title: 贸易类型
    type: string
    description: |-
      tradeCode | 贸易类型
      ------- | -------
      E_BUSINESS | 电商销售/货物贸易
      LOGISTIC_FEE | 物流费
      ADS | 广告费
      OPERATING_EXPENSES | 运营费用
      TAX_FEE | 税务费用
      IP_FEE | 专利服务费
      SALARY_FEE | 工资
      ONLINE_PROMOTION_FEE | 网红推广费
  region:
    title: 地区
    description: "|region\t  |描述\t    |\n|-------|-------------|\n|CN\t|中国大陆\t      |\n|US\t|美国\t      |\n|FR\t|法国\t      |\n|DE\t|德国\t      |\n|IT\t|意大利\t      |\n|ES\t|西班牙\t      |\n|GB\t|英国\t      |\n|HK\t|中国香港\t      |\n|AU\t|澳大利亚\t      |\n|TW\t|中国台湾\t      |\n|KR\t|韩国\t      |\n|JP\t|日本\t      |\n|SG\t|新加坡\t      |\n|CA\t|加拿大\t      |\n|NL\t|荷兰\t      |\n|CNF\t|大陆外币\t      |"
    type: string
  paymentstatuscallback:
    type: object
    x-examples:
      success:
        data:
          batchId: '20220823111521'
          errorMsg: ''
          paymentId: '202208230271594'
          status: success
          updateTime: '2022-08-23T03:17:18.000Z'
        event_name: payment.order.status.response
      fail:
        data:
          batchId: '20220823002'
          errorMsg: 该收款人不支持当前付款币种的支付。
          paymentId: '202208230271582'
          status: fail
          updateTime: '2022-08-23T03:17:18.000Z'
        event_name: payment.order.status.response
    title: 付款交易状态更新回调通知
    properties:
      data:
        type: object
        properties:
          batchId:
            type: string
          errorMsg:
            type: string
          paymentId:
            type: string
          status:
            type: string
            enum:
              - success
              - fail
          updateTime:
            type: string
      event_name:
        type: string
    description: |
      paymentId维度付款成功/失败时发送通知

      如需接收通知，请先调用`通用服务API-注册WebHook`注册付款Event`payment.order.status.response`
