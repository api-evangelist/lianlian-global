                  swiftCode:
                    type: string
                    description: SWIFT code
                  bankAddress:
                    type: string
                    description: 银行地址
                  currency:
                    type: string
                    description: 币种
                    example: USD
                    minLength: 3
                    maxLength: 3
                required:
                  - accountName
                  - bankName
                  - accountNo
                  - swiftCode
                  - bankAddress
