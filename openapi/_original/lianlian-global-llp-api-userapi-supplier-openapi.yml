        '400':
          description: |-
            | Code | Message | Description |
            |------|-------------|-------------|
            | 009012 | 该银行卡企业“贸易外汇收支企业名录”状态异常，无法提现至该银行卡 | |
            | 009013 | 该银行卡企业未在当地外管局办理名录登记，无法提现至该银行卡 | |
            | 109001 | 收款人申报失败 | |
            | 109002 | 收款人审核失败。 | |
            | 109003 | 对公账户不支持绑定对私银行卡。 | |
            | 109004 | 存在待审核的合同。 | 已存在审核中的收款人 |
            | 109008 | 卡号不正确，请检查卡号是否存在。 | |
            | 109009 | 禁止付境外个人 | |
            | 400001 | Missing LLPAY-Signature header. |请求头缺失 |
            | 400003 | Invalid signature time. | 请求头时间戳不合法（请求消息包的签名时间和本地服务器的时间的最大允许阈值10min） |
            | 400006 | Signature validation failed. Contact Lianlian Pay for technical support. |验签异常，请参照授权流程中签名规则检查 |
            | 510004 | File does not exist. | attachmentId不存在 |
            | 999995 | 例："[accountType]may not be empty" |请求参数有误 |
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
              message:
                type: string
          examples:
            application/json:
              code: '109002'
              message: 收款人审核失败。
        '500':
          description: |-
            | Code | Message |
            |------|-------------|
            | 500000 |Internal Server Error, Contact Lianlian Pay for technical support|
          examples: {}
      description: |-
        创建收款人银行账号信息
        * 创建前请提前调用`通用服务-上传附件`接口上传相关材料文件（采购单/结算单/物流单/报关单等，具体可咨询客户经理），创建成功会返回收款人信息，如果姓名、证件号、银行账号匹配已有收款人信息，则会返回已存在的收款人。

        * 成功创建收款人银行账号之后，连连这边会进行申报审核，状态为审核成功之后就能正常使用该收款人。

        联调地址 - **https://global-api-sandbox.lianlianpay-inc.com/supplier/v1/payee-bank-accounts** </br>
        生产域名 - **https://global-api.lianlianpay.com/supplier/v1/payee-bank-accounts**
      tags:
        - 接口
      parameters:
        - in: body
          name: body
          schema:
            type: object
            properties:
              attachmentId:
                type: string
                description: 附件编号（附件上传接口返回的Id）
                maxLength: 32
              accountType:
                type: string
                enum:
                  - ENTERPRISE
                  - INDIVIDUAL
                description: |-
                  银行账户绑定类型：</br>ENTERPRISE: 对公类型</br>
                     INDIVIDUAL: 对私类型
              region:
                type: string
                description: 地区，参考`MODELS-地区`
                enum:
                  - CN
                  - US
                  - FR
                  - DE
                  - IT
                  - ES
                  - GB
                  - HK
                  - AU
                  - TW
                  - KR
                  - JP
                  - SG
                  - CA
                  - NL
                minLength: 2
                maxLength: 2
              cnyBankAccountInfo:
                type: object
                description: 人民币银行账户
                properties:
                  contactPhone:
                    type: string
                    description: 收款人联系电话
                    maxLength: 12
                  accountNo:
                    type: string
                    description: 银行账号
                    maxLength: 32
                  certNo:
                    type: string
                    maxLength: 18
                    description: '收款人证件号码:</br>对公时为企业信用代码</br>对私为个人身份证号码'
                  branchBankName:
                    type: string
                    description: '支行名称</br>添加大陆对私银行卡时不必传</br>添加大陆对公银行卡时必传，可调用`通用服务API-大陆银行支行名称模糊查询`，且无需再传cityCode,bankCode字段。'
                    maxLength: 32
                  accountName:
                    type: string
                    description: 账户名称
                    maxLength: 32
                  bankCode:
                    type: string
                    description: 银行编码，请参照`MODELS-收款银行编码`对象填写编号
                  cityCode:
                    type: string
                    description: |-
                      城市编码

                      请调用`通用服务-省市字典接口`查询获得provincecode，再用具体某一个provincecode调接口获取对应的cityCode
                required:
                  - contactPhone
                  - accountNo
                  - certNo
                  - accountName
              fcyBankAccountInfo:
                title: 非人民币银行账户信息
                type: object
                description: 非人民币银行账户信息，创建非人民币银行账户信息时必传
                x-tags:
                  - 对象
                properties:
                  accountName:
