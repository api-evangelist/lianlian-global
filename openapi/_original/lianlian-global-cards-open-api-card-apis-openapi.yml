openapi: 3.1.0
x-stoplight:
  id: cd4kuv7gsez0s
info:
  title: CARD APIS
  version: '1.0'
  description: "Sandbox : https://test-global-api.lianlianpay-inc.com\r\n\r\nProd    : https://global-api.lianlian.com"
  contact:
    name: ''
  summary: VCC -APIS
servers:
  - url: 'https://test-global-api.lianlianpay-inc.com'
  - url: 'https://global-api.lianlian.com'
    description: ''
paths:
  /gateway/vcc-api/card POST:
    post:
      summary: 申请卡
      operationId: post-vcc-apply-card
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  Example 1:
                    code: 100001
                    data:
                      cardId: '2024110661353586'
                    success: true
                    message: SUCCESS
                required:
                  - code
                  - success
                  - message
                properties:
                  code:
                    type: integer
                    description: 响应码
                  data:
                    type: object
                    properties:
                      cardId:
                        type: string
                        description: 卡唯一识别号
                  success:
                    type: boolean
                    description: 成功标识
                  message:
                    type: string
                    description: 响应描述
              examples:
                Example 1:
                  value:
                    code: 100001
                    data:
                      cardId: '2023092284439339'
                    success: true
                    message: SUCCESS
        '400':
          description: Missing Required Information
        '409':
          description: Email Already Taken
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - currency
                - cardName
                - email
                - settleCurrencyCode
                - cardBinName
              properties:
                currency:
                  type: string
                  description: 基础币种（充值币种），支持USD/CNY等，具体结合业务场景和连连侧线下沟通确认开通
                cardName:
                  type: string
                  description: 自定义卡片名称，可使用交易对手名称或订单编号等
                email:
                  type: string
                  description: 联系邮箱，用于接收该卡的额度变动通知
                expiryDate:
                  type: string
                  description: 卡有效期，格式：MMYY，建议不超过4年11个月，例如 0426指的是  26年4月份过期
                settleCurrencyCode:
                  type: string
                  x-stoplight:
                    id: dneqj6v6pypdu
                  description: 结算币种，只有使用特殊卡bin，才会用到该字段
                cardBinName:
                  type: string
                  x-stoplight:
                    id: gcm11tqsi3iyg
                  description: 卡BIN，6位纯数字</br>可登陆越达卡后台点击申卡查看可选卡BIN
                tradeSceneCode:
                  type: string
                  x-stoplight:
                    id: 2ihaz5bqhfxnc
                  description: "交易场景编码，CNY卡必传\r\n<br>\r\ntrade_scene_code\ttrade_scene <br>\r\n001\t因公差旅<br>\r\n002\t商标注册<br>\r\n003\tEPR<br>\r\n004\t律师费<br>\r\n005\t旅游服务费用<br>\r\n006\t网络游戏测试费<br>\r\n007\t商务旅行费用<br>\r\n008\t旅游签证费用<br>\r\n009\t航空机票费用<br>\r\n010\t物流费用<br>\r\n011\t广告费用<br>\r\n012\t技术服务费<br>\r\n013\t一年以上留学/研学教育<br>\r\n014\t一年（含）以内留学/研学教育<br>\r\n015\t留学/研学服务佣金<br>"
                cardLimitRules:
                  type: object
                  x-stoplight:
                    id: xwnd8to0uvn0j
                  description: 卡限制规则
                  properties:
                    enableTransactionCurrencyControl:
                      type: boolean
                      x-stoplight:
                        id: cut4zuan1rwb2
                      description: 是否开启交易币种限制
                    limitTransactionCurrencies:
                      type: array
                      x-stoplight:
                        id: s78uskun5n2bq
                      description: "限制币种范围<br>\r\n打开交易币种限制开关时，集合非空<br>\r\n关闭交易币种限制开关时，为null"
                      items: {}
                    enableTransactionCountControl:
                      type: boolean
                      x-stoplight:
                        id: k959t01vv8dvo
                      description: "是否开启交易次数限制<br>\r\ntrue：开启控制  false：关闭控制"
                    limitTransactionCount:
                      type: integer
                      x-stoplight:
                        id: 410xnw23n318i
                      description: "交易限制次数<br>\r\n打开交易次数限制开关时，次数为非负整数()<br>\r\n关闭交易次数限制开关时，不传或传null<br>"
                    mccCodes:
                      type: array
                      x-stoplight:
                        id: d6w4y9m9x4o0x
                      description: "MCC加白列表<br>\r\n每个元素4位数字，最多20个<br>"
                      items:
                        x-stoplight:
                          id: v3r2u4p7s4b4a
                        type: string
                    fuzzyMerchantNames:
                      type: array
                      x-stoplight:
                        id: 410xnw23n318i
                      description: "商户名称加白列表(模糊匹配)<br>\r\n每个最长40字符，最多20个<br>"
                      items:
                        x-stoplight:
                          id: e6m0k4m0w3h4u
                        type: string
                cardTags:
                  type: array
                  x-stoplight:
                    id: 8v3o76eup90ii
                  description: "卡标签集合\r\n至多8个标签，每个标签不超过35字符"
                  items:
                    x-stoplight:
                      id: qwapt17mvzalo
                    type: string
                mode3ds:
                  type: string
                  x-stoplight:
                    id: ti4zusaf8xeji
                  description: "交易认证3ds模式<br>\r\nBY_PASS\t静默通过<br>\r\nCHALLENGE 需要验证"
                rechargeApplyId:
                  type: string
                  x-stoplight:
                    id: wnzp2y960edm9
                  description: "充值外部单号，支持幂等</br>\r\n卡BIN:000000 必填</br>\r\n其他卡BIN（包括Amex）不允许传值"
                subAccountId:
                  type: string
                  x-stoplight:
                    id: mp1n9wx4qoq3i
                  description: "子账户id</br>\r\n若用户已开启子账户模式，则subAccountId必传"
            examples:
              Example 1:
                value:
                  cardName: API Test Card
                  expiryDate: '0125'
                  cardBinName: '522981'
                  currency: GBP
                  settleCurrencyCode: GBP
                  email: zhouxd@lianlianpay.com
                  cardLimitRules:
                    enableTransactionCurrencyControl: true
                    limitTransactionCurrencies:
                      - HKD
                      - USD
        description: ''
      description: "Sandbox : https://test-global-api.lianlianpay-inc.com\r\n\r\nProd    : https://global-api.lianlian.com\r\n\r\n异步处理申卡请求，申卡成功CARD_STATUS_CHANGED Webhook通知，建议定时查询初始化状态的卡以获取最新状态。\r\n"
      x-stoplight:
        id: olktmiomtqkf9
      parameters:
        - schema:
            type: string
          in: header
          name: 'Authorization:'
          description: 'Basic {token}'
        - schema:
            type: string
          in: header
          name: 'LLPAY-Signature:'
          description: 't={REQUEST_EPOCH},v={payload}'
    parameters: []
  /gateway/vcc-api/card/apply/sync:
    post:
      summary: 申请卡(同步)
      tags: []
      responses:
        '200':
          description: ''
