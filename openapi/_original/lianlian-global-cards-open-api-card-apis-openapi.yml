                              type: string
                              description: 总剩余限额 单位：元
                            lifeTimeLimit:
                              type: string
                              description: 授权交易总限额 单位：元
                      cardNo:
                        type: string
                        description: 16位完整卡号，申卡成功返回
                      cardOrganization:
                        type: string
                        description: 卡组织 VISA、MasterCard
                      expiryDate:
                        type: string
                        description: 卡有效期
                      cardId:
                        type: string
                        description: 卡唯一识别号
                      cardLimitRules:
                        type: object
                        description: 卡限制规则
                        properties:
                          enableTransactionCountControl:
                            type: boolean
                            description: "是否开启交易次数限制<br>\r\ntrue：开启控制  false：关闭控制"
                          limitTransactionCount:
                            type: integer
                            description: "交易限制次数<br>\r\n打开交易次数限制开关时，次数为非负整数()<br>\r\n关闭交易次数限制开关时，不传或传null<br>"
                          enableTransactionCurrencyControl:
                            type: boolean
                            x-stoplight:
                              id: 6qf76is8joeuj
                            description: "是否开启交易币种限制<br>\r\ntrue：开启控制  false：关闭控制"
                          limitTransactionCurrencies:
                            type: array
                            x-stoplight:
                              id: w08rprm8jpxcq
                            description: "限制币种范围<br>\r\n打开交易币种限制开关时，集合非空<br>\r\n关闭交易币种限制开关时，为null"
                            items:
                              x-stoplight:
                                id: wb8zhcjuou674
                              type: string
                      email:
                        type: string
                        description: 联系邮箱
                      status:
                        type: string
                        description: "卡状态，包含：\r\n- 申请中（APPLYING）\r\n- 活跃（VALID）\r\n- 已冻结（ABNORMAL）\r\n- 已注销（CANCEL）\r\n- 注销中（PRE_CANCEL）\r\n- 已过期（EXPIRED）"
