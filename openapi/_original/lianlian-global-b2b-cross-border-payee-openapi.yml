              type: string
              description: |-
                受益人证件有效期是否为长期，填写方式如下

                |传输值|解释|
                |-----|-----|
                |0|长期|
                |1|非长期|
              enum:
                - 0
                - 1
            uboPersIdIssue:
              type: string
              description: 受益人身份证签发日期，若证件非长期则必填，格式：yyyyMMdd
              minLength: 8
              maxLength: 8
            uboPersIdExpiry:
              type: string
              description: 受益人身份证有效期，若证件非长期则必填，格式：yyyyMMdd
              minLength: 8
              maxLength: 8
            uboAddress:
              type: string
              description: 受益人地址
              maxLength: 128
            uboEvidence:
              type: string
              description: 受益人证明文件
              maxLength: 64
      payeeStatus:
        type: string
        description: |-
          收款人审核状态，审核状态如下

          |值|解释|
          |----|-----|
          |Processing|审核中|
          |Successed|审核成功|
          |Failed|审核失败|
          |NeedUpdate|需更新材料|
          |Prohibit|停止服务|
        enum:
          - Processing
          - Successed
          - Failed
          - NeedUpdate
          - Prohibit
      failedReason:
        type: string
        description: 若收款人审核失败，该显示审核失败原因
        maxLength: 128
    required:
      - payeeId
      - payeeType
      - payeeNameCn
      - payeeNameEn
      - payeeDate
      - payeeIdType
      - payeeIdScanFront
      - payeeIdNo
      - payeeAddress
      - payeeIdIsLt
      - payeeIdExpiry
      - payeeContactNo
