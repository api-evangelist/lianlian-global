            description: ''
            x-tags:
              - 对象
            properties:
              id:
                type: string
                description: 流水单号
                maxLength: 32
              url:
                type: string
                description: webhook url
                maxLength: 64
              topic:
                type: string
                title: Event-Topic枚举
                description: |
                  定义的Topic

                  | Topic | Event-Data名称| 描述|
                  |--------|------------|------------|
                  | withdraw.event.response | 提现Event|在提现成功、提现失败时触发相关事件|
                x-tags:
                  - 对象
              createTime:
                type: string
                description: 创建时间
                format: date-time
            required:
              - id
              - url
              - topic
              - createTime
          examples:
            application/json:
              id: 202103239016596&1138
              url: www.baidu.com
              createTime: '2021-03-23T10:46:19.000Z'
              topic: withdraw.event.response
        '400':
          description: |-
            | Code | Message | Description |
            |------|-------------|-------------|
            | 400001 | Missing LLPAY-Signature header. |请求头缺失 |
            | 400003 | Invalid signature time. | 请求头时间戳不合法（请求消息包的签名时间和本地服务器的时间的最大允许阈值10min） |
            | 400006 | Signature validation failed. Contact Lianlian Pay for technical support. |验签异常，请参照授权流程中签名规则检查 |
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
              message:
                type: string
          examples:
            application/json:
              error: Bad request
              code: '400006'
              message: Signature validation failed. Contact Lianlian Pay for technical support.
        '404':
          description: 传入webhookId不存在
          examples:
            application/json:
              message: Resource not found.
        '500':
          description: |-
            | Code | Message |
            |------|-------------|
            | 500000 |Internal Server Error, Contact Lianlian Pay for technical support|
      tags:
        - 接口
      parameters:
        - in: header
          name: Authorization
          type: string
          required: true
        - in: header
          name: LLPAY-Signature
          type: string
          required: true
        - in: path
          name: webhookId
          type: string
          required: true
          description: 即查询WebHook列表接口返回id
    parameters:
      - name: webhookId
        in: path
        type: string
        required: true
    delete:
      responses:
        '200':
          description: ''
        '400':
          description: |-
            | Code | Message | Description |
            |------|-------------|-------------|
            | 400001 | Missing LLPAY-Signature header. |请求头缺失 |
            | 400003 | Invalid signature time. | 请求头时间戳不合法（请求消息包的签名时间和本地服务器的时间的最大允许阈值10min） |
            | 400006 | Signature validation failed. Contact Lianlian Pay for technical support. |验签异常，请参照授权流程中签名规则检查 |
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
              message:
                type: string
          examples:
            application/json:
              error: Bad request
              code: '400006'
              message: Signature validation failed. Contact Lianlian Pay for technical support.
        '404':
          description: 传入webhookId不存在
          examples:
            application/json:
              message: Resource not found.
        '500':
          description: |-
            | Code | Message |
            |------|-------------|
            | 500000 |Internal Server Error, Contact Lianlian Pay for technical support|
      summary: 删除WebHook
      description: |-
        删除已注册的WebHook

        联调地址 - **https://global-api-sandbox.lianlianpay-inc.com/common/v1/webhooks/{webhookId}** </br>
        生产地址 - **https://global-api.lianlianpay.com/common/v1/webhooks/{webhookId}**
      operationId: delete-webhook-registration
      tags:
        - 接口
      parameters:
        - in: header
          name: Authorization
          type: string
          required: true
        - in: header
          name: LLPAY-Signature
          type: string
          required: true
        - in: path
          name: webhookId
          type: string
          required: true
          description: 即查询WebHook列表接口返回id
  /events:
    get:
      responses:
        '200':
