swagger: '2.0'
info:
  title: 通用服务 API
  version: '1.0'
  description: |-
    联调域名 - **https://global-api-sandbox.lianlianpay-inc.com**</br>
    生产地址 - **https://global-api.lianlianpay.com**
  contact:
    name: Technical Support
    email: dev_support@lianlianpay.com
host: global-api-sandbox.lianlianpay-inc.com
paths:
  '/dictionaries/district/{code}':
    get:
      responses:
        '200':
          description: ''
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  type: object
                  properties:
                    code:
                      type: string
                      description: 省市区编码
                    name:
                      type: string
                      description: 省市区名称
          examples:
            application/json:
              items:
                - code: '110000'
                  name: 北京
                - code: '120000'
                  name: 天津
                - code: '130000'
                  name: 河北省
                - code: '140000'
                  name: 山西省
                - code: '150000'
                  name: 内蒙古自治区
                - code: '210000'
                  name: 辽宁省
                - code: '220000'
                  name: 吉林省
                - code: '230000'
                  name: 黑龙江省
                - code: '310000'
                  name: 上海
                - code: '320000'
                  name: 江苏省
                - code: '330000'
                  name: 浙江省
                - code: '340000'
                  name: 安徽省
                - code: '350000'
                  name: 福建省
                - code: '360000'
                  name: 江西省
                - code: '370000'
                  name: 山东省
                - code: '410000'
                  name: 河南省
                - code: '420000'
                  name: 湖北省
                - code: '430000'
                  name: 湖南省
                - code: '440000'
                  name: 广东省
                - code: '450000'
                  name: 广西壮族自治区
                - code: '460000'
                  name: 海南省
                - code: '500000'
                  name: 重庆
                - code: '510000'
                  name: 四川省
                - code: '520000'
                  name: 贵州省
                - code: '530000'
                  name: 云南省
                - code: '540000'
                  name: 西藏自治区
                - code: '610000'
                  name: 陕西省
                - code: '620000'
                  name: 甘肃省
                - code: '630000'
                  name: 青海省
                - code: '640000'
                  name: 宁夏回族自治区
                - code: '650000'
                  name: 新疆维吾尔自治区
                - code: '710000'
                  name: 台湾省
                - code: '810000'
                  name: 香港特别行政区
                - code: '820000'
                  name: 澳门特别行政区
        '400':
          description: |-
            | Code | Message | Description |
            |------|-------------|-------------|
            | 400001 | Missing LLPAY-Signature header. |请求头缺失 |
            | 400003 | Invalid signature time. | 请求头时间戳不合法（请求消息包的签名时间和本地服务器的时间的最大允许阈值10min） |
            | 400006 | Signature validation failed. Contact Lianlian Pay for technical support. |验签异常，请参照授权流程中签名规则检查 |
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
              message:
                type: string
          examples:
            application/json:
              error: Bad request
              code: '400003'
              message: Invalid signature time.
        '500':
          description: |-
            | Code | Message |
            |------|-------------|
            | 500000 |Internal Server Error, Contact Lianlian Pay for technical support|
      summary: 省市字典接口
      description: |-
        获取provincecode时，{code}请填写 `CHN`

        获取citycode时，code请填写对应provincecode

        联调地址 - **https://global-api-sandbox.lianlianpay-inc.com/common/v1/dictionaries/district/{code}** </br>
        生产地址 - **https://global-api.lianlianpay.com/common/v1/dictionaries/district/{code}**
      operationId: get-dictionaries-district-code
      tags:
        - 接口
      parameters:
        - in: path
          name: code
          type: string
          required: true
          description: '获取provincecode时，{code}请填写 `CHN`'
        - in: header
          name: Authorization
          type: string
          required: true
        - in: header
          name: LLPAY-Signature
          type: string
          required: true
    parameters:
      - name: code
        in: path
        type: string
        required: true
  /documents:
    post:
      responses:
        '200':
          description: ''
          schema:
            type: object
            properties:
              id:
                type: string
                description: 连连系统存储的attachmentId
              name:
                type: string
                description: 文件名
              createTime:
                type: string
                format: date-time
                description: 文件上传时间 UTC+0
            required:
              - id
              - name
              - createTime
          examples:
            application/json:
              id: '202105181010001'
              name: 收款人材料.zip
              createTime: '2021-05-18T07:48:22.000Z'
        '400':
          description: |-
            | Code | Message | Description |
            |------|-------------|-------------|
            | 400001 | Missing LLPAY-Signature header. |请求头缺失 |
            | 400003 | Invalid signature time. | 请求头时间戳不合法（请求消息包的签名时间和本地服务器的时间的最大允许阈值10min） |
            | 400006 | Signature validation failed. Contact Lianlian Pay for technical support. |验签异常，请参照授权流程中签名规则检查 |
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
              message:
                type: string
          examples:
            application/json:
              error: Bad request
              code: '400003'
              message: Invalid signature time.
        '500':
          description: |-
            | Code | Message |
            |------|-------------|
            | 500000 |Internal Server Error, Contact Lianlian Pay for technical support|
      summary: 上传附件
      description: |-
        本接口用于上传附件（例如贸易材料等）至连连系统. 目前支持的文件格式有 **PDF**, **JPG**,**JPEG**,**TIF**, **ZIP**,**RAR** 和 **PNG**.完成上传后，返回 `附件id`等信息。在其他接口中，如果需要用到附件，你需要传输对应的 `附件id`字段

        联调地址 - **https://global-api-sandbox.lianlianpay-inc.com/common/v1/documents** </br>
        生产地址 - **https://global-api.lianlianpay.com/common/v1/documents**
      operationId: upload-document
      tags:
        - 接口
      parameters:
        - in: header
          name: Authorization
          type: string
          required: true
        - in: formData
          name: file
          type: file
          required: true
        - in: header
          name: LLPAY-Signature
          type: string
          required: true
        - in: header
          name: Content-Type
          type: string
          required: true
          default: multipart/form-data
          description: multipart/form-data
        - in: header
          name: Idempotency-Key
          type: string
          description: 可以在http头加入Idempotency-Key以便让系统识别你的幂等请求
      consumes:
        - multipart/form-data
  '/documents/{Id}':
    get:
      responses:
        '200':
          description: ''
          schema:
            type: object
            properties: {}
          examples: {}
        '400':
          description: |-
            | Code | Message | Description |
            |------|-------------|-------------|
            | 400001 | Missing LLPAY-Signature header. |请求头缺失 |
            | 400003 | Invalid signature time. | 请求头时间戳不合法（请求消息包的签名时间和本地服务器的时间的最大允许阈值10min） |
            | 400006 | Signature validation failed. Contact Lianlian Pay for technical support. |验签异常，请参照授权流程中签名规则检查 |
        '404':
          description: 传入附件Id不存在
          examples:
            application/json:
              message: Resource not found.
        '500':
          description: |-
            | Code | Message |
            |------|-------------|
            | 500000 |Internal Server Error, Contact Lianlian Pay for technical support|
      parameters:
        - in: path
          name: Id
          type: string
          required: true
          description: 上传附件接口返回的Id
        - in: header
          name: Authorization
          type: string
          required: true
        - in: header
          name: LLPAY-Signature
          type: string
          required: true
      summary: 下载附件
      description: |-
        你可以通过上传附件接口返回的id进行附件文件的下载。

        联调地址 - **https://global-api-sandbox.lianlianpay-inc.com/common/v1/documents/{Id}** </br>
        生产地址 - **https://global-api.lianlianpay.com/common/v1/documents/{Id}**
      operationId: download-document
      tags:
        - 接口
      produces: []
    parameters:
      - name: Id
        in: path
        type: string
        required: true
  /verification-codes/SMS:
    post:
      responses:
        '200':
          description: ''
          schema: {}
        '400':
          description: |
            | Code | Message | Description |
            |------|-------------|-------------|
            | 110002 | Verification code send frequently. |每小时获取验证码上限10次 |
            | 400001 | Missing LLPAY-Signature header. |请求头缺失 |
            | 400003 | Invalid signature time. | 请求头时间戳不合法（请求消息包的签名时间和本地服务器的时间的最大允许阈值10min） |
            | 400006 | Signature validation failed. Contact Lianlian Pay for technical support. |验签异常，请参照授权流程中签名规则检查 |
            | 999995 | [verificationEnum]may not be null | 请求参数不合法 |
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
              message:
                type: string
          examples:
            application/json:
              code: '110002'
              message: Verification code send frequently.
        '500':
          description: |-
            | Code | Message |
            |------|-------------|
            | 500000 |Internal Server Error, Contact Lianlian Pay for technical support|
      summary: 获取短信验证码
      description: |-
        获取短信校验码，用于相关接口做二次验证，例如：币种账户提现、供应商付款等

        验证码会发送至连连账户当前绑定手机号

        每小时获取验证码上限10次

        联调地址 - **https://global-api-sandbox.lianlianpay-inc.com/common/v1/verification-codes/SMS** </br>
        生产地址 - **https://global-api.lianlianpay.com/common/v1/verification-codes/SMS**
      operationId: post-verification-codes
      tags:
        - 接口
      parameters:
        - in: body
          name: body
          schema:
            type: object
            properties:
              verificationEnum:
                type: string
                description: |-
                  | Value | Description |
                  |--------|------------|
                  | WITHDRAW_COMBINE| 币种账户提现校验码 |
                  | SUBMIT_PAYMENT | 供应商付款校验码 |
                enum:
                  - WITHDRAW_COMBINE
                  - SUBMIT_PAYMENT
            required:
              - verificationEnum
          x-examples:
            application/json:
              verificationEnum: SUBMIT_PAYMENT
        - in: header
          name: Authorization
          type: string
          required: true
        - in: header
          name: LLPAY-Signature
          type: string
          required: true
        - in: header
          name: Content-Type
          type: string
          required: true
          default: application/json
  /webhooks:
    post:
      responses:
        '200':
          description: ''
          schema:
            type: object
            title: 注册WebHook结果
            description: ''
            x-tags:
              - 对象
            properties:
              id:
                type: string
                description: 流水单号
                maxLength: 32
              url:
                type: string
                description: webhook url
                maxLength: 64
              topic:
                type: string
                title: Event-Topic枚举
                description: |
                  定义的Topic

                  | Topic | Event-Data名称| 描述|
                  |--------|------------|------------|
                  | withdraw.event.response | 提现Event|在提现成功、提现失败时触发相关事件|
                  | payment.order.status.response | 付款Event|在付款成功、付款失败时触发相关事件|
                x-tags:
                  - 对象
                enum:
                  - withdraw.event.response
                  - payment.order.status.response
              createTime:
                type: string
                description: 创建时间
                format: date-time
            required:
              - id
              - url
              - topic
              - createTime
          examples:
            application/json:
              id: 202103239016596&1138
              url: www.baidu.com
              createTime: '2021-03-23T10:46:19.000Z'
              topic: withdraw.event.response
        '400':
          description: |-
            | Code | Message | Description |
            |------|-------------|-------------|
            | 108012 | Duplicate Webhook Registration |重复注册Webhook |
            | 400001 | Missing LLPAY-Signature header. |请求头缺失 |
            | 400003 | Invalid signature time. | 请求头时间戳不合法（请求消息包的签名时间和本地服务器的时间的最大允许阈值10min） |
            | 400006 | Signature validation failed. Contact Lianlian Pay for technical support. |验签异常，请参照授权流程中签名规则检查 |
            | 999995 | [topic]can't be empty. | 请求参数不合法 |
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
              message:
                type: string
          examples:
            application/json:
              code: '108012'
              message: Duplicate Webhook Registration
        '500':
          description: |-
            | Code | Message |
            |------|-------------|
            | 500000 |Internal Server Error, Contact Lianlian Pay for technical support|
      summary: 注册WebHook
      description: |-
        注册webHook，系统会自动推送事件。

        联调地址 - **https://global-api-sandbox.lianlianpay-inc.com/common/v1/webhooks** </br>
        生产地址 - **https://global-api.lianlianpay.com/common/v1/webhooks**
      operationId: register-webhook
      parameters:
        - in: body
          name: body
          schema:
            type: object
            properties:
              topic:
                type: string
                description: |-
                  定义的Topic

                  | Topic | Event-Data名称| 描述|
                  |--------|------------|------------|
                  | withdraw.event.response | 提现Event|在提现成功、提现失败时触发相关事件|
                  | payment.order.status.response | 付款Event|在付款成功、付款失败时触发相关事件|
              url:
                type: string
                description: '回调接收地址："http://localhost"'
            required:
              - topic
              - url
          description: ''
          x-examples:
            application/json:
              topic: withdraw.event.response
              url: www.baidu.com
        - in: header
          name: Authorization
          type: string
          required: true
        - in: header
          name: LLPAY-Signature
          type: string
          required: true
        - in: header
          name: Content-Type
          type: string
          default: application/json
          required: true
      tags:
        - 接口
    get:
      responses:
        '200':
          description: ''
          schema:
            type: object
            properties:
              total:
                type: integer
                description: 总数
              list:
                type: array
                description: ''
                items:
                  type: object
                  title: 注册WebHook结果
                  description: ''
                  x-tags:
                    - 对象
                  properties:
                    id:
                      type: string
                      description: 流水单号
                      maxLength: 32
                    url:
                      type: string
                      description: webhook url
                      maxLength: 64
                    topic:
                      type: string
                      title: Event-Topic枚举
                      description: |
                        定义的Topic

                        | Topic | Event-Data名称| 描述|
                        |--------|------------|------------|
                        | withdraw.event.response | 提现Event|在提现成功、提现失败时触发相关事件|
                      x-tags:
                        - 对象
                    createTime:
                      type: string
                      description: 创建时间
                      format: date-time
                  required:
                    - id
                    - url
                    - topic
                    - createTime
            required:
              - total
              - list
          examples:
            application/json:
              list:
                - id: 202103239016596&1138
                  url: www.baidu.com
                  createTime: '2021-03-23T10:46:19.000Z'
                  topic: withdraw.event.response
              total: 1
        '400':
          description: |-
            | Code | Message | Description |
            |------|-------------|-------------|
            | 400001 | Missing LLPAY-Signature header. |请求头缺失 |
            | 400003 | Invalid signature time. | 请求头时间戳不合法（请求消息包的签名时间和本地服务器的时间的最大允许阈值10min） |
            | 400006 | Signature validation failed. Contact Lianlian Pay for technical support. |验签异常，请参照授权流程中签名规则检查 |
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
              message:
                type: string
          examples:
            application/json:
              error: Bad request
              code: '400006'
              message: Signature validation failed. Contact Lianlian Pay for technical support.
        '500':
          description: |-
            | Code | Message |
            |------|-------------|
            | 500000 |Internal Server Error, Contact Lianlian Pay for technical support|
      summary: 查询WebHook列表
      description: |-
        查询WebHook列表

        联调地址 - **https://global-api-sandbox.lianlianpay-inc.com/common/v1/webhooks** </br>
        生产地址 - **https://global-api.lianlianpay.com/common/v1/webhooks**
      operationId: get-webhook-registration-list
      tags:
        - 接口
      parameters:
        - in: body
          name: body
          schema: {}
        - in: header
          name: Authorization
          type: string
          required: true
        - in: header
          name: LLPAY-Signature
          type: string
          required: true
  '/webhooks/{webhookId}':
    get:
      summary: 查询WebHook
      description: |-
        通过webhookId查询WebHook

        联调地址 - **https://global-api-sandbox.lianlianpay-inc.com/common/v1/webhooks/{webhookId}** </br>
        生产地址 - **https://global-api.lianlianpay.com/common/v1/webhooks/{webhookId}**
      operationId: get-webhook-registration
      responses:
        '200':
          description: ''
          schema:
            type: object
