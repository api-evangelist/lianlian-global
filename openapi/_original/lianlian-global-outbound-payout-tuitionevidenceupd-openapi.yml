          Tuition evidence status, one of

          |value|descrption|
          |------|-------------|
          |AUDITING|Under review|
          |APPROVED|Approved|
          |REJECT|Rejected|
        enum:
          - AUDITING
          - APPROVED
          - REJECT
      riskStatus:
        type: string
        x-stoplight:
          id: 8ok2fdhp7nyny
        description: 'Risk status, return `PENDING` when intercepted by risk control.'
      failReason:
        type: string
        description: Failure reason
        maxLength: 128
      createTime:
        type: string
        format: date-time
        description: 'create time, UTC+0'
basePath: /outbound/bill/v1
