openapi: 3.2.0
info:
  title: Payment Payout API
  version: '1.0'
servers:
- url: http://localhost:3000
tags:
- name: Payout
paths:
  /v1/payout:
    post:
      summary: 发起付款
      operationId: post-v1-payout
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
        '400':
          description: Bad Request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                transaction_id:
                  type: string
                  description: 交易单号
                  maxLength: 32
                transaction_type:
                  type: string
                  description: 交易类型
                  enum:
                  - WITHDRAW
                  - PAYMENT
                  maxLength: 12
                member_id:
                  type: string
                  description: 出账会员id
                  maxLength: 32
                pricing_currency:
                  type: string
                  description: '定价币种，3位，参考：

                    https://www.iso.org/iso-4217-currency-codes.html'
                source_currency:
                  type: string
                  description: '出账币种，3位，参考：

                    https://www.iso.org/iso-4217-currency-codes.html'
                source_amount:
                  type: string
                  description: 出账金额，如果pricing_currency= source_currency则必填
                  maxLength: 16
                target_currency:
                  type: string
                  description: '入账币种，3位，参考：

                    https://www.iso.org/iso-4217-currency-codes.html'
                target_amount:
                  type: string
                  description: 入账金额，如果pricing_currency= target_currency则必填
                  maxLength: 16
                commission_undertaker:
                  type: string
                  description: 手续费承担方
                  enum:
                  - PAYER
                  - PAYEE
                  maxLength: 6
                payee_bank_account_number:
                  type: string
                  description: 收款人银行卡号
                  maxLength: 64
                payee_bank_country_code:
                  type: string
                  description: 收款人银行所在国家，2位，参考https://www.iso.org/iso-3166-country-codes.html
                payment_method:
                  type: string
                  enum:
                  - SWIFT
                  - LOCAL
                  description: 付款方式
                  maxLength: 12
                routing_type:
                  type: string
                  description: 路由号类型，`paymentMethod`=`LOCAL`时必传
                  maxLength: 16
                routing_number:
                  type: string
                  description: 路由号
                  maxLength: 32
                swift_code:
                  type: string
                  description: Swift code
                  maxLength: 11
                bank_name:
                  type: string
                  description: 银行名称
                  maxLength: 64
                trade_memo:
                  type: string
                  description: 交易附言
                  maxLength: 256
                trade_file_id:
                  type: string
                  description: 贸易材料id
                  maxLength: 64
              required:
              - transaction_id
              - transaction_type
              - member_id
              - pricing_currency
              - source_currency
              - target_currency
              - commission_undertaker
              - payee_bank_account_number
              - payee_bank_country_code
              - bank_name
      tags:
      - Payout
  /v1/payout/{transaction_id}:
    parameters:
    - schema:
        type: string
      name: transaction_id
      in: path
      required: true
    get:
      summary: 查询付款详情
      tags:
      - Payout
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
      operationId: get-v1-payout-transaction_id
components:
  schemas:
    Payout:
      title: Payout
      x-stoplight:
        id: b8r11rekmoc1h
      type: object
      description: 付款
      properties:
        transaction_id:
          type: string
          description: 交易单号
          maxLength: 32
        transaction_type:
          type: string
          description: 交易类型
          maxLength: 12
        member_id:
          type: string
          description: 出账会员id
          maxLength: 32
        pricing_currency:
          type: string
          description: 定价币种，3位，参考https://www.iso.org/iso-4217-currency-codes.html
        source_currency:
          type: string
          description: 出账币种，3位，参考https://www.iso.org/iso-4217-currency-codes.html
        source_amount:
          type: string
          description: 出账金额
          maxLength: 16
        target_currency:
          type: string
          description: 入账币种，3位，参考https://www.iso.org/iso-4217-currency-codes.html
        target_amount:
          type: string
          description: 入账金额
          maxLength: 16
        commission_undertaker:
          type: string
          description: 手续费承担方
          maxLength: 6
        payee_bank_account_number:
          type: string
          description: 收款人银行卡号
          maxLength: 64
        payee_bank_country_code:
          type: string
          description: 收款人银行code，2位
        payment_method:
          type: string
          description: 付款方式
          maxLength: 12
        routing_type:
          type: string
          description: 路由号类型
          maxLength: 16
        routing_number:
          type: string
          description: 路由号
          maxLength: 32
        swift_code:
          type: string
          description: Swift code
          maxLength: 11
        bank_name:
          type: string
          description: 银行名称
          maxLength: 64
        trade_memo:
          type: string
          description: 交易附言
          maxLength: 256
        trade_file_id:
          type: string
          description: 贸易材料id
          maxLength: 64
        rate:
          type: string
          description: 汇率
          maxLength: 16
        status:
          type: string
          description: 状态
          maxLength: 16
        failed_reason:
          type: string
          description: 失败原因
          maxLength: 128
        create_time:
          type: string
          description: 创建时间，10位 秒级时间戳
        modify_time:
          type: string
          description: 修改时间，10位 秒级时间戳
x-stoplight:
  id: 0mkcsrkgqrq96
