        data:
          type: object
          description: Event details
          required:
          - objectType
          - objectId
          properties:
            objectType:
              type: string
              description: "Object type related to this event. One of:\n\n| type | description |\n|------|-------------|\n|payer|topic related to payer|\n|funding|topic related to funding|\n|refunding|topic related to refunding|\n|tradefile|topic related to tradefile|\n|exchange|topic related to exchange|\n|exchangereturn|topic related to exhcnagereturn|\n|exchangecancel|topic related to exchangecancel|\n|payout|topic related to payout|\n|receipt|topic related to receipt|\n "
              enum:
              - profile
              - bill
              - account
              - document
            objectId:
              type: string
              description: Id of the object that related in this event
            url:
              type: string
              description: "Event related API endpoint. Can be used to retrive the data object related to this event from LianLian Global's system. \n\nHttp method accepted is `GET`, type is `application/json`"
        createTime:
          type: string
          description: Event created time, UTC+0
          format: date-time
        status:
          type: string
          description: 'Event status defined in LianLian Global''s system. One of:


            | status | description |

            |--------|-------------|

            | PROCESSING | Event is under processing |

            | SUCCESS | Successfully notified client via webhook. Received `200` HTTP status code return from registered webhook URL. |

            | MAXIMUM_RETRIES_REACHED | Callback notification stopped as maximum retrying number reached. |'
          enum:
