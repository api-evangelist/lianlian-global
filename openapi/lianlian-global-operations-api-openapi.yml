        | outbound.payout.success |Payout complete|

        | outbound.payout.failed |Payout failed|

        | outbound.payout.hedged |Payout Success first, then failure|

        | outbound.vcc.active| VCC Actived |

        | outbound.vcc.frozen| VCC Frozen |

        | outbound.vcc.expired| VCC Expired|

        | outbound.vcc.auth | VCC Authorization Transaction |

        | outbound.vcc.otp | Send VCC 3DS otp |

        |outbound.vcc.refund|VCC settlement refund|

        | outbound.vcc.blocked| VCC Blocked|

        | outbound.receipt.created | Receipt created|

        |outbound.receipt.failed|Receipt creation failed|

        |outbound.va.active|VA Actived|

        |outbound.va.frozen|VA Frozen|

        |outbound.va.block|VA Blocked|

