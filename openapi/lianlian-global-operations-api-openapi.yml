    Event:
      type: object
      title: 'Event '
      description: "Event object generated by Lianlian Pay's system. \n\nEvent is notified via registered webhook, and default status is `PROCESSING`. \n\nEvent status will be updated to `SUCCESS` after receiving `200` HTTP status code return from webhook url. Before success, Lianlian Pay will keep sending the event to registered webhook url every 60 minutes for 24 times in total. After all 24 retries without success, event status will then be updated to `MAXIMUM_RETRIES_REACHED`.\n"
      x-tags:
      - Models
      required:
      - id
      - topic
      - createTime
      - data
      - status
      - webhookURL
      properties:
        id:
          type: string
          description: Event id in Lianlian Pay's system
        topic:
          type: string
          description: 'Event topics defined in Lianlian Pay''s system.


            | Topic | Description |

            |------|-------------|

            | global.payee.successed | Payee successed. |

            | global.payee.failed | Payee failed. |

            |global.shop.successed|Shop audit successed|

            |global.shop.failed|Shop audit failed|

            | global.exchange.fx_successed |Exchange successed|

            | global.exchange.fx_failed |Exchange failed|

            | global.exchange.payout_successed|Payout successed|

            | global.exchange.payout_failed|Payout failed|

            | global.exchange.payout_hedged|Payout failed after success|

            | global.transaction.successed|Transaction successed|

            | global.transaction.failed|Transaction failed|

            | global.transaction.hedged|Transaction failed after success|

            |global.vcc.active|VCC Actived|

            |global.vcc.frozen|VCC Frozen|

            |global.vcc.expired|VCC Expired|

            |global.vcc.blocked|VCC Blocked|

            |global.vcc.auth|VCC Authorization Transaction|

            |global.vcc.otp|Send VCC 3DS OTP|

            |global.funding.processing|Funding received but not available |

            |global.funding.succeed|Funding received and available|

            |global.funding.returned|Funding return successful|

            |global.va.active|VA Actived|

            |global.va.frozen|VA Frozen|

            |global.va.block|VA Blocked|

            |global.va.debit|VA debit succeed|

            |global.va.reject|VA debit rejected|

            |global.va.verify|VA credit verify|

            |global.receipt.created|Receipt created|

            |global.receipt.failed|Receipt failed|

            |global.material.success|material audit success|

            |global.material.failed|material audit failed|

            |global.virtualCard.successed| Virtual Card successed|

            |global.virtualCard.failed|Virtual Card Failed|

            '
          enum:
          - global.payee.successed
          - global.payee.failed
          - global.exchange.fx_successed
          - global.exchange.fx_failed
          - global.exchange.payout_successed
          - global.exchange.payout_failed
          - global.exchange.payout_hedged
          - global.transaction.successed
          - global.transaction.failed
          - global.transaction.hedged
          - global.shop.successed
          - global.shop.failed
          - global.vcc.active
          - global.vcc.frozen
          - global.vcc.expired
          - global.vcc.blocked
          - global.vcc.auth
          - global.vcc.otp
          - global.funding.returned
          - global.funding.succeed
          - global.funding.processing
          - global.va.active
          - globa.va.frozen
          - globa.va.block
          - globa.va.debit
          - globa.va.reject
          - global.receipt.created
          - global.receipt.failed
          - global.material.success
          - global.material.failed
          - global.virtualCard.successed
          - global.virtualCard.failed
        createTime:
          type: string
          description: Event created time, UTC+0 timestamp
          format: date-time
        data:
          type: object
          description: Event details
          required:
          - objectType
          - objectId
          properties:
            objectType:
              type: string
              description: 'Object Type, one of


                |Type|Description|

                |---|---|

                |payee|topic related to payee|

                |exchange|topic related to exchange|

                |transaction|topic related to transaction|

                |shop|topic related to shop|

                |vcc|topic related to vcc|

                |enterOrder|topic related to funding|

                |va|topic related to va|

                |tradeFile|topic related to material|

                |virtualCard|topic related to virtualCard|'
              enum:
              - payee
              - exchange
              - transaction
              - shop
              - vcc
              - enterOrder
              - va
              - tradeFile
              - virtualCard
            objectId:
              type: string
              description: Object Id
            url:
              type: string
              description: You can get the object corresponding to the Event through the url
        status:
          type: string
          description: 'Event status defined in Lianlian Pay''s system. One of:


            | status | description |

            |--------|-------------|

            | PROCESSING | Event is under processing |

            | SUCCESS | Successfully notified client via webhook. Received `200` HTTP status code return from registered webhook URL. |

            | MAXIMUM_RETRIES_REACHED | Callback notification stopped as maximum retrying number reached. |'
          enum:
          - PROCESSING
          - SUCCESS
          - MAXIMUM_RETRIES_REACHED
        webhookURL:
          type: string
          description: Registered webhook url for this event
