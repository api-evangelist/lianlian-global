definitions:
  edu-info:
    title: edu-info
    x-stoplight:
      id: 143jsr4j6f6u9
    type: object
    x-internal: false
    description: "Educational payment trade material model.It is required when tradeCode in \"223022\", \"223021\", \"229030\"\nTrade Code, one of \n|Code|Description|\n|---|----|\n|223022|Study Abroad Related|\n|223021|Going Abroad for medical treatment|\n|229030|Telemedicine|"
    properties:
      beneficiaryName:
        type: string
        x-stoplight:
          id: c07yobyc0ms5m
        description: The payee or an individual or enterprise related to the payee.For example, schools, educational institutions, etc
      beneficiaryIdNo:
        type: string
        x-stoplight:
          id: 9s32mkszdgmja
        description: beneficiary IdNo
      beneficiaryAddress:
        type: string
        x-stoplight:
          id: izha60mqwtra8
        description: 'beneficiary address '
      relationship:
        type: string
        x-stoplight:
          id: razmoh4z3to2g
        description: "Payee and beneficiary relationship, one of:\r\n\r\nIf payee type is \"INDIVIDUAL\"\r\n\r\n| value | description |\r\n|--------|-------------|\r\n|SELF| payee is beneficiary |\r\n|FAMILY| Payee is the family member of beneficiary|\r\n|IMMEDIATE FAMILY| Parents, children, spouse|\r\n|OTHER RELATIVES|Any relative other than \"Parents, children, spouse\"|\r\n|FRIEND|Friends|\r\n|OTHER |other relationship|\r\n\r\nIf payee type is \"CORPORATE\" \r\n\r\n| value | description |\r\n|--------|-------------|\r\n|ORGANIZATION|The company/school to which the student belongs|\r\n|INTERMEDIARY|Student commissioned agency|\r\n|OTHER |other relationship|"
      tradeBackground:
        type: string
        x-stoplight:
          id: fdaun4tc460s7
        description: "trade background, one of\r\n\r\n|Code|Description|\r\n|----|----|\r\n|GLOBAL_TUITION|tuition fee|"
      directToBeneficiary:
        type: string
        x-stoplight:
          id: wg722ljuc4o3a
