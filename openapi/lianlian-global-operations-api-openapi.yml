    post:
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/payment-model'
        '400':
          description: 'Error - payment not processed


            | Code | Message | Client Action | LianLian Action |

            |------|---------|-------|---------|

            |154008 | Client has insufficient balance to pay merchant| Client to wire more funds to LianLian account | Waits for funds |

            |154011 | Currency not supported| Client validates Currency used in request. |

            |154014 | merchant_client_id does not exist. |Client may call the ''Start New Merchant Registration'' interface in the Merchant Modeling.  ||

            |154016 | Merchant is blocked from receiving payments| Suggest merchant to contact LianLian for details |Is typically having offline discussion with merchant|

            |999995 | Invalid Parameter|Client updates request body values according to error code returned by LianLian.|Waits for a new request|'
          content:
            application/json:
              schema:
                $ref: ./error.oas2.yml#/definitions/error-model
      summary: Send Payment to Merchant
      description: "Initiates a payment to specific merchant. \n\nThis call is Idempotent if sent with the same payment_client_id and last payment request was successfull.  In this case the additional HTTP Response Header `Request-Repeated: true` will be returned.  If the original request failed, a new payment request will retry the payment.\n\nSteps within API:\n\n* **Money Debited** from client's account  \n can fail from insufficient funds  \n* **Verify Merchant Registration** information is valid  \n  If Merchant is unknown, call fails  \n  If Merchant status is `blocked`, call fails  \n* **Send Money** to merchant  \n  If any issues arise, LianLian customer support helps fix issues and finalize transfer\n\nThis call returns HTTP Status 200 on success and returns the payment object including Lianlian internal payment status. **Success** guarantees the money has been debited from the client account.\n\nOn failure the API returns HTTP Status 400 with an Error object specifying the error code why the payment failed.\n"
      operationId: create-payment
      tags:
      - Operations
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - merchant_client_id
              - payment_client_id
              - currency
              - amount
              properties:
                merchant_client_id:
                  type: string
                  description: Client's Merchant ID to make payment to.
                payment_client_id:
                  type: string
                  description: Client's Payment ID for this payment request.  **Must be unique and is usually a UUID**
                currency:
                  type: string
                  description: 3 letter code of payment currency
                  enum:
                  - CNY
                  - USD
                amount:
                  type: string
                  description: Amount to pay merchant
                note:
                  type: string
                  description: Additional information to help track payment
                trade_type:
                  type: string
                  x-stoplight:
                    id: 3z8qp95j08n5c
                  description: "Please don't put this attribute into request body, if we have not reqeusted.<br>\nthe trade type of the payment <br>\nallow value:0,1,2\n0: defaul value. GOODS payment \n1: SURETY payment\n2: COMMISSION payment"
      security:
      - authorization: []
      - llp-signature: []
    servers:
    - url: https://global-api-sandbox.lianlianpay-inc.com/payments/v2
