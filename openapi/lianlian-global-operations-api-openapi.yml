              title: TuitionInfo
              type: object
              description: Tuition information defined in Lianlian Pay's system
              x-tags:
              - Models
              properties:
                tradeFileId:
                  type: string
                  description: Unique Id for this Trade Information
                  maxLength: 32
                payerInfo:
                  type: object
                  properties:
                    payerId:
                      type: string
                      maxLength: 32
                      description: unique payer ID from client
                    payerName:
                      type: string
                      description: payer name in Chinese
                      maxLength: 128
                    payerIdNo:
                      type: string
                      description: payer identification number
                      maxLength: 64
                relationship:
                  type: string
                  description: "Payer and beneficiary relationship, one of:\n\nIf payer type is \"INDIVIDUAL\"\n\n| value | description |\n|--------|-------------|\n|SELF| payer is beneficiary |\n|FAMILY| Payer is the family member of beneficiary|\n|IMMEDIATE FAMILY| Parents, children, spouse|\n|OTHER RELATIVES|Any relative other than \"Parents, children, spouse\"|\n|FRIEND|Friends|\n|OTHER |other relationship|\n\nIf payer type is \"CORPORATE\" \n\n| value | description |\n|--------|-------------|\n|ORGANIZATION|The company/school to which the student belongs|\n|INTERMEDIARY|Student commissioned agency|\n|OTHER |other relationship|"
                  enum:
                  - SELF
                  - IMMEDIATE FAMILY
                  - OTHER RELATIVES
                  - FRIEND
                  - ORGANIZATION
                  - INTERMEDIARY
                  - OTHER
                fundingId:
                  type: array
                  description: Unique funding ID in Lianlian Pay's system
                  items:
                    type: string
                    maxLength: 64
                institutionName:
                  type: string
                  description: "Institution Name,one of \n|trade background|Institution|\n|----|-----|\n|Medical Related|Hosptial|\n|Study Abroad Related|University|"
                  maxLength: 128
                institutionCountry:
                  type: string
                  description: "Institution country/country code， see Appendix-Country Code\n                                                                  "
                  maxLength: 3
                tradeCurrency:
                  type: string
                  description: Trade currency, reference to the appendix Currency Code
                  maxLength: 3
                tradeAmount:
                  type: string
                  description: Trade amount
                  maxLength: 24
                beneficiaryName:
                  type: string
                  description: "beneficiary name，one of \n|trade background|beneficiary|\n|----|-----|\n|Medical Care|Patient|\n|Study Abroad Related|Student|"
                  maxLength: 128
                beneficiaryIdNo:
                  type: string
                  description: Beneficiary identification number
                  maxLength: 64
                beneficiaryAddress:
                  type: string
                  maxLength: 256
                  description: Beneficiary address
                attachment:
                  type: string
                  description: Document id, supported file extensions are PDF, JPG, GIF. 5 documents at most.
                  maxLength: 256
                tradeBackground:
                  type: string
                  description: 'trade background, one of


                    |Code|Description|

                    |----|----|

                    |tuition|tuition fee|

                    |quarterage|quarterage fee|

                    |insurance|insurance|

                    |custodyFee|student custody fee|

                    |guarantee|guarantee fee|

                    |medical|medical related fee|

                    |other|other|'
                  enum:
                  - tuition
                  - quarterage
                  - insurance
                  - custodyFee
                  - guarantee
                  - other
                directToBeneficiary:
                  type: string
                  description: "Whether the fee is paid directly to the beneficiary, one of \n\n|Code|Description|\n|----|-----|\n|N|N0|\n|Y|YES|"
                  enum:
                  - Y
                  - N
                payChannel:
                  type: string
                  description: Payment channel， mandatory if directToBeneficiary = N
              required:
              - tradeFileId
              - fundingId
              - institutionName
              - institutionCountry
              - tradeCurrency
              - tradeAmount
              - beneficiaryName
              - attachment
              - tradeBackground
              - directToBeneficiary
