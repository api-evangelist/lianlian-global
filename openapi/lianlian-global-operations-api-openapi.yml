    event_4:
      type: object
      title: 'Event '
      description: "Event object generated by LianLian Global's system. \n\nEvent is notified via registered webhook, and default status is `PROCESSING`. \n\nEvent status will be updated to `SUCCESS` after receiving `200` HTTP status code return from webhook url. Before success, LianLian Global will keep sending the event to registered webhook url every 60 minutes for 24 times in total. After all 24 retries without success, event status will then be updated to `MAXIMUM_RETRIES_REACHED`."
      x-tags:
      - Models
      required:
      - id
      - topic
      - data
      - createTime
      - status
      - webhookURL
      properties:
        id:
          type: string
