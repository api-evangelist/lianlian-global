    event_2:
      type: object
      title: 'Event '
      description: "Event object generated by LianLian Global's system. \n\nEvent is notified via registered webhook, and default status is `PROCESSING`. \n\nEvent status will be updated to `SUCCESS` after receiving `200` HTTP status code return from webhook url. Before success, LianLian Global will keep sending the event to registered webhook url every 60 minutes for 24 times in total. After all 24 retries without success, event status will then be updated to `MAXIMUM_RETRIES_REACHED`."
      x-tags:
      - Models
      properties:
        id:
          type: string
          description: Event id in LianLian Global's system
        topic:
          $ref: '#/components/schemas/event-topic-enum_2'
        data:
          type: object
          description: Event details
          required:
          - objectType
          - objectId
          properties:
            objectType:
              type: string
              description: "Object type related to this event. One of:\n\n| type | description |\n|------|-------------|\n|payer|topic related to payer|\n|funding|topic related to funding|\n|refunding|topic related to refunding|\n|tradefile|topic related to tradefile|\n|exchange|topic related to exchange|\n|exchangereturn|topic related to exhcnagereturn|\n|exchangecancel|topic related to exchangecancel|\n|payout|topic related to payout|\n|vcc|topic related to vcc|\n|cnypay|topic related to CNY payment|\n|receipt|topic related to receipt|\n "
              enum:
              - profile
              - bill
              - account
              - document
            objectId:
              type: string
              description: Id of the object that related in this event
            url:
              type: string
              description: "Event related API endpoint. Can be used to retrive the data object related to this event from LianLian Global's system. \n\nHttp method accepted is `GET`, type is `application/json`"
        createTime:
          type: string
          description: Event created time, UTC+0
          format: date-time
        status:
          type: string
          description: 'Event status defined in LianLian Global''s system. One of:


            | status | description |

            |--------|-------------|

            | PROCESSING | Event is under processing |

            | SUCCESS | Successfully notified client via webhook. Received `200` HTTP status code return from registered webhook URL. |

            | MAXIMUM_RETRIES_REACHED | Callback notification stopped as maximum retrying number reached. |'
          enum:
          - PROCESSING
          - SUCCESS
          - MAXIMUM_RETRIES_REACHED
        webhookURL:
          type: string
          description: Registered webhook url for this event
      required:
      - id
      - topic
      - data
      - createTime
      - status
      - webhookURL
