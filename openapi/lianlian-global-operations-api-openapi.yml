 lianlian-global-outbound-payout-tuitionevidenceupd-openapi.yml, lianlian-global-outbound-payout-verification-cny-va-openapi.yml, lianlian-global-outbound-payout-verification-event-openapi.yml, lianlian-global-outbound-payout-verification-exchangetrans-openapi.yml, lianlian-global-outbound-payout-verification-payer-openapi.yml, lianlian-global-outbound-payout-verification-payout-openapi.yml, lianlian-global-outbound-payout-verification-tradefile-openapi.yml, lianlian-global-outbound-payout-verification-webhook-openapi.yml, lianlian-global-outbound-payout-webhook-openapi.yml, lianlian-global-standard-remittance-declare-openapi.yml, lianlian-global-standard-remittance-document-openapi.yml, lianlian-global-standard-remittance-event-openapi.yml, lianlian-global-standard-remittance-order-openapi.yml, lianlian-global-standard-remittance-payer-openapi.yml, lianlian-global-standard-remittance-tradefile-openapi.yml. Each path carries the servers of the definition it was published in.'
