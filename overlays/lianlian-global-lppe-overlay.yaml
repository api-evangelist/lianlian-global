overlay: 1.0.0
info:
  title: API Evangelist enhancements for LianLian Global lppe
  version: 1.0.0
extends: openapi/lianlian-global-lppe-payouts-openapi.yml
actions:
- target: $.info
  update:
    x-apievangelist-provider: lianlian-global
    x-apievangelist-product: lppe
    x-apievangelist-portal: https://developer.lianlianglobal.com/docs/lppe/72b66de24898e-introduction
    x-apievangelist-source: Stoplight export from developer.lianlianglobal.com
    x-apievangelist-artifacts:
      authentication: authentication/lianlian-global-authentication.yml
      conventions: conventions/lianlian-global-conventions.yml
      errors: errors/lianlian-global-problem-types.yml
      webhooks: asyncapi/lianlian-global-webhooks.yml
      lifecycle: lifecycle/lianlian-global-lifecycle.yml
      sandbox: sandbox/lianlian-global-sandbox.yml
      data_model: data-model/lianlian-global-data-model.yml
- target: $.info
  update:
    x-idempotency:
      header: Idempotency-Key
      required: false
      description: A unique value generated by the client which the server uses to recognize subsequent retries
        of the same request.
- target: $.info
  update:
    x-environments:
      sandbox: https://global-api-sandbox.lianlianpay-inc.com
      production: https://global-api.lianlianpay.com
