aid: lianlian-global
name: LianLian Global
description: LianLian Global (连连国际) is the cross-border payments arm of LianLian DigiTech, providing licensed collection,
  disbursement, foreign exchange and card issuing rails for e-commerce sellers, marketplaces, travel platforms and
  B2B traders moving money between China and the rest of the world. Its developer platform publishes 18 distinct
  API products on a Stoplight portal at developer.lianlianglobal.com — covering B2C marketplace collection, multi-currency
  e-wallets, global payout, B2B import/export settlement, standard remittance, tuition and travel payments, embedded
  Connect accounts, virtual and physical card issuing, and the OAuth 2.0 LPPE platform surface — backed by 173 published
  OpenAPI/Swagger specifications describing more than 550 operations. LianLian authenticates with API keys and OAuth
  2.0, signs every request and webhook with RSA SHA-256 via the LLPAY-Signature header, and ships first-party Java
  and TypeScript SDKs, a Python sandbox CLI and three published AI agent skills from its LLGlobal GitHub organization.
