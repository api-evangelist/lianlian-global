provisioning:
  tool: EW DevTool
  url: https://github.com/LLGlobal/lianlian-devtool
  steps:
  - python main.py register — create a sandbox account and submit KYC
  - wait for KYC approval from the LianLian dev team
  - python main.py developer — activate the developer account and receive API credentials
  notes: For the signature-based products, developer credentials (developer_id, master_token, LianLian public key)
