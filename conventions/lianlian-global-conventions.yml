style: REST over HTTPS, JSON request and response bodies, HTTP status codes for outcome.
authentication:
  models:
  - OAuth 2.0 (client_credentials and authorization_code) on the LPPE platform surface
  - 'HTTP Basic API key: Authorization: Basic base64(developerId:masterToken) on the signature-based products'
  request_signing:
    header: LLPAY-Signature
    format: t=<epoch_seconds>,v=<base64_signature>
    algorithm: SHA256WithRSA
    payload: HTTP_METHOD&URI&REQUEST_EPOCH&REQUEST_PAYLOAD
    example_payload: POST&/api/mkt/balance&1533715688&{"currency":"USD"}
    notes: Both parties exchange RSA public keys; LianLian signs its responses and webhooks with its own key for
      verification.
  transport: HTTPS only — plain HTTP calls fail.
  artifact: authentication/lianlian-global-authentication.yml
idempotency:
  supported: true
  header: Idempotency-Key
  required: false
  scope: per request; the server uses the value to recognise subsequent retries of the same request
  documented_in: OpenAPI header parameter across document, funding, payout and webhook operations
  retention: null
  webhook_guidance: Webhook delivery is at-least-once and unordered — consumers must de-duplicate on LLPAY-Delivery-ID
    and process events idempotently.
pagination:
  style: page-number
  params:
  - page_num
  - page_size
  alternate_params:
  - pageSize
  - limit
  notes: Page-based listing is the dominant convention across products; parameter casing varies between the older
    Swagger 2.0 products (page_num/page_size) and the newer OpenAPI 3.1 products (pageSize).
request_tracing:
  field: request_id
  location: request body
  description: Callers send a unique request_id on each API request; quote it to support to locate logs.
  error_field: trace_id
  error_field_retention: 15 days
metadata:
