format_note: LianLian Global does not use RFC 9457 application/problem+json. Non-200 responses carry a JSON body
  with code, message, param and trace_id.
envelope:
  fields:
  - field: code
    description: Unique code identifying the reason for the error
  - field: message
    description: Detailed explanation of the error
  - field: param
    description: The specific request parameter at fault, dotted for nested fields (e.g. beneficiary.address.country_code)
  - field: trace_id
    description: Trace identifier for LianLian support to locate debug logs; valid for 15 days
